name: rot-envchk
networks:
  ot:  { internal: true, ipam: { config: [ { subnet: 10.231.10.0/24, gateway: 10.231.10.1 } ] } }
  dmz: { internal: true, ipam: { config: [ { subnet: 10.231.20.0/24, gateway: 10.231.20.1 } ] } }
  it:  { ipam: { config: [ { subnet: 10.231.30.0/24, gateway: 10.231.30.1 } ] } }
services:
  router:
    build: .
    image: rot-envchk-router:t1
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: "1" }
    ports: ["127.0.0.1:39018:8000"]
    networks:
      it:  { ipv4_address: 10.231.30.2, gw_priority: 1 }
      ot:  { ipv4_address: 10.231.10.2, aliases: [dmz-broker] }
      dmz: { ipv4_address: 10.231.20.2 }
  otapp:
    image: python:3.12-slim
    command: ["sh","-c","mkdir -p /w && echo ot-ok > /w/index.html && cd /w && python -m http.server 8000"]
    networks: { ot: { ipv4_address: 10.231.10.10 } }
  dmzsrv:
    image: python:3.12-slim
    command: ["sh","-c","mkdir -p /w && echo dmz-ok > /w/index.html && cd /w && for p in 1883 9090 8086 8088 5555; do python -m http.server $$p & done; wait"]
    networks: { dmz: { ipv4_address: 10.231.20.10 } }
  itapp:
    image: python:3.12-slim
    command: ["sleep","infinity"]
    networks: { it: { ipv4_address: 10.231.30.10, aliases: [] } }
  dmzbroker:
    image: eclipse-mosquitto:2.1.2-alpine
    user: root
    entrypoint: ["sh","-c","cp /cfg/* /mosquitto/config/ && chown -R mosquitto:mosquitto /mosquitto/config /mosquitto/data && chmod 0700 /mosquitto/config/passwd /mosquitto/config/acl && exec mosquitto -c /mosquitto/config/mosquitto.conf"]
    volumes: ["./mq/dmz:/cfg:ro", "dmzmq:/mosquitto/data"]
    networks: { dmz: { ipv4_address: 10.231.20.11 } }
  othub:
    image: eclipse-mosquitto:2.1.2-alpine
    user: root
    environment: { PROTO: "${PROTO:-mqttv50}", MAXQ: "${MAXQ:-1000}" }
    entrypoint: ["sh","-c","cp /cfg/passwd /cfg/acl /mosquitto/config/ && sed -e \"s/__PROTO__/$$PROTO/\" -e \"s/__MAXQ__/$$MAXQ/\" /cfg/mosquitto.conf.tmpl > /mosquitto/config/mosquitto.conf && chown -R mosquitto:mosquitto /mosquitto/config /mosquitto/data && chmod 0700 /mosquitto/config/passwd /mosquitto/config/acl && exec mosquitto -c /mosquitto/config/mosquitto.conf"]
    volumes: ["./mq/ot:/cfg:ro", "otmq:/mosquitto/data"]
    networks: { ot: { ipv4_address: 10.231.10.11 } }
volumes:
  dmzmq:
  otmq:
