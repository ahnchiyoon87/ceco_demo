name: rot-envchk-pg18
services:
  pg:
    image: postgres:18.6-alpine
    environment: { POSTGRES_PASSWORD: pgtestpw }
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/init.sql:ro", "pgdata:/var/lib/postgresql"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres"], interval: 5s, retries: 20 }
  graph:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    healthcheck: { test: ["CMD-SHELL","NEO4J_USERNAME=neo4j NEO4J_PASSWORD=$${NEO4J_AUTH#*/} cypher-shell 'RETURN 1' >/dev/null 2>&1"], interval: 10s, retries: 18, start_period: 30s }
  knowledge:
    image: rot-ai-knowledge:latest
    environment:
      NEO4J_URI: bolt://graph:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      DB_HOST: pg
      DB_PORT: "5432"
      DB_NAME: ai
      DB_USER: ai_app
      DB_PASSWORD: aitestpw
      SIMULATOR_ACTIONS_ENABLED: "false"
      SANDBOX_BACKEND: local
      LOCAL_SANDBOX_ROOT: /workspace
      SANDBOX_WORKDIR: /workspace
    depends_on: { pg: { condition: service_healthy }, graph: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL","curl -fsS http://localhost:8000/openapi.json >/dev/null"], interval: 10s, retries: 18, start_period: 30s }
  worker:
    image: rot-ai-alarm-worker:latest
    command: ["python", "-m", "backend.src.modules.operations.consumer"]
    environment: { DB_HOST: pg, DB_PORT: "5432", DB_NAME: ai, DB_USER: ai_app, DB_PASSWORD: aitestpw, KAFKA_BOOTSTRAP_SERVERS: "nokafka:9092" }
    depends_on: { pg: { condition: service_healthy } }
volumes: { pgdata: {} }
