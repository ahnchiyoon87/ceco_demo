name: rot-envchk-plc
networks: { plcnet: { ipam: { config: [ { subnet: 10.231.40.0/24 } ] } } }
services:
  sim:
    image: rot-plant-simulator:v2-ts
    networks: [plcnet]
  plc:
    image: ghcr.io/autonomy-logic/openplc-runtime:v4.2.4
    cap_add: [SYS_NICE, SYS_RESOURCE]
    volumes: ["plcdata:/var/run/runtime"]
    networks: [plcnet]
  builder:
    image: rot-envchk-plcbuilder:t1
    networks: [plcnet]
    volumes: ["./work:/work"]
    entrypoint: ["sleep","infinity"]
  probe:
    image: rot-envchk-probe:t1
    build: { context: ., dockerfile_inline: "FROM python:3.12-slim\nRUN pip install --no-cache-dir pymodbus==3.8.6\n" }
    networks: [plcnet]
    entrypoint: ["sleep","infinity"]
volumes: { plcdata: {} }
