# ═══════════════════════════════════════════════════════════════════════════
# IIoT / SCADA 실시간 파이프라인 — 코어 스택
#   Tier 1 현장에지 → Tier 2 수집/백본 → Tier 3 스트림+ML → Tier 4 저장/관제
# EdgeX 계층은 docker-compose.edgex.yml 에 분리되어 있습니다 (.env COMPOSE_FILE).
# ═══════════════════════════════════════════════════════════════════════════

networks:
  iiot:
    name: iiot

volumes:
  kafka-data:
  flink-checkpoints:
  influx-data:
  grafana-data:
  prometheus-data:
  fuxa-appdata:
  fuxa-db:
  model-store:

services:

  # ───────────────────────── Tier 1 · 현장 에지 ─────────────────────────
  plant-simulator:
    build: ./simulator
    image: iiot/plant-simulator:1.0
    container_name: plant-simulator
    hostname: plant-simulator
    restart: unless-stopped
    networks: [iiot]
    ports:
      - "${PORT_SIM_MODBUS}:502"      # Modbus/TCP — FUXA 양방향 제어 진입점
      - "${PORT_SIM_API}:8080"        # 고장 주입 REST API
    environment:
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS}
      # lite 프로파일에서만 true (make lite). EdgeX 를 우회해 EMQX 로 직발행.
      DIRECT_MQTT_ENABLE: ${DIRECT_MQTT_ENABLE:-false}
      MQTT_HOST: emqx
      MQTT_TOPIC_PREFIX: iiot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ─────────────────── Tier 2 · IoT 수집 미들웨어 & 백본 ───────────────────
  emqx:
    image: emqx/emqx:${EMQX_VERSION}
    container_name: emqx
    hostname: emqx
    restart: unless-stopped
    networks: [iiot]
    ports:
      - "${PORT_EMQX_MQTT}:1883"
      - "${PORT_EMQX_DASHBOARD}:18083"
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    networks: [iiot]
    ports:
      - "${PORT_KAFKA}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${PORT_KAFKA}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: iiot-scada-kraft-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka-init
    networks: [iiot]
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  # ── MQTT → Kafka 브리지 (EMQX OSS 에 Kafka Sink 가 없어 Telegraf 가 대행) ──
  telegraf-bridge:
    image: telegraf:${TELEGRAF_VERSION}
    container_name: telegraf-bridge
    hostname: telegraf-bridge
    restart: unless-stopped
    networks: [iiot]
    profiles: [edgex]
    depends_on:
      emqx: { condition: service_healthy }
      kafka: { condition: service_healthy }
    volumes:
      - ./telegraf/bridge-edgex.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      SITE: ${SITE}

  # ── lite 프로파일: EdgeX 우회. 시뮬레이터가 EMQX 로 직발행한 것을 수집 ──
  telegraf-bridge-lite:
    image: telegraf:${TELEGRAF_VERSION}
    container_name: telegraf-bridge-lite
    hostname: telegraf-bridge-lite
    restart: unless-stopped
    networks: [iiot]
    profiles: [lite]
    depends_on:
      emqx: { condition: service_healthy }
      kafka: { condition: service_healthy }
    volumes:
      - ./telegraf/bridge-lite.conf:/etc/telegraf/telegraf.conf:ro

  # ───────────────── Tier 3 · 분산 스트림 처리 & 머신러닝 ─────────────────
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: iiot/flink-onnx:1.0
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    restart: unless-stopped
    networks: [iiot]
    command: jobmanager
    ports:
      - "${PORT_FLINK_UI}:8081"
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - ./flink/conf/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./flink/sql:/opt/flink/sql:ro
      - flink-checkpoints:/opt/flink/checkpoints
      - model-store:/opt/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  flink-taskmanager:
    image: iiot/flink-onnx:1.0
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    restart: unless-stopped
    networks: [iiot]
    command: taskmanager
    depends_on:
      flink-jobmanager: { condition: service_healthy }
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - ./flink/conf/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./flink/sql:/opt/flink/sql:ro
      - flink-checkpoints:/opt/flink/checkpoints
      - model-store:/opt/models:ro

  # 오프라인 학습 (1회 실행). 정상 운전 데이터 → Autoencoder → ONNX 익스포트.
  # PDF p.10: 오프라인 학습 주기와 온라인 추론 주기는 철저히 분리한다.
  model-trainer:
    build:
      context: .
      dockerfile: ml/Dockerfile
    image: iiot/model-trainer:1.0
    container_name: model-trainer
    networks: [iiot]
    restart: "no"
    volumes:
      - model-store:/opt/models

  # 기동 시 Flink 잡 2종을 자동 제출 (사용자 조작 불필요)
  flink-job-submitter:
    image: iiot/flink-onnx:1.0
    container_name: flink-job-submitter
    networks: [iiot]
    restart: "no"
    depends_on:
      flink-jobmanager: { condition: service_healthy }
      flink-taskmanager: { condition: service_started }
      kafka-init: { condition: service_completed_successfully }
      model-trainer: { condition: service_completed_successfully }
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
      - ./flink/submit-jobs.sh:/submit-jobs.sh:ro
      # 클라이언트용 설정으로 교체 (서버 config 의 rest.address 는 0.0.0.0 이라 사용 불가)
      - ./flink/conf/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - model-store:/opt/models:ro
    entrypoint: ["/bin/bash", "/submit-jobs.sh"]

  # ───────────────────── Tier 4 · 저장 · 감시 · 관제 ─────────────────────
  influxdb:
    image: influxdb:${INFLUXDB_VERSION}
    container_name: influxdb
    hostname: influxdb
    restart: unless-stopped
    networks: [iiot]
    ports:
      - "${PORT_INFLUXDB}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  telegraf-sink:
    image: telegraf:${TELEGRAF_VERSION}
    container_name: telegraf-sink
    hostname: telegraf-sink
    restart: unless-stopped
    networks: [iiot]
    depends_on:
      influxdb: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./telegraf/sink.conf:/etc/telegraf/telegraf.conf:ro

  # Kafka 알람 → MQTT 재발행. FUXA 가 P&ID 화면에서 알람을 점멸시키는 경로.
  alert-republisher:
    image: telegraf:${TELEGRAF_VERSION}
    container_name: alert-republisher
    hostname: alert-republisher
    restart: unless-stopped
    networks: [iiot]
    depends_on:
      kafka: { condition: service_healthy }
      emqx: { condition: service_healthy }
    volumes:
      - ./telegraf/alert-republish.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    networks: [iiot]
    ports:
      - "${PORT_GRAFANA}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb: { condition: service_healthy }

  # 웹 SCADA: P&ID 관제 + Modbus 양방향 제어 (Grafana 가 못 하는 영역)
  fuxa:
    image: frangoteam/fuxa:latest
    container_name: fuxa
    hostname: fuxa
    restart: unless-stopped
    networks: [iiot]
    ports:
      - "${PORT_FUXA}:1881"
    volumes:
      - fuxa-appdata:/usr/src/app/FUXA/server/_appdata
      - fuxa-db:/usr/src/app/FUXA/server/_db
    depends_on:
      plant-simulator: { condition: service_healthy }
      emqx: { condition: service_healthy }

  # 기동 시 P&ID 화면·태그바인딩·제어버튼을 REST 로 자동 주입
  fuxa-provisioner:
    image: python:3.12-slim
    container_name: fuxa-provisioner
    networks: [iiot]
    restart: "no"
    depends_on:
      fuxa: { condition: service_started }
    volumes:
      - ./fuxa:/work:ro
    working_dir: /work
    environment:
      FUXA_URL: http://fuxa:1881
      PORT_FUXA: ${PORT_FUXA}
    command: ["python", "-u", "provision.py"]

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    networks: [iiot]
    ports:
      - "${PORT_PROMETHEUS}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION}
    container_name: alertmanager
    hostname: alertmanager
    restart: unless-stopped
    networks: [iiot]
    ports:
      - "${PORT_ALERTMANAGER}:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    hostname: kafka-exporter
    restart: unless-stopped
    networks: [iiot]
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: { condition: service_healthy }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    hostname: cadvisor
    restart: unless-stopped
    networks: [iiot]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
