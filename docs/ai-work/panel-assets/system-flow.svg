<text x="584" y="356.36" font-family="Malgun Gothic, sans-serif" font-size="26" font-weight="700" fill="#ffffff">02</text>
<text x="571" y="441.98" font-family="Malgun Gothic, sans-serif" font-size="43" font-weight="700" fill="#173548">설비·문서 연결</text>
<text x="571" y="492.8" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="700" fill="#187f75">온톨로지 · Neo4j</text>
<text x="571" y="559.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">센서 ↔ 설비 ↔ 적용 문서</text>
<text x="571" y="607.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">게시된 설비 관계로 조회</text>
<text x="571" y="655.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">문서 버전과 출처 확인</text>
<text x="571" y="705.5" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="400" fill="#627885">사전 준비: 자료 등록·관계 검토</text>
