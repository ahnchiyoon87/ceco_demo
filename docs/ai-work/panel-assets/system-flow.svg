<text x="1550" y="356.36" font-family="Malgun Gothic, sans-serif" font-size="26" font-weight="700" fill="#ffffff">04</text>
<text x="1537" y="441.98" font-family="Malgun Gothic, sans-serif" font-size="43" font-weight="700" fill="#173548">사람이 결정</text>
<text x="1537" y="492.8" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="700" fill="#aa7440">승인 · 반려</text>
<text x="1537" y="559.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">근거와 대응안 확인</text>
<text x="1537" y="607.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">검토 의견과 결정 기록</text>
<text x="1537" y="655.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">승인 전에는 명령 없음</text>
<text x="1537" y="705.5" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="400" fill="#627885">반려·근거 보완 시 명령 없음</text>
<path d="M1724,739 L1724,781" stroke="#7e9ba8" stroke-width="4"/>
<polygon points="1724,781 1716,769 1732,769" fill="#7e9ba8"/>
<rect x="60" y="796" width="1879" height="220" rx="20" fill="#e8f3ef" stroke="#c5ded6" stroke-width="2"/>
<text x="88" y="848.38" font-family="Malgun Gothic, sans-serif" font-size="33" font-weight="700" fill="#176858">승인 후에도 다시 확인합니다</text>
<text x="88" y="924.1" font-family="Malgun Gothic, sans-serif" font-size="35" font-weight="700" fill="#214d43">01  실행 조건 재검사</text>
<text x="88" y="978.08" font-family="Malgun Gothic, sans-serif" font-size="28" font-weight="400" fill="#4b6b61">최신 관측 · 대상 · 문서 · 인터록</text>
<text x="730" y="924.1" font-family="Malgun Gothic, sans-serif" font-size="35" font-weight="700" fill="#214d43">02  시뮬레이터 조치</text>
<text x="730" y="978.08" font-family="Malgun Gothic, sans-serif" font-size="28" font-weight="400" fill="#4b6b61">허용된 교반기 정지 명령</text>
<text x="1365" y="924.1" font-family="Malgun Gothic, sans-serif" font-size="35" font-weight="700" fill="#214d43">03  새 관측으로 확인</text>
<text x="1365" y="978.08" font-family="Malgun Gothic, sans-serif" font-size="28" font-weight="400" fill="#4b6b61">정지 확인 후에도 정비는 대기</text>
