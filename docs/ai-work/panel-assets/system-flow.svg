<text x="64" y="1080.22" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="400" fill="#5b7180">가상 공정 기반 교육·전시 시연  |  구성 설명 그림 · 실제 서비스 캡처 아님</text>
<text x="64" y="1122.5" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="400" fill="#5b7180">사건·조회 근거·검토·조치 결과는 업무 DB에 보존합니다. 정지 확인은 원인 제거·정비 완료를 뜻하지 않습니다.</text>
