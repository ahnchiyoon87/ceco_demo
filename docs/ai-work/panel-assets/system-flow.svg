<text x="1054" y="441.98" font-family="Malgun Gothic, sans-serif" font-size="43" font-weight="700" fill="#173548">근거 분석</text>
<text x="1054" y="492.8" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="700" fill="#5c62a0">Luna · LiteLLM 중계</text>
<text x="1054" y="559.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">사건 당시와 현재 비교</text>
<text x="1054" y="607.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">관측·문서 도구 조회</text>
<text x="1054" y="655.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">원인 후보·미확인 항목 정리</text>
<text x="1054" y="705.5" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="400" fill="#627885">검토할 대응안 또는 근거 보완</text>
<path d="M1468,510 L1496,510" stroke="#7e9ba8" stroke-width="4"/>
