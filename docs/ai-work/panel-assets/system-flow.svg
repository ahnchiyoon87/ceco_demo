<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1160" viewBox="0 0 2000 1160">
<title>온톨로지 기반 제조 AI 업무도우미 시스템 구성도</title>
<desc>SCADA 알람, 지식 연결, AI 분석, 사람 검토와 승인 후 결과 확인의 실제 구현 구조를 설명한다. 서비스 화면 캡처가 아니다.</desc>
<rect x="0" y="0" width="2000" height="1160" rx="0" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="2"/>
<text x="64" y="68.36" font-family="Malgun Gothic, sans-serif" font-size="26" font-weight="700" fill="#147c70">ASSEMBLY  /  MANUFACTURING AI</text>
<text x="60" y="156.76" font-family="Malgun Gothic, sans-serif" font-size="66" font-weight="700" fill="#142e40">알람에서 근거 있는 대응까지</text>
<text x="64" y="224.24" font-family="Malgun Gothic, sans-serif" font-size="34" font-weight="400" fill="#294255">기존 SCADA 위에 지식 연결과 AI 업무 흐름을 더합니다.</text>
<rect x="60" y="294" width="430" height="434" rx="20" fill="#ffffff" stroke="#dce5ea" stroke-width="2"/>
<rect x="88" y="322" width="66" height="50" rx="10" fill="#476e88" stroke="#476e88" stroke-width="2"/>
