<text x="88" y="441.98" font-family="Malgun Gothic, sans-serif" font-size="43" font-weight="700" fill="#173548">이상 신호 수집</text>
<text x="88" y="492.8" font-family="Malgun Gothic, sans-serif" font-size="30" font-weight="700" fill="#476e88">기존 IIoT · SCADA</text>
<text x="88" y="559.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">가상 반응기 AR-100</text>
<text x="88" y="607.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">전류·진동 알람 수신</text>
<text x="88" y="655.94" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="400" fill="#294255">관련 알람을 사건으로 묶기</text>
<text x="88" y="705.5" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="400" fill="#627885">센서 이력 · 원본 알람 보존</text>
