# ═══════════════════════════════════════════════════════════════════════════
# Kafka sensor.alerts → MQTT 재발행
#
# FUXA 는 MQTT 클라이언트를 내장하므로, 알람을 MQTT 로 되돌려주면
# P&ID 화면에서 해당 설비 심볼을 점멸시키거나 알람 배너를 띄울 수 있다.
# ═══════════════════════════════════════════════════════════════════════════
[agent]
  interval = "1s"
  flush_interval = "1s"
  omit_hostname = true

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["sensor.alerts"]
  consumer_group = "telegraf-alert-republish"
  offset = "newest"
  name_override = "alert"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "alert"
    timestamp_path = "ts"
    timestamp_format = "unix_ns"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "site"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "device"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "tag"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "alert_type"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "severity"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "detector"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "value"
      type = "float"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "detail"
      type = "string"

[[outputs.mqtt]]
  servers = ["tcp://emqx:1883"]
  topic = "scada/alerts/{{ .Tag \"tag\" }}"
  qos = 1
  client_id = "alert-republisher"
  data_format = "json"
  json_timestamp_units = "1ns"

# FUXA maps incoming topics by exact address; a wildcard subscription alone
# receives messages but does not update its tag registry. Keep the original
# per-sensor JSON output and supply a dedicated readable latest-event topic.
[[outputs.mqtt]]
  servers = ["tcp://emqx:1883"]
  topic = "scada/hmi/latest-alert"
  qos = 1
  client_id = "alert-republisher-hmi"
  data_format = "template"
  template = '{{ .Time.UTC.Format "01-02 15:04:05" }} UTC | {{ .Tag "severity" }} | {{ .Tag "tag" }} | {{ .Tag "alert_type" }}'
