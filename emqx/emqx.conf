## ═══════════════════════════════════════════════════════════════
## EMQX 5.x — IIoT 수집 미들웨어
## PDF p.4 "무손실 수집" 권고 반영: QoS1 + 세션 영속 + 충분한 큐
## ⚠ Kafka Sink(데이터 통합 브리지)는 EMQX Enterprise 전용이므로
##   OSS 에서는 telegraf-bridge 가 MQTT→Kafka 를 담당한다.
## ═══════════════════════════════════════════════════════════════

node {
  name = "emqx@127.0.0.1"
  cookie = "iiot-scada-secret"
  data_dir = "/opt/emqx/data"
}

cluster { discovery_strategy = manual }

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 100000
}

listeners.ssl.default   { enable = false }
listeners.ws.default    { bind = "0.0.0.0:8083" }
listeners.wss.default   { enable = false }
listeners.quic.default  { enable = false }

dashboard {
  listeners.http { bind = 18083 }
  default_username = "admin"
  default_password = "public"
}

## ── 세션 영속성: 물리계층 단절 시 브로커가 미전송 메시지를 보존 ──
force_shutdown { enable = false }

mqtt {
  max_packet_size = 1MB
  max_qos_allowed = 2
  retain_available = true
  ## 오프라인 세션 만료: 에지 게이트웨이 단절 후 재접속까지 메시지 보존
  session_expiry_interval = 2h
  ## 오프라인 큐 — 단절 구간 메시지 보존량
  max_mqueue_len = 100000
  mqueue_store_qos0 = false
  max_inflight = 128
}

## ── Prometheus 노출 (인프라 감시 전용, 센서 데이터 아님) ──
prometheus {
  enable_basic_auth = false
  collectors {
    mnesia = disabled
    vm_dist = disabled
    vm_memory = enabled
  }
}

authorization {
  no_match = allow
  deny_action = ignore
}

log {
  console { enable = true, level = warning }
  file { enable = false }
}
