# ═══ IT 수집기 ⑦ 발송: 승인된 작업 요청(Kafka request.approved) → DMZ 게이트웨이(HTTP POST) → 응답 ⓐ 기록 + 사본(request.events·audit.copy) ═══
#   정본은 PostgreSQL workflow·audit(추가 전용). 보내기 전에 'dispatched' 사건을 먼저 남기고, 마지막 사건이 approved 인 요청만 보낸다
#   (같은 승인 메시지가 다시 와도 다시 보내지 않는다 — 발송 직후 멈추면 결과는 업무 서비스가 ACK 시간 초과로 '결과 모름'으로 표시).
#   게이트웨이의 동기 응답이 첫 겹 ⓐ(경계 수용/거부 + 이유)다. 재시도하지 않는다.
input:
  kafka_franz:
    seed_brokers: [ kafka:9092 ]
    topics: [ request.approved ]
    consumer_group: it-dispatcher
    client_id: it-dispatcher
pipeline:
  processors:
    - mapping: root.job_order_id = this.job_order_id
    - sql_raw:
        driver: postgres
        dsn: postgres://dispatcher:${PG_DISPATCHER_PASSWORD}@postgres:5432/plant?sslmode=disable
        query: |
          WITH r AS (SELECT * FROM workflow.request_status WHERE job_order_id = $1 AND last_kind = 'approved'),
          e AS (INSERT INTO workflow.request_event(job_order_id, kind, detail, source)
                SELECT job_order_id, 'dispatched', jsonb_build_object('gateway', $2::text), 'dispatcher' FROM r RETURNING job_order_id),
          a AS (INSERT INTO audit.log(actor_type, actor_id, action, job_order_id, detail)
                SELECT 'system', 'it-dispatcher', 'dispatched', job_order_id, '{}'::jsonb FROM e)
          SELECT r.job_order_id, r.work_master_id, r.equipment_id, r.job_order_parameters::text AS params, r.requester, r.requester_type,
                 r.approver, extract(epoch FROM r.created_at)::float8 AS created_at, r.context::text AS context
          FROM r JOIN e USING (job_order_id)
        args_mapping: root = [ this.job_order_id, "http://dmz-gateway:8088/requests" ]
    - mapping: |
        root = if this.length() == 0 { deleted() } else {
          this.index(0).without("params", "context").assign({
            "job_order_parameters": this.index(0).params.parse_json(),
            "context": this.index(0).context.parse_json().catch(deleted()),
          })
        }
        meta job_order_id = this.index(0).job_order_id.catch("")
        meta t0 = now().ts_unix_nano()
    - http:
        url: http://dmz-gateway:8088/requests
        verb: POST
        headers:
          Content-Type: application/json
          Authorization: Bearer ${GATEWAY_CLIENT_TOKEN}
        timeout: 5s
        retries: 0
        successful_on: [ 400, 401, 409, 422, 503 ]   # 게이트웨이의 거부도 정상 응답(ⓐ)으로 받는다
    - catch:
        - mapping: |
            root = {"status": "REJECTED",
                    "reason": if @http_status_code != null { "HTTP_" + @http_status_code.string() } else { "GATEWAY_UNREACHABLE" }}
    - mapping: |
        root = {
          "job_order_id": @job_order_id,
          "kind": if this.status.catch("") == "ACCEPTED" { "gateway_accepted" } else { "gateway_rejected" },
          "status": this.status.catch(null), "reason": this.reason.catch(null),
          "http_status": (@http_status_code | 0).number(), "expires_at": this.expires_at.catch(null),
          "latency_ms": ((now().ts_unix_nano() - @t0) / 100000).round() / 10,
        }
    - branch:
        request_map: root = this
        processors:
          - sql_raw:
              driver: postgres
              dsn: postgres://dispatcher:${PG_DISPATCHER_PASSWORD}@postgres:5432/plant?sslmode=disable
              query: |
                WITH e AS (INSERT INTO workflow.request_event(job_order_id, kind, status, reason, detail, source)
                           VALUES ($1, $2, $3, $4, $5::jsonb, 'dispatcher') RETURNING at),
                a AS (INSERT INTO audit.log(actor_type, actor_id, action, job_order_id, subject, detail)
                      VALUES ('system', 'it-dispatcher', $2, $1, $3, $6::jsonb))
                SELECT at FROM e
              args_mapping: |
                let d = {"http_status": this.http_status, "expires_at": this.expires_at, "latency_ms": this.latency_ms}
                root = [ this.job_order_id, this.kind, this.status, this.reason, $d.format_json(), $d.assign({"reason": this.reason}).format_json() ]
        result_map: root.at = this.index(0).at
    - log:
        level: INFO
        message: '${! json("job_order_id") } → 게이트웨이 ${! json("http_status") } ${! json("status") } ${! json("reason") | "" }'
output:
  broker:
    pattern: fan_out
    outputs:
      - kafka_franz:
          seed_brokers: [ kafka:9092 ]
          topic: request.events
          key: ${! json("job_order_id") }
          client_id: it-dispatcher-events
      - kafka_franz:
          seed_brokers: [ kafka:9092 ]
          topic: audit.copy
          key: ${! json("job_order_id") }
          client_id: it-dispatcher-audit
        processors:
          - mapping: |
              root = {"actor_type": "system", "actor_id": "it-dispatcher", "action": this.kind, "job_order_id": this.job_order_id,
                      "status": this.status, "reason": this.reason, "at": this.at}
