# ═══════════════════════════════════════════════════════════════
# Flink 2.2.1 서버 설정(JobManager·TaskManager 공용, config.yaml 형식)
# 부하: 태그 12개 × 초당 1건. 잡 4개(규칙 SQL 3 + ONNX 1)가 병렬도 1로 슬롯 4개를 쓴다.
# ═══════════════════════════════════════════════════════════════
# 장애 복구는 Flink 기본값(체크포인트가 켜져 있으면 exponential-delay: 1 s 부터 1.5배, 최대 1분)

heartbeat:
  timeout: 120000
  interval: 10000

jobmanager:
  rpc:
    address: flink-jobmanager
    port: 6123
  memory:
    process:
      size: 768m    # 힙 사용 약 250 MB
  execution:
    failover-strategy: region
  bind-host: 0.0.0.0

# Java 17 모듈 접근 옵션. 이미지 기본 config.yaml 을 이 파일로 덮으므로 함께 둔다(없으면 잡 제출 때 InaccessibleObjectException).
env:
  java:
    opts:
      all: --add-exports=java.base/sun.net.util=ALL-UNNAMED --add-exports=java.rmi/sun.rmi.registry=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED

taskmanager:
  bind-host: 0.0.0.0
  host: flink-taskmanager
  numberOfTaskSlots: 4
  memory:
    process:
      size: 1024m
    managed:
      fraction: 0.0 # HashMap 상태 저장은 관리 메모리를 쓰지 않는다(공식 문서)

parallelism:
  default: 1

rest:
  address: 0.0.0.0
  bind-address: 0.0.0.0

execution:
  checkpointing:
    interval: 10s
    mode: EXACTLY_ONCE
    timeout: 60s
    min-pause: 5s
    externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    dir: file:///opt/flink/checkpoints
    savepoint-dir: file:///opt/flink/savepoints

state:
  backend:
    type: hashmap                 # 태그 12개 창 상태라 작다. 체크포인트·HA 복구 지원

# ── Prometheus 노출: 체크포인트 소요·실패, 백프레셔 등 인프라 지표(공정 데이터는 InfluxDB) ──
metrics:
  reporter:
    prom:
      factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      port: 9249
  reporters: prom

# ── 고가용성: ZooKeeper 가 잡 목록·최신 체크포인트 위치를 보관해, 다시 시작한 JobManager 가 잡을 되살린다 ──
high-availability:
  type: zookeeper
  storageDir: file:///opt/flink/checkpoints/ha   # 체크포인트 볼륨(flink 사용자 소유) 안
  cluster-id: /ar100
  zookeeper:
    quorum: zookeeper:2181
    path:
      root: /flink
