# 데이터소스(HANDOFF §2-1 ③): 공정 결과는 IT InfluxDB, OT 원시값은 DMZ 사본(읽기 전용 계정·InfluxQL), 플랫폼은 Prometheus
apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influx
    type: influxdb
    access: proxy
    url: http://it-influx:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${IT_INFLUX_BUCKET}
      httpMode: POST
    secureJsonData:
      token: ${IT_INFLUX_TOKEN}

  - name: DMZ 원시 사본
    uid: dmz-raw
    type: influxdb
    access: proxy
    url: http://dmz-influx:8086
    user: ${DMZ_INFLUX_READER_USER}
    jsonData:
      dbName: ${DMZ_INFLUX_BUCKET}
      httpMode: GET
    secureJsonData:
      password: ${DMZ_INFLUX_READER_PASSWORD}

  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 10s
