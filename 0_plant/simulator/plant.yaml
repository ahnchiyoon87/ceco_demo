# ═══════════════════════════════════════════════════════════════
# AR-100 반응기 라인 — 공정 정의
# 이 파일만 수정하면 태그·물리파라미터·레지스터맵이 모두 바뀝니다.
# ═══════════════════════════════════════════════════════════════
site: AR-100
device: reactor-line-01
scan_interval_ms: 1000
# 물리 배속(기본값): 온도·액위·마모 등 공정 변화에만 적용. 스캔·발행은 1초 그대로.
# 이상을 넣으면 10초 안에 화면·알람에 나타나야 한다 → 600배(히터 고착 약 3초에 상한 초과, 알람까지 약 6초).
# 모든 서서히 진행하는 현상(공정 물리·과정 고장·생산 스케줄)이 이 하나의 시계를 따른다. 순간 사건만 실제 초.
physics_time_scale: 600
physics_max_substep_s: 5

# ── 계측 태그 (12점) ───────────────────────────────────────────
#  hr: float32 가 기록될 홀딩 레지스터 시작 주소 (2 워드 소비) — 현장 장치의 레지스터 맵
#  단위·설명·규격(USL/LSL)은 설비 등록부(shared/registry/equipment.yaml)가 정본이다.
tags:
  - { name: LT-101, hr: 0,  clamp_lo: 0.0 }
  - { name: LT-102, hr: 2,  clamp_lo: 0.0 }
  - { name: TT-101, hr: 4 }
  - { name: TT-102, hr: 6 }
  - { name: PT-101, hr: 8,  clamp_lo: 0.0 }
  - { name: FT-101, hr: 10, clamp_lo: 0.0 }
  - { name: FT-102, hr: 12, clamp_lo: 0.0 }
  - { name: IT-101, hr: 14, clamp_lo: 0.0 }
  - { name: IT-102, hr: 16, clamp_lo: 0.0 }
  - { name: VT-101, hr: 18, clamp_lo: 0.0 }
  - { name: pH-101, hr: 20, clamp_lo: 0.0 }
  - { name: CT-101, hr: 22, clamp_lo: 0.0 }

# ── 제어 포인트 (Southbound) — 이 레지스터에 쓰는 것은 soft-PLC 하나뿐이다 ──────
commands:
  coils:
    pump_run:      { addr: 0 }   # P-101 공급펌프 기동
    agitator_run:  { addr: 1 }   # M-101 교반기 기동
    heater_enable: { addr: 2 }   # HX-101 재킷히터 Enable
    cooler_enable: { addr: 3 }   # HX-102 가상 냉각기 Enable
  holding:
    pump_speed_sp: { addr: 100, min: 0, max: 100, default: 60 }     # P-101 속도 SP [%]
    valve_open_sp: { addr: 101, min: 0, max: 100, default: 45 }     # CV-101 밸브 개도 SP [%]
    temp_sp_x10:   { addr: 102, min: 200, max: 1000, default: 720 } # 반응기 온도 SP [degC*10]
  # 스캔 순번 (UINT32, 2워드) — 중복·누락 진단, ML 입력 창을 설비 스캔에 맞춘다
  # 설비 시각 [s] (UINT32, 2워드) — 배속 적용된 물리 시각. PLC 생산 스케줄·ML 입력 창이 쓴다
  # 둘 다 계측값 바로 뒤에 두어 한 번의 Modbus 읽기로 값·순번·시각을 함께 가져가게 한다(같은 스캔).
  sequence: { addr: 24 }
  plant_time: { addr: 26 }

# ── 현장 패널(현장 스위치 입력) — PLC 가 Modbus 로 읽는다. 사람은 패널 화면(API_PANEL_PORT)으로만 조작 ──
#   seq 항목은 누를 때마다 1 씩 오르는 카운터(순간 버튼). PLC 는 값이 바뀐 것을 눌림으로 본다.
field_panel:
  base: 300
  registers:
    mode_selector: 300       # 0=LOCAL, 1=REMOTE (현장 모드 선택 스위치)
    local_cmd_seq: 301       # 현장 기동·정지 버튼 눌림 카운터
    local_cmd_code: 302      # 명령 코드(1 펌프, 2 교반기, 3 히터, 4 냉각기)
    local_cmd_value: 303     # 1=기동, 0=정지
    maint_on_seq: 304        # 정비 모드 켜기 버튼
    maint_release_seq: 305   # 정비 해제 키
    operator_id: 306         # 담당자 ID(숫자)
    estop: 307               # 비상정지 눌림(1) — 가상설비 안에서 래치, 리셋 전까지 유지
    reset_seq: 308           # 비상정지 리셋 버튼

# ── 물리 모델 파라미터 ────────────────────────────────────────
physics:
  feed_tank:
    area_m2: 3.0
    height_m: 4.0
    refill_m3h: 14.0         # 보충 최대 유량(액위 제어가 0~최대 사이로 조절)
    level_sp_pct: 70.0       # 원료탱크 액위 제어 목표(고정 보충이면 몇 시간 뒤 넘쳐 LT-101 상한 알람 상시)
    level_kp: 0.5            # [m3/h per %]
  reactor:
    area_m2: 2.2
    height_m: 3.5
    ambient_c: 22.0
    headspace_ref_frac: 0.45      # 기준 헤드스페이스 비율
    charge_pressure_bara: 3.4     # N2 블랭킷 초기 충전압 [bar abs]
    cp_kj_kgk: 4.18
    rho_kg_m3: 1000.0
    heat_loss_kw_per_k: 0.055
  pump:
    max_flow_m3h: 14.0
    rated_current_a: 11.0
    no_load_current_a: 2.4
  valve:
    cv: 10.0
  heater:
    max_power_kw: 700.0
    kp: 45.0                 # 재킷 온도 P 제어 게인 (P-only 이므로 소폭 droop 존재)
  cooler:
    # 교육용 열 제거 모델. 실제 공장 설계 용량이나 안전 기준이 아니다.
    max_power_kw: 900.0
    kp: 45.0
  agitator:
    rated_current_a: 8.0
    base_vibration_mms: 2.1
  # 유압 릴리프 밸브식 압력 상한: 제어기·네트워크가 끌 수 없는 마지막 보호(기계 안전 기능 흉내).
  # 제어 인터록(PLC, 6.5 barg 트립)보다 높게 둔다. 설계 압력 흉내 값이며 실제 설비 기준이 아니다.
  relief:
    set_barg: 7.5
  reaction:
    ph_setpoint: 7.4
    ph_drift_per_degc: -0.012
    conductivity_base: 3.4
    conductivity_per_ph: -0.85

# ── 생산 스케줄(autopilot): 정상 운전 변동 ────────────────────
# 설정치를 주기적으로 완만히 바꾸는 생산 스케줄. 운영에서는 soft-PLC 프로그램이 이 값으로 스케줄을 돈다
# (PLC 가 설비의 유일한 쓰기 주인, shared/registry/generate.py 가 PLC 프로그램에 넣는다). 가상설비 자신은 스케줄을 끈다.
# 학습기(4_it/ml-trainer/train.py)는 같은 값으로 물리를 직접 돌려 정상 데이터를 만든다(enabled 를 켜서).
# 운전원이 설정치를 바꾸면 해당 설정치는 hold_after_manual_s(실제 초) 동안 스케줄에서 빠진다.
autopilot:
  enabled: false
  period_s: 86400            # 설정치 재추첨 주기(설비 1일 — 생산 스케줄, 설비 시계)
  ramp_s: 7200               # 목표까지 완만히 이동(설비 2시간)
  hold_after_manual_s: 300   # 수동 조작 후 autopilot 재개까지 대기(사람 행동 — 실제 초)
  ranges:
    pump_speed_sp: [45, 80]
    valve_open_sp: [35, 60]
    temp_sp_c:     [64, 80]

# ── 계측 노이즈 (정상 운전) ───────────────────────────────────
noise:
  LT-101: 0.05
  LT-102: 0.05
  TT-101: 0.06
  TT-102: 0.09
  PT-101: 0.012
  FT-101: 0.04
  FT-102: 0.04
  IT-101: 0.03
  IT-102: 0.025
  VT-101: 0.06
  pH-101: 0.006
  CT-101: 0.012

# ── 고장 주입 시나리오 ────────────────────────────────────────
# POST /fault {"scenario":"<key>", "duration_s":30}
faults:
  # kind: process = 서서히 진행하는 물리 과정 → 설비 시계(현실 시간으로 정의, 배속을 따라 자연스럽게 빨라짐)
  #       event   = 순간 사건 → 관측 시계(실제 초)
  # 시간 값은 그 시계의 단위다. 배속 600 에서 설비 1시간 = 실제 6초.
  heater_stuck:
    desc: "히터 출력 고착: 정지 명령과 무관하게 열 공급 지속 (실제 모형 온도 변화)"
    kind: process
    default_duration_s: 86400        # 수리 전까지(설비 1일)
    target: [TT-101, TT-102]
  cooling_loss:
    desc: "냉각 능력 상실: 냉각 명령이 켜져도 열 제거 없음"
    kind: process
    default_duration_s: 86400
    target: [TT-101, TT-102]
  dropout:
    desc: "TT-101 발행 중단 → Flink 결측치 보간(LOCF/선형) 검증"
    kind: event
    default_duration_s: 5            # 통신 결측 사건 길이(실제 초). Flink 보간은 결측이 끝난 뒤 채운다
    target: [TT-101]
  spike:
    desc: "PT-101 순간 과압 → Tier-1 USL 규칙 + 고압 인터록 검증"
    kind: event
    default_duration_s: 8
    target: [PT-101]
    magnitude: 3.6
  noise:
    desc: "TT-101 분산 급증 → Tier-1 롤링 Z-Score 검증"
    kind: event
    default_duration_s: 30
    target: [TT-101]
    magnitude: 14.0
  bearing_wear:
    desc: "IT-102 상승 후 VT-101 상승 → Flink CEP MATCH_RECOGNIZE 검증"
    kind: process
    default_duration_s: 86400
    target: [IT-102, VT-101]
    wear_ramp_s: 600                 # 전류 쪽 마모 진행 설비 시간(10분) — 배속 600 에서 1스캔 안에 전류 상한 초과
    lag_s: 300                       # 진동이 따라오기 시작하는 설비 시간(5분) — 진동은 다음 스캔(전류 먼저·진동 나중 유지)
    vib_ramp_s: 600                  # 진동 쪽 진행(10분). 알람 시간은 대부분 CEP 워터마크 5초
  drift:
    desc: "pH-101/CT-101 동시 미세 드리프트 → 단일 임계치 무반응, Autoencoder만 탐지"
    kind: process
    default_duration_s: 86400
    target: [pH-101, CT-101]
    magnitude: 0.55
    ramp_s: 3600                     # 드리프트가 최대까지 오르는 설비 시간(1시간)
  # 브로커·브리지 단절은 가상설비가 아니라 라우터 규칙·컨테이너 정지로 만든다(tests/e2e).
