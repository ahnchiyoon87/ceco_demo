# ═══════════════════════════════════════════════════════════════════════════
# V2 — IIoT / SCADA 기반 (회전 1 결과, 조립 중)
#
#   V1 → V2 에서 바뀐 것(근거는 reports/decision-log.md)
#     · 수집: EdgeX 10개 + EMQX + 중계기#1 → Telegraf 한 대가 설비를 읽어 Kafka 에 바로 씀(구조 재조립 ②, v2/telegraf/ingest.conf)
#     · 저장·알람 Kafka 커넥터: Telegraf #2·#3 → Bento 한 대(v2/bento/*.yaml) — Vector 0.58 은 소비 재개 버그로 교체(#132)
#     · 브로커: EMQX(무료판 지원 종료) → Mosquitto 2.1.2 (알람을 FUXA 화면에 보내는 일만 남음)
#     · 이상탐지: Flink 1.20.1 → 2.2.1 + 재시작 복구(ZooKeeper HA, #94) — 규칙 SQL·ONNX 잡 로직은 V1 그대로
#     · 같은 제품은 지원되는 최신판으로 고정: Kafka 4.3.1, Telegraf 1.40.1, InfluxDB 2.9.1, Grafana 13.2.2,
#       Prometheus v3.15.0, Alertmanager v0.34.1, cAdvisor v0.60.6, kafka-exporter v1.10.0, FUXA 1.3.4
#
#   실행(격리 이름은 .env.rotation 의 rot-iiot):
#     docker compose --env-file .env --env-file .env.rotation -f docker-compose.v2.yml up -d
#   서비스 이름(kafka·influxdb·plant-simulator·flink-jobmanager)은 V1 과 같다 — AI 층(ai-layer)은 수정 없이 붙는다.
#   볼륨은 -v2 이름을 새로 쓴다 — V1 볼륨(측정 증거 상태)은 건드리지 않는다.
# ═══════════════════════════════════════════════════════════════════════════

networks:
  iiot:
    name: ${SCADA_NETWORK:-iiot}
  field:            # 설비 전용망(설비 ↔ 수집기). 수집기의 백본 쪽 연결만 끊어도 설비 읽기는 계속된다(R02 를 V1 과 같은 의미로)
    name: ${SCADA_NETWORK:-iiot}-field

volumes:
  ingest-buffer-v2:      # 수집기 디스크 버퍼(컨테이너 재생성에도 유지, 땜빵 점검표 #9)
  kafka-data-v2:
  flink-checkpoints-v2:
  influx-data-v2:
  influx-config-v2:   # /etc/influxdb2(CLI 접속 설정). 이름 없는 볼륨이면 같은 이름 컨테이너 재생성 때 V1 설정이 넘어와 초기 설정이 'config name "default" already exists' 로 실패(#124)
  grafana-data-v2:
  grafana-data-v3:
  prometheus-data-v2:
  fuxa-appdata-v2:
  fuxa-db-v2:
  model-store-v2:
  mqtt-data-v2:
  zookeeper-data-v2:

x-restart: &restart
  restart: unless-stopped
  networks: [iiot]

services:
  # ── L1 설비(가상) ─────────────────────────────────────────────────────────
  plant-simulator:
    <<: *restart
    image: rot-plant-simulator:v2-ts        # 배속 600 기본값(simulator/plant.yaml), 레지스터 지도는 V1 과 같음
    container_name: ${CN_PREFIX:-}plant-simulator
    networks:
      iiot: {}
      field:
        aliases: [plant-field]   # 설비 전용망에서만 보이는 이름. 수집기는 이 이름으로 읽는다 — plant-simulator 는 백본망 주소로 풀려
                                 # 백본을 끊으면 설비 읽기까지 끊겼다(R02 r2_ 로그 "i/o timeout", 172.24.0.13 = 백본망, 대장 S18)
    hostname: plant-simulator
    ports:
      - "${PORT_SIM_MODBUS}:502"
      - "${PORT_SIM_API}:8080"
    environment:
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS}
      DIRECT_MQTT_ENABLE: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── L2 수집: Telegraf 한 대(설비 Modbus 읽기 → Kafka raw) ──────────────────
  ingest:
    <<: *restart
    build: { context: ./v2/telegraf }   # telegraf:1.40.1-alpine + 버퍼 폴더(telegraf 소유)
    image: rot-telegraf-ingest:v2
    container_name: ${CN_PREFIX:-}ingest
    networks: [iiot, field]
    hostname: ingest
    depends_on:
      plant-simulator: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mqtt: { condition: service_healthy }   # outputs.mqtt 는 기동 때 브로커 연결 실패를 재시도하지 않고 종료(리서치 08, 대장 S7 성격)
    volumes:
      - ./v2/telegraf/ingest.conf:/etc/telegraf/telegraf.conf:ro
      - ingest-buffer-v2:/var/lib/telegraf-buffer

  # ── L3 브로커: Mosquitto(알람 → FUXA 화면) ─────────────────────────────────
  mqtt:
    <<: *restart
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: ${CN_PREFIX:-}mqtt
    hostname: mqtt
    ports:
      - "${PORT_EMQX_MQTT}:1883"
    volumes:
      - ./v2/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data-v2:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── L3 백본: Kafka ─────────────────────────────────────────────────────────
  kafka:
    <<: *restart
    image: apache/kafka:4.3.1
    container_name: ${CN_PREFIX:-}kafka
    hostname: kafka
    ports:
      - "${PORT_KAFKA}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${PORT_KAFKA}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data   # (대장 S21) 이 줄이 없으면 이미지 기본 /tmp/kafka-logs(컨테이너 쓰기 계층)에 저장돼 재생성 때 Kafka 데이터가 사라짐 — V1 도 같음
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"   # (경량화 #131) 기본 1G 고정 → 256m. 설정 방법 공식 확인(리서치 09), 값은 실측으로 판정
      CLUSTER_ID: ${KAFKA_CLUSTER_ID_V2:-5L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafka-data-v2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: ${CN_PREFIX:-}kafka-init
    networks: [iiot]
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  # ── L4 이상탐지: Flink 2.2.1 + 재시작 복구(HA) ─────────────────────────────
  zookeeper:
    <<: *restart
    image: zookeeper:3.9.5
    container_name: ${CN_PREFIX:-}zookeeper
    hostname: zookeeper
    environment:
      JVMFLAGS: "-Xmx128m"   # (경량화 #131) 기본 Xmx1000m → 128m(실측 RSS 99 MiB). 기본값 뒤에 붙어 우선 적용(리서치 09)
    volumes:
      - zookeeper-data-v2:/data

  flink-jobmanager:
    <<: *restart
    build:
      context: ./flink
      dockerfile: Dockerfile.v2
    image: rot-flink-onnx:v2
    container_name: ${CN_PREFIX:-}flink-jobmanager
    hostname: flink-jobmanager
    command: jobmanager
    depends_on: [zookeeper]
    ports:
      - "${PORT_FLINK_UI}:8081"
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - ./flink/conf/config.v2.yaml:/opt/flink/conf/config.yaml:ro
      - ./flink/sql:/opt/flink/sql:ro
      - flink-checkpoints-v2:/opt/flink/checkpoints
      - model-store-v2:/opt/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  flink-taskmanager:
    <<: *restart
    image: rot-flink-onnx:v2
    container_name: ${CN_PREFIX:-}flink-taskmanager
    hostname: flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager: { condition: service_healthy }
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - ./flink/conf/config.v2.yaml:/opt/flink/conf/config.yaml:ro
      - ./flink/sql:/opt/flink/sql:ro
      - flink-checkpoints-v2:/opt/flink/checkpoints
      - model-store-v2:/opt/models:ro

  model-trainer:
    image: iiot/model-trainer:1.0            # V1 학습기 그대로 — V2 설비로 재학습하면 드리프트·베어링 탐지율 100→0 %(대장 S6, #109)
    container_name: ${CN_PREFIX:-}model-trainer
    networks: [iiot]
    restart: "no"
    volumes:
      - model-store-v2:/opt/models

  flink-job-submitter:
    image: rot-flink-onnx:v2
    container_name: ${CN_PREFIX:-}flink-job-submitter
    networks: [iiot]
    restart: "no"
    depends_on:
      flink-jobmanager: { condition: service_healthy }
      flink-taskmanager: { condition: service_started }
      kafka-init: { condition: service_completed_successfully }
      model-trainer: { condition: service_completed_successfully }
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
      - ./flink/submit-jobs.sh:/submit-jobs.sh:ro
      - ./flink/conf/client-config.v2.yaml:/opt/flink/conf/config.yaml:ro   # ONNX 잡 체크포인트(대장 S17)
      - model-store-v2:/opt/models:ro
    entrypoint: ["/bin/bash", "/submit-jobs.sh"]

  # ── L5 저장: InfluxDB 2.9 + 저장 중계기 ────────────────────────────────────
  influxdb:
    <<: *restart
    image: influxdb:2.9.1-alpine   # (경량화 #131) 같은 2.9.1, 이미지 106 → 83 MB
    container_name: ${CN_PREFIX:-}influxdb
    hostname: influxdb
    ports:
      - "${PORT_INFLUXDB}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx-data-v2:/var/lib/influxdb2
      - influx-config-v2:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ── L5 저장·L6 알람 중계: Vector 한 대(Kafka → InfluxDB, Kafka 알람 → MQTT) ─────────────────
  # V1 Telegraf 3개(710 MiB) 중 #2·#3 을 대신한다(#1 은 수집기가 Kafka 에 바로 써서 없어짐). 중계 벤치 결과 동일·45 MiB(#113)
  relay:
    <<: *restart
    # Kafka 커넥터: Bento 1.21.2(MIT). V1 Telegraf#2(저장)·#3(알람 → 화면) 역할을 한 대로. 세션 3 중계 벤치 결과 V1 과 동일(#111).
    # Vector 0.58 에서 교체 — Vector 는 Kafka 중단 뒤 소비 재개 실패 버그(이슈 #22006, 수정판 없음, 대장 S19, #132).
    image: ghcr.io/warpstreamlabs/bento:1.21.2
    container_name: ${CN_PREFIX:-}relay
    hostname: relay
    command: ["streams", "/streams/storage.yaml", "/streams/alerts.yaml"]
    depends_on:
      kafka: { condition: service_healthy }
      influxdb: { condition: service_healthy }
      mqtt: { condition: service_healthy }
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./v2/bento:/streams:ro

  # ── L6 화면·운전: FUXA(설비 직접 폴링·조작) + Grafana ─────────────────────
  fuxa:
    <<: *restart
    image: frangoteam/fuxa:1.3.4
    container_name: ${CN_PREFIX:-}fuxa
    hostname: fuxa
    ports:
      - "${PORT_FUXA}:1881"
    volumes:
      - fuxa-appdata-v2:/usr/src/app/FUXA/server/_appdata
      - fuxa-db-v2:/usr/src/app/FUXA/server/_db
    depends_on:
      plant-simulator: { condition: service_healthy }
      mqtt: { condition: service_healthy }

  fuxa-provisioner:
    image: python:3.12-slim
    container_name: ${CN_PREFIX:-}fuxa-provisioner
    networks: [iiot]
    restart: "no"
    depends_on:
      fuxa: { condition: service_started }
    volumes:
      - ./fuxa:/work:ro
    working_dir: /work
    environment:
      FUXA_URL: http://fuxa:1881
      PORT_FUXA: ${PORT_FUXA}
      MQTT_URL: mqtt://mqtt:1883
    command: ["python", "-u", "provision.py"]

  grafana:
    <<: *restart
    image: grafana/grafana:12.4.12   # (경량화 #131) 13.2.2(이미지 454 MB, 지원 2027-05-18) → 12.4.12(284 MB, 12 마지막 판 연장 지원 2027-05-24)
    container_name: ${CN_PREFIX:-}grafana
    hostname: grafana
    ports:
      - "${PORT_GRAFANA}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./v2/grafana/dashboards:/var/lib/grafana/dashboards:ro   # V1 대시보드 복사본 + 04 운영 패널의 EMQX 접속 수 → 브로커 상태(#126)
      - grafana-data-v3:/var/lib/grafana   # 버전을 내리므로 13.2 가 만든 내부 DB 대신 새 볼륨(대시보드는 파일에서 자동 등록)
    depends_on:
      influxdb: { condition: service_healthy }

  # ── 운영 감시: Prometheus + Alertmanager + 수집기 ─────────────────────────
  prometheus:
    <<: *restart
    profiles: [monitoring]   # 선택 모듈(기본 꺼짐): 운영 감시. 알림 수신처가 없고 수업은 개념 설명만 — 켜기: --profile monitoring (#129)
    image: prom/prometheus:v3.15.0
    container_name: ${CN_PREFIX:-}prometheus
    hostname: prometheus
    ports:
      - "${PORT_PROMETHEUS}:9090"
    volumes:
      - ./v2/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./v2/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data-v2:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle

  alertmanager:
    <<: *restart
    profiles: [monitoring]   # 선택 모듈(기본 꺼짐): 운영 감시. 알림 수신처가 없고 수업은 개념 설명만 — 켜기: --profile monitoring (#129)
    image: prom/alertmanager:v0.34.1
    container_name: ${CN_PREFIX:-}alertmanager
    hostname: alertmanager
    ports:
      - "${PORT_ALERTMANAGER}:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  kafka-exporter:
    <<: *restart
    profiles: [monitoring]   # 선택 모듈(기본 꺼짐): 운영 감시. 알림 수신처가 없고 수업은 개념 설명만 — 켜기: --profile monitoring (#129)
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: ${CN_PREFIX:-}kafka-exporter
    hostname: kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: { condition: service_healthy }

  cadvisor:
    <<: *restart
    profiles: [monitoring]   # 선택 모듈(기본 꺼짐): 운영 감시. 알림 수신처가 없고 수업은 개념 설명만 — 켜기: --profile monitoring (#129)
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: ${CN_PREFIX:-}cadvisor
    hostname: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
