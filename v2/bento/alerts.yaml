# V2 Kafka 커넥터(Bento) — 알람 → 화면: Kafka sensor.alerts → MQTT scada/hmi/latest-alert(FUXA 가 구독하는 글자 형식, QoS1).
# V1 Telegraf#3(alert-republisher) 역할. 태그별 토픽 scada/alerts/<tag> 는 구독처가 없어 뺐다(#124). 출처: harness/pipebench/benthos/relay3.yaml(#111).
input:
  kafka_franz:
    seed_brokers: ["kafka:9092"]
    topics: ["sensor.alerts"]
    consumer_group: "bento-alert-republish"
    start_from_oldest: false
pipeline:
  processors:
    - mapping: |
        root = (this.ts.number() / 1000000000).ts_format("01-02 15:04:05", "UTC") + " UTC | " + this.severity.string() + " | " + this.tag.string() + " | " + this.alert_type.string()
output:
  label: mqtt_hmi
  mqtt:
    urls: ["tcp://mqtt:1883"]
    client_id: "bento-alert-republisher-hmi"
    topic: "scada/hmi/latest-alert"
    qos: 1
