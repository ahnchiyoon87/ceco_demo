# V2 저장·알람 중계: Vector 0.58.0 한 대가 V1 Telegraf#2(Kafka→InfluxDB)와 #3(Kafka 알람→MQTT)을 대신한다.
# 알람 → MQTT 는 FUXA 가 구독하는 scada/hmi/latest-alert 하나만 낸다. V1 의 태그별 토픽 scada/alerts/<tag> 는
#   2026-09-23 FUXA 가 latest-alert 로 옮긴 뒤(scripts/apply-fuxa-alert-topic.py) 구독하는 곳이 없어 뺐다(#124).
# 출처: 중계 벤치에서 V1 과 결과 동일로 확인된 설정(harness/pipebench/vector/vector.yaml, #113)에서
#   중계 ①(MQTT→Kafka)만 뺐다 — V2 는 수집기가 Kafka 에 바로 쓴다. InfluxDB 접속값은 .env 환경변수, 브로커는 mqtt(Mosquitto).
# 전달 확인: Kafka 읽은 위치는 InfluxDB 싱크가 쓰기 성공을 받은 뒤에만 넘긴다 — V1 Telegraf kafka_consumer 가
# 출력 전달 뒤에 위치를 표시하던 것(최소 1회 전달)과 같은 보장(기능 보존, #124).
# 주의(리서치 08, 코드 확인): Vector 0.58 MQTT 싱크는 브로커 PUBACK 전에 전달로 표시한다 — 알람 화면 경로는 이 보장이 없다.
#   브로커 재시작 때 화면 알람 영향은 R01 에서 실측한다.
acknowledgements:
  enabled: true

sources:
  relay_metrics:                                # 중계기 자체 지표 → Prometheus(중계기 정지를 up==0 으로 탐지, V1 E11 미탐 수정 #124)
    type: internal_metrics
  kafka_sink_in:                                # 중계 ② 입력(V1 sink.conf 4토픽, 그룹 하나)
    type: kafka
    bootstrap_servers: kafka:9092
    group_id: vector-influx
    topics: [sensor.telemetry.clean, sensor.telemetry.raw, sensor.anomaly.score, sensor.alerts]
    auto_offset_reset: latest
    topic_key: kafka_topic
  kafka_alerts_in:                              # 중계 ③ 입력
    type: kafka
    bootstrap_servers: kafka:9092
    group_id: vector-alert-republish
    topics: [sensor.alerts]
    auto_offset_reset: latest

transforms:
  relay2_parse:
    type: remap
    inputs: [kafka_sink_in]
    source: |
      t = string!(.kafka_topic)
      d = object!(parse_json!(string!(.message)))
      d.measurement = if t == "sensor.telemetry.clean" { "process" } else if t == "sensor.telemetry.raw" { "process_raw" } else if t == "sensor.anomaly.score" { "anomaly" } else { "alerts" }
      d.timestamp = from_unix_timestamp!(to_int!(d.ts), unit: "nanoseconds")
      del(d.ts)
      . = d
  relay2_route:
    type: route
    inputs: [relay2_parse]
    route:
      process: '.measurement == "process"'
      process_raw: '.measurement == "process_raw"'
      anomaly: '.measurement == "anomaly"'
      alerts: '.measurement == "alerts"'
  relay3_hmi:
    type: remap
    inputs: [kafka_alerts_in]
    source: |
      d = object!(parse_json!(string!(.message)))
      t = from_unix_timestamp!(to_int!(d.ts), unit: "nanoseconds")
      .tag = d.tag
      .message = format_timestamp!(t, format: "%m-%d %H:%M:%S", timezone: "UTC") + " UTC | " + string!(d.severity) + " | " + string!(d.tag) + " | " + string!(d.alert_type)

sinks:
  influx_process:
    type: influxdb_logs
    version: "2"                                  # 명시하지 않으면 재시작마다 경고(로그 잡음, #126)
    inputs: [relay2_route.process]
    endpoint: http://influxdb:8086
    org: "${INFLUX_ORG}"
    bucket: "${INFLUX_BUCKET}"
    token: "${INFLUX_TOKEN}"
    measurement: process
    tags: [site, device, tag, quality]
  influx_process_raw:
    type: influxdb_logs
    version: "2"                                  # 명시하지 않으면 재시작마다 경고(로그 잡음, #126)
    inputs: [relay2_route.process_raw]
    endpoint: http://influxdb:8086
    org: "${INFLUX_ORG}"
    bucket: "${INFLUX_BUCKET}"
    token: "${INFLUX_TOKEN}"
    measurement: process_raw
    tags: [site, device, tag, quality]
  influx_anomaly:
    type: influxdb_logs
    version: "2"                                  # 명시하지 않으면 재시작마다 경고(로그 잡음, #126)
    inputs: [relay2_route.anomaly]
    endpoint: http://influxdb:8086
    org: "${INFLUX_ORG}"
    bucket: "${INFLUX_BUCKET}"
    token: "${INFLUX_TOKEN}"
    measurement: anomaly
    tags: [site, device, top_contributors]
  influx_alerts:
    type: influxdb_logs
    version: "2"                                  # 명시하지 않으면 재시작마다 경고(로그 잡음, #126)
    inputs: [relay2_route.alerts]
    endpoint: http://influxdb:8086
    org: "${INFLUX_ORG}"
    bucket: "${INFLUX_BUCKET}"
    token: "${INFLUX_TOKEN}"
    measurement: alerts
    tags: [site, device, tag, alert_type, severity, detector]
  mqtt_hmi:
    type: mqtt
    inputs: [relay3_hmi]
    host: mqtt
    port: 1883
    client_id: vector-alert-republisher-hmi
    topic: scada/hmi/latest-alert
    quality_of_service: atleastonce
    encoding: {codec: text}
  prometheus:                                   # 중계기 지표 노출(Prometheus job relay)
    type: prometheus_exporter
    inputs: [relay_metrics]
    address: 0.0.0.0:9598
