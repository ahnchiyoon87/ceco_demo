# ═══════════════════════════════════════════════════════════════════════════
# Tier 4 · Prometheus — 파이프라인 인프라 감시 전용 (V2: V1 설정에서 EMQX 대상만 제거)
#
# ⚠ 설계 규약 (PDF p.7 결론 5):
#   이 Prometheus 는 공정 센서 태그를 단 하나도 저장하지 않는다.
#   센서 텔레메트리는 전부 InfluxDB(히스토리안)로만 간다.
#   Prometheus 는 고카디널리티에 취약해(인덱스 RAM 초과 → OOM) 센서 데이터에
#   부적합하며, 여기서는 "파이프라인 자체가 건강한가"만 본다.
# ═══════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    pipeline: ar100-iiot

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  # (V2) EMQX 대상 제거 — 브로커는 Mosquitto(Prometheus 지표 엔드포인트 없음). 브로커 감시는 감시 층 결과로 정함.

  # Kafka 컨슈머 랙 — 파이프라인 지연의 1차 지표
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]

  # Flink: 체크포인트 소요/실패, 백프레셔, 재시작
  - job_name: flink
    static_configs:
      - targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]

  # InfluxDB: 디스크 I/O, 쓰기 오류
  - job_name: influxdb
    metrics_path: /metrics
    static_configs: [{ targets: ["influxdb:8086"] }]

  # 컨테이너 리소스
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
