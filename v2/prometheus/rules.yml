# 파이프라인 장애 경보. 공정 이상(센서 값) 경보는 여기가 아니라
# Flink → sensor.alerts → FUXA/Grafana 경로가 담당한다.
groups:
  - name: pipeline-health
    rules:
      - alert: KafkaConsumerLagHigh
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 5000
        for: 2m
        labels: { severity: warning, tier: "2" }
        annotations:
          summary: "Kafka 컨슈머 랙 과다 ({{ $labels.consumergroup }}/{{ $labels.topic }})"
          description: "랙 {{ $value }}건. 하위 계층(Flink/Telegraf) 처리량이 유입을 못 따라감."

      - alert: FlinkCheckpointFailing
        expr: increase(flink_jobmanager_job_numberOfFailedCheckpoints[5m]) > 2
        for: 1m
        labels: { severity: critical, tier: "3" }
        annotations:
          summary: "Flink 체크포인트 실패 누적"
          description: "정확히 한 번 상태 복구 보장이 위협받는 상태."

      - alert: FlinkJobRestarting
        expr: increase(flink_jobmanager_job_numRestarts[10m]) > 3
        for: 1m
        labels: { severity: critical, tier: "3" }
        annotations:
          summary: "Flink 잡 반복 재시작"

      - alert: TelemetryIngestStalled
        expr: sum(rate(kafka_topic_partition_current_offset{topic="sensor.telemetry.raw"}[2m])) == 0
        for: 2m
        labels: { severity: critical, tier: "2" }
        annotations:
          summary: "센서 텔레메트리 유입 중단"
          description: "sensor.telemetry.raw 에 2분간 신규 메시지 없음. 에지~수집 구간 점검 필요."

      - alert: PipelineServiceDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} 스크랩 실패 — 서비스 다운 의심"
