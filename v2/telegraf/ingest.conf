# ═══════════════════════════════════════════════════════════════════════════
# V2 수집: Telegraf 1.40.1 한 대가 설비를 Modbus 로 읽어 Kafka sensor.telemetry.raw 에 바로 쓴다.
#
# V1 에서는: 설비 → EdgeX device-modbus → EdgeX 내부 MQTT → app-mqtt-export → EMQX → Telegraf#1 → Kafka  (6단계, 컨테이너 12개)
# 이제는:   설비 → Telegraf(inputs.modbus) → Kafka                                                     (2단계, 컨테이너 1개)
#
# 레코드는 V1 Telegraf#1(telegraf/bridge-edgex.conf) 출력과 같다:
#   {"ts": 읽은 시각(ns), "site": "AR-100", "device": "reactor-line-01", "tag": <태그>, "value": <float>, "quality": "GOOD"}
#   Kafka 키 = tag(태그 단위 순서), lz4, acks=all. 통신불량 센티널(≤ -999998)은 V1 과 같이 버린다(Flink 보간 대상 결측).
# 레지스터 지도: simulator/plant.yaml(계측 12태그 float32 ABCD, HR 0~23, 1초 스캔) — ingestbench 와 같은 정의.
# 단절 보관: 에이전트 메모리 버퍼(metric_buffer_limit). V1 EdgeX Store-and-Forward 와 비교는 R02 실측으로.
# ═══════════════════════════════════════════════════════════════════════════

[agent]
  interval = "1s"
  round_interval = false
  precision = "1ns"
  metric_batch_size = 2000
  metric_buffer_limit = 100000
  flush_interval = "1s"
  flush_jitter = "0s"
  omit_hostname = true

[[inputs.modbus]]
  name = "reactor-line-01"
  name_override = "sensor"
  slave_id = 1
  controller = "tcp://plant-simulator:502"
  timeout = "1s"
  busy_retries = 0
  configuration_type = "register"
  holding_registers = [
    { name = "LT-101", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [0, 1] },
    { name = "LT-102", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [2, 3] },
    { name = "TT-101", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [4, 5] },
    { name = "TT-102", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [6, 7] },
    { name = "PT-101", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [8, 9] },
    { name = "FT-101", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [10, 11] },
    { name = "FT-102", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [12, 13] },
    { name = "IT-101", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [14, 15] },
    { name = "IT-102", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [16, 17] },
    { name = "VT-101", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [18, 19] },
    { name = "pH-101", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [20, 21] },
    { name = "CT-101", byte_order = "ABCD", data_type = "FLOAT32-IEEE", scale = 1.0, address = [22, 23] },
  ]
  [inputs.modbus.tags]
    device = "reactor-line-01"

# 한 번 읽은 12개 필드 → 태그별 레코드 12건(V1 은 EdgeX reading 마다 1건)
[[processors.unpivot]]
  order = 1
  namepass = ["sensor"]
  tag_key = "tag"
  value_key = "value"

# V1 bridge-edgex.conf 와 같은 필터·정규화(센티널 제거, site·quality)
[[processors.starlark]]
  order = 2
  namepass = ["sensor"]
  source = '''
BAD_QUALITY = -999998.0

def apply(metric):
    v = metric.fields.get("value")
    if v == None or v <= BAD_QUALITY:
        return None
    metric.fields["value"] = float(v)
    metric.tags["site"] = "AR-100"
    metric.tags["quality"] = "GOOD"
    return metric
'''

[[outputs.kafka]]
  brokers = ["kafka:9092"]
  topic = "sensor.telemetry.raw"
  routing_tag = "tag"
  compression_codec = 3
  required_acks = -1
  max_retry = 10
  data_format = "json"
  json_timestamp_units = "1ns"
  json_transformation = '''
  {
    "ts":      $number(timestamp),
    "site":    tags.site,
    "device":  tags.device,
    "tag":     tags.tag,
    "value":   fields.value,
    "quality": tags.quality
  }
  '''
