# V2 브로커: EXP-131 에서 측정·확정한 Mosquitto 2.1.2 설정 그대로(#48·#56). V1 EMQX 가 하던 역할만: MQTT 1883, WebSocket 8083, 오프라인 세션 보존(재시작 넘어 디스크 영속).
listener 1883
allow_anonymous true
listener 8083
protocol websockets
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 1
max_queued_messages 100000
