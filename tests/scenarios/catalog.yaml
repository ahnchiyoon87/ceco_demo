# 시나리오 S01~S25 (AGENT_BRIEF v2 §8.6)
# 후보 구현 중 수정 금지. 틀려 보이면 HANDOFF.md 에 적고 해당 항목만 멈춘다.
# 기대결과는 브리프 원문을 V1 실제 인터페이스(tests/SCHEMA.md)에 맞춰 판정 가능한 형태로 옮긴 것이다.
# 공통 상수(V1 코드 확정값, tests/V1_FACTS.md §1)
constants:
  pattern_window_s: 10        # I2
  it102_limit_a: 9.6          # I3
  vt101_limit_mms: 7.1        # I3
  watermark_s: 5              # I4
  loss_dup_tolerance: 0       # I6 (기본 제안, 미서명)
  success_statuses: [verified, stop_verified, cooling_command_verified]
  non_success_statuses: [not_executed, uncertain]
  repeat: 3                   # 지연 측정 반복 횟수, 중앙값 사용

injection_modes:
  plant_fault: "가상설비 POST /fault {scenario, duration_s} — 실제 전 경로를 태운다 (1순위)"
  replay: "sensor.telemetry.raw 형식 레코드를 이벤트 시간 그대로 별도 입력 토픽에 발행 — L4 단독 비교용 (2순위). trace_id·emit_ns 추가"
  compose: "docker compose kill/stop/start"
  toxiproxy: "Modbus·MQTT·PostgreSQL 앞단 지연·단절"
  control: "C1 FUXA setTagValue / C2 POST /control / C3 대응안 decision"

scenarios:
  # ── 데이터·처리 ─────────────────────────────────────────────
  S01:
    title: 정상 운전 10분
    precondition: active_faults 없음, autopilot 동작
    inject: {mode: none, duration_s: 600}
    expect: {alerts: 0, stored_tags: 12}
    forbid: [임계치·패턴·ZSCORE·ML 알람]
    judge: 구간 내 sensor.alerts 레코드 0, InfluxDB에 12개 태그 모두 존재
    metrics: [M2, M5]
  S02:
    title: TT-101 상한 초과
    precondition: S01 조건
    inject: {mode: replay, series: "TT-101 > 95.0 degC 5점"}
    expect: {alerts: {alert_type: THRESHOLD_USL, tag: TT-101, min: 1}}
    judge: 주입 구간에 TT-101 THRESHOLD_USL 레코드 1건 이상
    metrics: [M1, M2]
    note: V1 plant_fault 에는 TT-101 단순 상한 주입이 없어 replay 로 한다. 실경로 확인은 heater_stuck 로 보조 측정
  S03:
    title: 완만한 드리프트 / 분산 급증 (Z-Score)
    precondition: 60초 이상 정상 데이터 선행
    inject: {mode: plant_fault, scenario: noise, duration_s: 30}
    expect: {alerts: {alert_type: ZSCORE, tag: TT-101, min: 1}, same_as_baseline: true}
    judge: ZSCORE 알람 발생 여부와 첫 알람 시각이 기준선(EXP-000)과 같은 판정
    metrics: [M1, M2]
  S04:
    title: IT-102 상승 → 10초 내 VT-101 상승
    inject: {mode: plant_fault, scenario: bearing_wear, duration_s: 45, plant_lag_s: 6}
    replay_variant: "IT-102=9.9A at t0, VT-101=7.5mm/s at t0+6s"
    expect: {alerts: {alert_type: CEP_BEARING, tag: VT-101, count: 1}}
    judge: 주입 1회당 CEP_BEARING 정확히 1건 (replay), plant_fault 는 1건 이상 + 첫 알람 지연
    metrics: [M1, M2]
  S05:
    title: 역순 (VT-101 → IT-102)
    inject: {mode: replay, series: "VT-101=7.5 at t0, IT-102=9.9 at t0+6s"}
    expect: {alerts: {alert_type: CEP_BEARING, count: 0}}
    judge: CEP_BEARING 0건 (임계치 알람은 별개로 허용)
    metrics: [M2]
  S06:
    title: 10초 경계 직전 / 직후
    inject: {mode: replay, cases: ["VT-101 at t0+9.5s", "VT-101 at t0+10.5s"]}
    expect: {before_boundary: 1, after_boundary: 0}
    judge: 케이스별 CEP_BEARING 건수
    metrics: [M2]
  S07:
    title: late event (워터마크 5초 초과 지연 도착)
    inject: {mode: replay, series: "S04 순서, VT-101 레코드를 이벤트 시간 유지한 채 8초 늦게 발행"}
    expect: {policy_declared: true, behaves_as_declared: true}
    judge: 후보가 EXP 로그에 적은 정책(폐기+기록 / 수용)과 실제 결과 일치. 폐기 정책이면 폐기 기록이 남아야 함
    metrics: [M2]
  S08:
    title: 중복 / 누락
    inject: {mode: replay, cases: ["S04 레코드 전부 2회 발행", "IT-102 샘플 3점 누락"], plant_variant: {scenario: dropout, duration_s: 15}}
    expect: {duplicate_alerts: 0, missing_recorded: true}
    judge: 중복 발행 시 CEP_BEARING 1건, 누락 시 품질 플래그 또는 결측 기록 존재
    metrics: [M2, M3]
  S09:
    title: 패턴 진행 중 스트림 처리기 kill → 재시작
    inject: {mode: compose, action: "IT-102 주입 3초 후 처리기 kill, 5초 후 start, VT-101 은 t0+6s"}
    expect: {missed_or_duplicated_alerts: "<= loss_dup_tolerance", detection_resumes: true}
    judge: 재시작 후 탐지 재개 여부(잡 존재·clean 토픽 증가) + 해당 패턴 알람 건수
    metrics: [M3, M4]
    baseline_note: V1 은 세션 클러스터·HA 없음·latest-offset (V1_FACTS §5). 결과는 측정으로만 기록
  S10:
    title: 게이트웨이↔브로커 단절 60초 → 복구
    inject: {mode: toxiproxy, target: "게이트웨이→MQTT", action: "60초 단절"}
    compose_fallback: "EMQX 60초 pause (make fault-netdown 은 30초)"
    expect: {reconnect: true, loss_recorded: true}
    judge: 단절 구간 raw 레코드 수(태그 12 × 60)의 유실·중복 수, 재연결 시간
    metrics: [M3, M4]
  S11:
    title: 브로커/백본 재시작
    inject: {mode: compose, action: "kafka restart"}
    expect: {consumers_resume: true, loss_dup: "<= loss_dup_tolerance"}
    judge: 모든 소비자(Flink·Telegraf#2·#3·알람 워커) 재개 여부와 유실·중복 수
    metrics: [M3, M4]
  S12:
    title: 시계열 DB 다운 5분
    inject: {mode: compose, action: "influxdb stop 300s → start"}
    expect: {alerts_continue: true, screen_continues: true, storage_resumes: recorded}
    judge: 다운 중 sensor.alerts 계속 생성, 복구 후 다운 구간 데이터 적재 여부 기록
    metrics: [M3, M4]
  S13:
    title: ONNX 점수 동일성
    inject: {mode: replay, series: "고정 입력 창 100개"}
    expect: {score_abs_diff_max: 1.0e-6}
    judge: 같은 입력에 대한 reconstruction_error 가 기준선 대비 허용 오차 이내
    metrics: [M1, M5]
    note: 허용 오차 1e-6 은 사전 제안값. 실행 전 확정

  # ── 제어·안전 ───────────────────────────────────────────────
  S14:
    title: C1 FUXA 교반기 기동/정지
    inject: {mode: control, path: C1, action: "FUXA setTagValue agitator_run 0 → 1"}
    expect: {writes: 1, state_reflects: true}
    judge: 쓰기 로그 1건, /state seq 증가 후 commands.agitator_run 반영
    metrics: [M10]
  S15:
    title: C2 범위 밖 설정값
    inject: {mode: control, path: C2, request: {target: temp_sp_c, value: 150}}
    expect: {rejected: true, writes: 0, recorded: true}
    judge: 응답 거부, 쓰기 로그 0, 거부 기록 존재
    baseline_note: V1 은 요청 검증(422)에서 거부 → 기록 없음 예상 (V1_FACTS §6)
  S16:
    title: 고압 인터록 중 기동 명령 (C1·C2·C3 각각)
    precondition: "plant_fault spike 로 PT-101 > 6.5 barg → interlock=true"
    inject: {mode: control, paths: [C1, C2, C3], action: "pump_run=1"}
    expect: {writes_effective: 0}
    judge: 경로별로 인터록 중 펌프 기동이 설비 상태에 반영되지 않음 + 거부 기록
    note: C3 조치 목록에 펌프 기동이 없으므로 C3 는 "인터록 중 대응안 승인 시 not_executed"로 판정
  S17:
    title: C3 반려
    inject: {mode: control, path: C3, decision: reject}
    expect: {writes: 0, proposal_status: rejected}
  S18:
    title: C3 stale approval
    inject: {mode: control, path: C3, action: "대응안 생성 후 C2 로 heater_enable 변경(명령 fingerprint 변화) → 승인"}
    variants: ["명령 변경", "대응안 만료(5분 경과)", "지식 문서 변경"]
    expect: {executed: false, reason_recorded: true}
    judge: 409 또는 result.status=not_executed + 사유, 쓰기 0
  S19:
    title: C3 Modbus write 실패
    inject: {mode: toxiproxy, target: "knowledge→Modbus", action: "연결 거부"}
    expect: {status_in: [not_executed, uncertain], success_recorded: false}
  S20:
    title: C3 ack_no_change
    inject: {mode: harness_hook, hook: ack_no_change}
    expect: {status: uncertain, success_recorded: false}
    note: V1 시뮬레이터에 해당 훅 없음 → 하니스 쪽 Modbus 프록시로 구현
  S21:
    title: 같은 승인 2회 제출
    inject: {mode: control, path: C3, action: "같은 decision 2회 동시 제출"}
    variants: ["C2 같은 request_id 2회"]
    expect: {writes: 1, second_response: replayed}
  S22:
    title: 업무 DB 다운 중 승인·실행
    inject: {mode: compose, action: "work-db stop → 승인 시도"}
    expect: {writes: 0, fail_closed: true}

  # ── HMI·알람·AI ────────────────────────────────────────────
  S23:
    title: 알람 → FUXA/Vue 최근 알람 표시
    inject: {mode: plant_fault, scenario: spike, duration_s: 8}
    expect: {fuxa_topic_received: true, vue_incident_visible: true}
    judge: scada/hmi/latest-alert 수신 시각, 업무 DB 사건 생성 시각 (M1 표시 지연)
    metrics: [M1]
  S24:
    title: 알람 확인 버튼
    inject: {mode: control, action: "알람 확인(코일 10 또는 화면 확인 버튼)"}
    expect: {only_ack_changes: true}
    judge: 확인 전후 /state 의 commands·interlock·active_faults 동일, 사건 원인 판정 변화 없음
  S25:
    title: 근거 문서 없는 사건 분석
    inject: {mode: control, action: "관련 문서가 그래프에 없는 태그 사건으로 분석 실행"}
    expect: {no_evidence_declared: true, cause_confirmed: false, device_action_proposed: false}
    judge: 분석 결과에 근거 없음·불확실성 표시, stop_mixer/enable_cooling 대응안 생성 안 됨
    requires: I8 (LLM 호출)
