name: ar100-verification

services:
  graph:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Missing verification graph password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [verification-graph:/data]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
  work-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ar100_verification
      POSTGRES_USER: ar100
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing verification work password}
    volumes: [verification-work:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ar100 -d ar100_verification"]
      interval: 5s
      timeout: 3s
      retries: 20
  knowledge:
    image: ar100-ai-knowledge:latest
    environment:
      NEO4J_URI: bolt://graph:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Missing verification graph password}
      DB_HOST: work-db
      DB_PORT: "5432"
      DB_NAME: ar100_verification
      DB_USER: ar100
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Missing verification work password}
      OPENAI_API_KEY: ${LITELLM_API_KEY:?Missing relay key}
      OPENAI_BASE_URL: ${LITELLM_BASE_URL:?Missing relay URL}
      MAJOR_MODEL: openai:${LITELLM_MODEL:?Missing Luna alias}
      MINOR_MODEL: openai:${LITELLM_MODEL:?Missing Luna alias}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-}
      INFLUX_ORG: ${INFLUX_ORG:-}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-}
      SIMULATOR_ACTIONS_ENABLED: "false"
      SANDBOX_BACKEND: local
      LOCAL_SANDBOX_ROOT: /workspace
      SANDBOX_WORKDIR: /workspace
    ports: ["127.0.0.1:28010:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - verification-data:/app/backend/data
      - verification-uploads:/workspace/uploads
      - verification-output:/workspace/output
    depends_on:
      graph:
        condition: service_healthy
      work-db:
        condition: service_healthy

volumes:
  verification-graph:
  verification-work:
  verification-data:
  verification-uploads:
  verification-output:
