# V2 AI 층 덧씌우기: V1 에이전트 + 온톨로지 원인분석·매뉴얼 의미검색 도구.
# 이미지는 새 태그로만 빌드한다(원본 ar100-ai-*·기존 rot-ai-* 덮어쓰기 금지).
#   ... -f ai-layer/compose.yml -f ai-layer/compose.scada.yml -f ai-layer/compose.v2.yml --profile knowledge up -d
services:
  knowledge:
    image: rot-ai-knowledge:v2-ai
    environment:
      V2_EMBED_URL: http://embed:11434
      V2_EMBED_MODEL: ${V2_EMBED_MODEL:-bge-m3}
    depends_on:
      embed:
        condition: service_started

  embed:
    image: ollama/ollama:0.34.4          # MIT. 모델 bge-m3(MIT)는 볼륨에 받는다
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
    volumes:
      - embed-models:/root/.ollama

volumes:
  embed-models:
