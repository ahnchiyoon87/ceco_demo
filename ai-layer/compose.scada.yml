# Apply after starting the existing SCADA with its original Compose files.
services:
  alarm-worker:
    build:
      context: ./knowledge
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "backend.src.modules.operations.consumer"]
    environment:
      DB_HOST: work-db
      DB_PORT: "5432"
      DB_NAME: ar100_work
      DB_USER: ar100
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap.ps1 first}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks: [default, scada]
    depends_on:
      work-db:
        condition: service_healthy

networks:
  scada:
    external: true
    name: ${SCADA_NETWORK:-iiot}
