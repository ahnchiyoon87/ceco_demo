name: ar100-ai

services:
  web:
    profiles: [knowledge]
    build:
      context: ../ai-web
      args:
        VITE_FUXA_URL: http://127.0.0.1:${PORT_FUXA:-27018}/
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_PORT_WEB:-28180}:8080"
    depends_on:
      knowledge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  work-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ar100_work
      POSTGRES_USER: ar100
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap.ps1 first}
    ports:
      - "127.0.0.1:${AI_PORT_DB:-27532}:5432"
    volumes:
      - work-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ar100 -d ar100_work"]
      interval: 5s
      timeout: 5s
      retries: 24

  knowledge:
    profiles: [knowledge]
    build:
      context: ./knowledge
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://graph:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run bootstrap.ps1 first}
      OPENAI_API_KEY: ${LITELLM_API_KEY:-}
      OPENAI_BASE_URL: ${LITELLM_BASE_URL:-}
      MAJOR_MODEL: openai:${LITELLM_MODEL:-not-configured}
      MINOR_MODEL: openai:${LITELLM_MODEL:-not-configured}
      MAJOR_MODEL_REASONING_EFFORT: ${MAJOR_MODEL_REASONING_EFFORT:-medium}
      MINOR_MODEL_REASONING_EFFORT: ${MINOR_MODEL_REASONING_EFFORT:-medium}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-}
      INFLUX_ORG: ${INFLUX_ORG:-}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-}
      SIMULATOR_ACTIONS_ENABLED: "true"
      # 설비 접속 주소. 기본값 = 원본 V1 호스트 포트. 실험 스택은 .env.rotation 으로 바꾼다.
      SIMULATOR_MODBUS_HOST: ${SIMULATOR_MODBUS_HOST:-host.docker.internal}
      SIMULATOR_MODBUS_PORT: ${PORT_SIM_MODBUS:-27002}
      SIMULATOR_API_URL: http://host.docker.internal:${PORT_SIM_API:-27080}
      SCADA_STATE_URL: http://host.docker.internal:${PORT_SIM_API:-27080}/state
      INFLUX_URL: http://host.docker.internal:${PORT_INFLUXDB:-27086}
      SCADA_FLINK_URL: http://host.docker.internal:${PORT_FLINK_UI:-27081}
      DB_HOST: work-db
      DB_PORT: "5432"
      DB_NAME: ar100_work
      DB_USER: ar100
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap.ps1 first}
      SANDBOX_BACKEND: local
      LOCAL_SANDBOX_ROOT: /workspace
      SANDBOX_WORKDIR: /workspace
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "127.0.0.1:${AI_PORT_KNOWLEDGE:-28000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - knowledge-data:/app/backend/data
      - knowledge-uploads:/workspace/uploads
      - knowledge-output:/workspace/output
    depends_on:
      work-db:
        condition: service_healthy
      graph:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/openapi.json >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  graph:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run bootstrap.ps1 first}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "127.0.0.1:${AI_PORT_GRAPH_HTTP:-27474}:7474"
      - "127.0.0.1:${AI_PORT_GRAPH_BOLT:-27687}:7687"
    volumes:
      - graph-data:/data
      - graph-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "NEO4J_USERNAME=neo4j NEO4J_PASSWORD=$${NEO4J_AUTH#*/} cypher-shell 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

volumes:
  work-data:
  knowledge-data:
  knowledge-uploads:
  knowledge-output:
  graph-data:
  graph-logs:
