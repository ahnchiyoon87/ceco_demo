# ⚠ 자동 생성 파일 — simulator/plant.yaml 수정 후 `make regen-edgex` 로 재생성
deviceList:
- name: reactor-line-01
  profileName: AR100-Reactor-Line
  description: AR-100 반응기 라인 (Modbus/TCP)
  labels:
  - AR-100
  protocols:
    modbus-tcp:
      Address: plant-simulator
      Port: 502
      UnitID: 1
      Timeout: 5
      IdleTimeout: 5
  autoEvents:
  - interval: 1000ms
    onChange: false
    sourceName: AllSensors
