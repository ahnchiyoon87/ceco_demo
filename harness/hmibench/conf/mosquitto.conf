# hmibench 브로커(Mosquitto 2.1.2, §3 조건부 채택 후보). 인증·ACL 켬(① 기본 보안).
# 익명은 가상설비 직발행(iiot/#) 쓰기만 — 시뮬레이터에 MQTT 인증 설정이 없어서(V1 lite 경로 그대로). HMI 계정은 읽기 전용.
listener 1883
allow_anonymous true
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/mosquitto.acl
listener 8083
protocol websockets
persistence true
persistence_location /mosquitto/data/
