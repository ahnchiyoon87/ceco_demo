# ═══════════════════════════════════════════════════════════════════════════
# 중계 후보 P1(P-E): Telegraf 1.40.1 한 대로 V1 의 세 Telegraf(1.33) 를 대체
# 만든 법(기계적 합치기, 로직 변경 없음): telegraf/bridge-edgex.conf + sink.conf + alert-republish.conf 의
#   inputs·processors·outputs 를 그대로 옮기고, 출력마다 namepass 로 자기 중계의 측정값만 받게 했다.
#   - 중계 ① sensor → outputs.kafka / 중계 ② process·process_raw·anomaly·alerts → outputs.influxdb_v2 / 중계 ③ alert → outputs.mqtt ×2
#   - [agent] 는 V1 Telegraf#1 값. Telegraf#2 의 배치·버퍼·flush(5000/200000/2s)는 influxdb_v2 출력별 설정으로 옮김.
#   - processors 는 원문처럼 namepass=["sensor"] 라 다른 중계에 영향 없음.
# 장애 격리: 출력은 서로 독립 버퍼지만 한 프로세스라 재시작·OOM 은 세 중계가 함께 멈춘다 → 4단계에서 확인.
# ═══════════════════════════════════════════════════════════════════════════
[agent]
  interval = "1s"
  round_interval = false
  metric_batch_size = 2000
  metric_buffer_limit = 100000
  flush_interval = "1s"
  omit_hostname = true

# ───────────── 중계 ① (V1 bridge-edgex.conf) ─────────────
# ═══════════════════════════════════════════════════════════════════════════
# MQTT → Kafka 브리지  (EdgeX 경로)
#
# ⚠ 왜 Telegraf 인가:
#   PDF p.10 은 "EMQX 데이터 통합 브리지로 Kafka 적재"를 전제하지만,
#   EMQX 의 Kafka Sink 는 Enterprise 전용 기능이다. OSS 5.x 에는 Rule Engine 만
#   있고 Kafka 프로듀서 커넥터가 없으므로 Telegraf 가 그 역할을 대신한다.
#   (PDF p.10 Tier 4 에서 이미 "Telegraf 컨슈머"를 언급하므로 스택은 일관됨)
#
# 입력 : EdgeX app-mqtt-export 가 발행하는 EdgeX Event JSON
# 출력 : Kafka sensor.telemetry.raw — 무손실 원본, 보간 없음
# ═══════════════════════════════════════════════════════════════════════════


# ── EdgeX Event 수신 ────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  topics = ["edgex/telemetry"]
  qos = 1                       # PDF p.4: QoS1 + 멱등 처리
  client_id = "telegraf-bridge-edgex"
  persistent_session = true     # 세션 영속 — 단절 구간 메시지 보존
  connection_timeout = "30s"
  name_override = "sensor"

  data_format = "json_v2"

  # EdgeX Event: { deviceName, origin, readings:[{resourceName, value, ...}] }
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sensor"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "readings"
      timestamp_key = "origin"
      timestamp_format = "unix_ns"
      tags = ["resourceName", "deviceName"]
      # EdgeX 는 value 를 문자열로 싣는다 → float 로 강제 변환
      [inputs.mqtt_consumer.json_v2.object.fields]
        value = "float"

# ── 정규화: 전 구간 단일 스키마로 맞춘다 ───────────────────────────────────
[[processors.rename]]
  order = 1
  namepass = ["sensor"]
  [[processors.rename.replace]]
    tag = "resourceName"
    dest = "tag"
  [[processors.rename.replace]]
    tag = "deviceName"
    dest = "device"

[[processors.defaults]]
  order = 2
  namepass = ["sensor"]
  [processors.defaults.fields]
    value = 0.0

# 계측 태그가 아닌 리소스(SEQ, 제어 코일/설정치)는 텔레메트리에서 제외
[[processors.starlark]]
  order = 3
  namepass = ["sensor"]
  source = '''
SENSOR_TAGS = {
    "LT-101": 1, "LT-102": 1, "TT-101": 1, "TT-102": 1,
    "PT-101": 1, "FT-101": 1, "FT-102": 1, "IT-101": 1,
    "IT-102": 1, "VT-101": 1, "pH-101": 1, "CT-101": 1,
}
# 시뮬레이터가 통신불량을 나타내려고 싣는 센티널.
# 여기서 버려야 Kafka 상에 '실제 결측 구간'이 생기고 Flink 보간이 의미를 갖는다.
BAD_QUALITY = -999998.0

def apply(metric):
    tag = metric.tags.get("tag")
    if tag == None or tag not in SENSOR_TAGS:
        return None
    v = metric.fields.get("value")
    if v == None or v <= BAD_QUALITY:
        return None
    metric.tags["site"] = "AR-100"
    metric.tags["quality"] = "GOOD"
    return metric
'''

# ── Kafka 적재 ─────────────────────────────────────────────────────────────
[[outputs.kafka]]
  namepass = ["sensor"]            # 통합안: 중계 ① 레코드만
  brokers = ["kafka:9092"]
  topic = "sensor.telemetry.raw"
  routing_tag = "tag"           # 파티션 키 = 태그 → 태그 단위 순서 보장
  compression_codec = 3         # lz4
  required_acks = -1            # 전 replica ack (무손실)
  max_retry = 10

  data_format = "json"
  json_timestamp_units = "1ns"  # 나노초 — InfluxDB 정밀도 활용
  json_transformation = '''
  {
    "ts":      $number(timestamp),
    "site":    tags.site,
    "device":  tags.device,
    "tag":     tags.tag,
    "value":   fields.value,
    "quality": tags.quality
  }
  '''

# ───────────── 중계 ② (V1 sink.conf) ─────────────
# ═══════════════════════════════════════════════════════════════════════════
# Tier 4 · Kafka → InfluxDB 적재 (프로세스 히스토리안)
#
# PDF p.7 원칙: 센서 텔레메트리는 InfluxDB 로만 간다. Prometheus 로 보내지 않는다.
#   · 나노초 타임스탬프 정밀도 활용
#   · quality 를 태그로 보존 → 실측치/추정치를 감사 추적에서 구분 가능
#   · site/device/tag 고카디널리티는 InfluxDB 의 시계열 전용 엔진이 흡수
#
# 참고: json_v2 의 object 는 비어있지 않은 GJSON 경로를 요구하므로,
#       루트 레벨 평면 JSON 은 tag/field 항목으로 기술한다.
# ═══════════════════════════════════════════════════════════════════════════


# ── 정제 텔레메트리 (중복제거 + 결측보간 완료) ──
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["sensor.telemetry.clean"]
  consumer_group = "telegraf-influx-clean"
  offset = "newest"
  max_message_len = 1000000
  name_override = "process"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "process"
    timestamp_path = "ts"
    timestamp_format = "unix_ns"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "site"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "device"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "tag"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "quality"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "value"
      type = "float"

# ── 원본 텔레메트리 (보간 전 — 감사 추적 기준선) ──
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["sensor.telemetry.raw"]
  consumer_group = "telegraf-influx-raw"
  offset = "newest"
  max_message_len = 1000000
  name_override = "process_raw"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "process_raw"
    timestamp_path = "ts"
    timestamp_format = "unix_ns"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "site"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "device"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "tag"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "quality"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "value"
      type = "float"

# ── Autoencoder 이상 점수 + 기여 센서 역추적 ──
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["sensor.anomaly.score"]
  consumer_group = "telegraf-influx-score"
  offset = "newest"
  max_message_len = 1000000
  name_override = "anomaly"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "anomaly"
    timestamp_path = "ts"
    timestamp_format = "unix_ns"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "site"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "device"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "top_contributors"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "reconstruction_error"
      type = "float"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "threshold"
      type = "float"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "inference_ms"
      type = "float"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "is_anomaly"
      type = "bool"

# ── 통합 알람 (Tier1 규칙/Z-Score/CEP + Tier2 ML) ──
[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["sensor.alerts"]
  consumer_group = "telegraf-influx-alerts"
  offset = "newest"
  max_message_len = 1000000
  name_override = "alerts"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "alerts"
    timestamp_path = "ts"
    timestamp_format = "unix_ns"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "site"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "device"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "tag"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "alert_type"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "severity"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "detector"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "value"
      type = "float"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "detail"
      type = "string"

[[outputs.influxdb_v2]]
  namepass = ["process", "process_raw", "anomaly", "alerts"]   # 통합안: 중계 ② 레코드만
  metric_batch_size = 5000        # V1 Telegraf#2 [agent] 값을 출력별로 옮김
  metric_buffer_limit = 200000
  flush_interval = "2s"
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "10s"

# ───────────── 중계 ③ (V1 alert-republish.conf) ─────────────
# ═══════════════════════════════════════════════════════════════════════════
# Kafka sensor.alerts → MQTT 재발행
#
# FUXA 는 MQTT 클라이언트를 내장하므로, 알람을 MQTT 로 되돌려주면
# P&ID 화면에서 해당 설비 심볼을 점멸시키거나 알람 배너를 띄울 수 있다.
# ═══════════════════════════════════════════════════════════════════════════

[[inputs.kafka_consumer]]
  brokers = ["kafka:9092"]
  topics = ["sensor.alerts"]
  consumer_group = "telegraf-alert-republish"
  offset = "newest"
  name_override = "alert"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "alert"
    timestamp_path = "ts"
    timestamp_format = "unix_ns"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "site"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "device"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "tag"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "alert_type"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "severity"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "detector"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "value"
      type = "float"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "detail"
      type = "string"

[[outputs.mqtt]]
  namepass = ["alert"]              # 통합안: 중계 ③ 레코드만
  servers = ["tcp://emqx:1883"]
  topic = "scada/alerts/{{ .Tag \"tag\" }}"
  qos = 1
  client_id = "alert-republisher"
  data_format = "json"
  json_timestamp_units = "1ns"

# FUXA maps incoming topics by exact address; a wildcard subscription alone
# receives messages but does not update its tag registry. Keep the original
# per-sensor JSON output and supply a dedicated readable latest-event topic.
[[outputs.mqtt]]
  namepass = ["alert"]              # 통합안: 중계 ③ 레코드만
  servers = ["tcp://emqx:1883"]
  topic = "scada/hmi/latest-alert"
  qos = 1
  client_id = "alert-republisher-hmi"
  data_format = "template"
  template = '{{ .Time.UTC.Format "01-02 15:04:05" }} UTC | {{ .Tag "severity" }} | {{ .Tag "tag" }} | {{ .Tag "alert_type" }}'
