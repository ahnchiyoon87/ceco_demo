# 중계 후보 P3: Vector 0.58.0 (MPL-2.0) — V1 세 중계를 한 프로세스로.
# 알려진 제약(CANDIDATES §4): MQTT 소스는 beta·ack 미지원 → 재시작·단절 시 유실 가능(4단계에서 확인).
# 설정 형식 [미검증: 기동 금지 중 작성, ② 첫 단계에서 `vector validate` 로 확인].
sources:
  mqtt_edgex:                                   # 중계 ① 입력
    type: mqtt
    host: emqx
    port: 1883
    topic: edgex/telemetry
    client_id: vector-relay1
  kafka_sink_in:                                # 중계 ② 입력(V1 sink.conf 4토픽, 그룹 하나)
    type: kafka
    bootstrap_servers: kafka:9092
    group_id: vector-influx
    topics: [sensor.telemetry.clean, sensor.telemetry.raw, sensor.anomaly.score, sensor.alerts]
    auto_offset_reset: latest
    topic_key: kafka_topic
  kafka_alerts_in:                              # 중계 ③ 입력
    type: kafka
    bootstrap_servers: kafka:9092
    group_id: vector-alert-republish
    topics: [sensor.alerts]
    auto_offset_reset: latest

transforms:
  relay1:                                       # EdgeX Event → 태그별 레코드(루트를 배열로 만들면 이벤트가 여러 개로 나뉜다)
    type: remap
    inputs: [mqtt_edgex]
    source: |
      tags = ["LT-101","LT-102","TT-101","TT-102","PT-101","FT-101","FT-102","IT-101","IT-102","VT-101","pH-101","CT-101"]
      ev = parse_json!(string!(.message))
      rows = filter(array!(ev.readings)) -> |_i, r| {
        includes(tags, r.resourceName) && (to_float(r.value) ?? -999999.0) > -999998.0
      }
      . = map_values(rows) -> |r| {
        {"ts": to_int!(r.origin), "site": "AR-100", "device": r.deviceName, "tag": r.resourceName,
         "value": to_float!(r.value), "quality": "GOOD"}
      }
  relay2_parse:
    type: remap
    inputs: [kafka_sink_in]
    source: |
      t = string!(.kafka_topic)
      d = object!(parse_json!(string!(.message)))
      d.measurement = if t == "sensor.telemetry.clean" { "process" } else if t == "sensor.telemetry.raw" { "process_raw" } else if t == "sensor.anomaly.score" { "anomaly" } else { "alerts" }
      d.timestamp = from_unix_timestamp!(to_int!(d.ts), unit: "nanoseconds")
      del(d.ts)
      . = d
  relay2_route:
    type: route
    inputs: [relay2_parse]
    route:
      process: '.measurement == "process"'
      process_raw: '.measurement == "process_raw"'
      anomaly: '.measurement == "anomaly"'
      alerts: '.measurement == "alerts"'
  relay3_json:
    type: remap
    inputs: [kafka_alerts_in]
    source: |
      d = object!(parse_json!(string!(.message)))
      . = {"fields": {"detail": d.detail, "value": to_float(d.value) ?? null}, "name": "alert",
           "tags": {"alert_type": d.alert_type, "detector": d.detector, "device": d.device, "severity": d.severity,
                    "site": d.site, "tag": d.tag},
           "timestamp": to_int!(d.ts)}
  relay3_hmi:
    type: remap
    inputs: [kafka_alerts_in]
    source: |
      d = object!(parse_json!(string!(.message)))
      t = from_unix_timestamp!(to_int!(d.ts), unit: "nanoseconds")
      .tag = d.tag
      .message = format_timestamp!(t, format: "%m-%d %H:%M:%S", timezone: "UTC") + " UTC | " + string!(d.severity) + " | " + string!(d.tag) + " | " + string!(d.alert_type)

sinks:
  kafka_raw:
    type: kafka
    inputs: [relay1]
    bootstrap_servers: kafka:9092
    topic: sensor.telemetry.raw
    key_field: tag
    compression: lz4
    encoding: {codec: json}
    librdkafka_options: {"acks": "all"}
    acknowledgements: {enabled: true}
  influx_process:
    type: influxdb_logs
    inputs: [relay2_route.process]
    endpoint: http://influxdb:8086
    org: bench
    bucket: process
    token: pipebench-token
    measurement: process
    tags: [site, device, tag, quality]
  influx_process_raw:
    type: influxdb_logs
    inputs: [relay2_route.process_raw]
    endpoint: http://influxdb:8086
    org: bench
    bucket: process
    token: pipebench-token
    measurement: process_raw
    tags: [site, device, tag, quality]
  influx_anomaly:
    type: influxdb_logs
    inputs: [relay2_route.anomaly]
    endpoint: http://influxdb:8086
    org: bench
    bucket: process
    token: pipebench-token
    measurement: anomaly
    tags: [site, device, top_contributors]
  influx_alerts:
    type: influxdb_logs
    inputs: [relay2_route.alerts]
    endpoint: http://influxdb:8086
    org: bench
    bucket: process
    token: pipebench-token
    measurement: alerts
    tags: [site, device, tag, alert_type, severity, detector]
  mqtt_alerts:
    type: mqtt
    inputs: [relay3_json]
    host: emqx
    port: 1883
    client_id: vector-alert-republisher
    topic: "scada/alerts/{{ tags.tag }}"
    quality_of_service: atleastonce
    encoding: {codec: json}
  mqtt_hmi:
    type: mqtt
    inputs: [relay3_hmi]
    host: emqx
    port: 1883
    client_id: vector-alert-republisher-hmi
    topic: scada/hmi/latest-alert
    quality_of_service: atleastonce
    encoding: {codec: text}
