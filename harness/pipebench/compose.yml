# 중계 파이프 벤치 (EXP-PIPE, CANDIDATES §4 + §11 P-C·P-D·P-E). V1 의 세 중계를 후보마다 같은 입력으로 재현·측정한다.
#   V1 중계 ① Telegraf#1 bridge-edgex : MQTT edgex/telemetry(EdgeX Event) → Kafka sensor.telemetry.raw (태그별 레코드, key=tag, 비계측·센티널 제외)
#   V1 중계 ② Telegraf#2 sink         : Kafka clean·raw·anomaly.score·alerts → InfluxDB process·process_raw·anomaly·alerts
#   V1 중계 ③ Telegraf#3 republish    : Kafka sensor.alerts → MQTT scada/alerts/{tag}(Telegraf JSON) + scada/hmi/latest-alert(텍스트)
#   docker compose -p pipebench -f harness/pipebench/compose.yml --profile <profile> up -d   (직접 부르지 말고 stage2.sh)
# 고정 상수(모든 후보 같음): EMQX 5.8.6(V1 설정, hostname emqx) · Kafka(KAFKA_IMAGE, 기본 V1 3.9.0 / 4.x 변형) · InfluxDB 2.7(V1).
#   → V1 Telegraf 설정 파일을 한 글자도 안 바꾸고 마운트할 수 있다(호스트명 emqx·kafka·influxdb).
# 서비스 이름은 <profile>-… 로 시작(자원 정규식 ^pipebench-<profile>-). 호스트 포트는 수동 설정 UI(NiFi 39443, TBMQ 39083)만.
name: pipebench

x-influx-env: &influx-env
  INFLUX_TOKEN: pipebench-token          # 벤치 전용 값(비밀 아님). V1 .env 토큰은 쓰지 않는다
  INFLUX_ORG: bench
  INFLUX_BUCKET: process

x-pipe-deps: &pipe-deps
  emqx: {condition: service_healthy}
  kafka-init: {condition: service_completed_successfully}
  influxdb: {condition: service_healthy}

services:
  # ── 고정 상수 ────────────────────────────────────────────────────────────────
  emqx:
    image: emqx/emqx:5.8.6
    hostname: emqx
    volumes:
      - ../../emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    healthcheck: {test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"], interval: 5s, timeout: 10s, retries: 30}

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    hostname: kafka
    environment:                           # V1 docker-compose.yml kafka 와 같은 설정(EXTERNAL 리스너만 뺌)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: pipebench-kraft-cluster1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    depends_on:
      kafka: {condition: service_healthy}
    volumes:
      - ../../kafka/create-topics.sh:/create-topics.sh:ro      # V1 토픽 4개(파티션·보존 동일)
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  influxdb:
    image: influxdb:2.7
    hostname: influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: pipebench12345
      DOCKER_INFLUXDB_INIT_ORG: bench
      DOCKER_INFLUXDB_INIT_BUCKET: process
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: pipebench-token
    healthcheck: {test: ["CMD", "influx", "ping"], interval: 5s, timeout: 5s, retries: 20}

  client:
    build: .
    image: pipebench-client:1.0
    profiles: [tools]
    volumes:
      - ../..:/repo:ro
      - ../../experiments:/experiments

  # ── V1 기준: Telegraf 1.33 ×3, V1 설정 파일 그대로 ─────────────────────────────
  v1-bridge:
    image: telegraf:1.33-alpine
    profiles: [v1]
    depends_on: *pipe-deps
    volumes: ["../../telegraf/bridge-edgex.conf:/etc/telegraf/telegraf.conf:ro"]
  v1-sink:
    image: telegraf:1.33-alpine
    profiles: [v1]
    depends_on: *pipe-deps
    environment: *influx-env
    volumes: ["../../telegraf/sink.conf:/etc/telegraf/telegraf.conf:ro"]
  v1-republish:
    image: telegraf:1.33-alpine
    profiles: [v1]
    depends_on: *pipe-deps
    volumes: ["../../telegraf/alert-republish.conf:/etc/telegraf/telegraf.conf:ro"]

  # ── P1 Telegraf 1.40.1 ×3 (같은 제품 최신, V1 설정 파일 그대로) ─────────────────
  telegraf140x3-bridge:
    image: telegraf:1.40.1-alpine
    profiles: [telegraf140x3]
    depends_on: *pipe-deps
    volumes: ["../../telegraf/bridge-edgex.conf:/etc/telegraf/telegraf.conf:ro"]
  telegraf140x3-sink:
    image: telegraf:1.40.1-alpine
    profiles: [telegraf140x3]
    depends_on: *pipe-deps
    environment: *influx-env
    volumes: ["../../telegraf/sink.conf:/etc/telegraf/telegraf.conf:ro"]
  telegraf140x3-republish:
    image: telegraf:1.40.1-alpine
    profiles: [telegraf140x3]
    depends_on: *pipe-deps
    volumes: ["../../telegraf/alert-republish.conf:/etc/telegraf/telegraf.conf:ro"]

  # ── P1 Telegraf 1.40.1 한 대로 세 중계(P-E) ─────────────────────────────────────
  telegraf140x1:
    image: telegraf:1.40.1-alpine
    profiles: [telegraf140x1]
    depends_on: *pipe-deps
    environment: *influx-env
    volumes: ["./telegraf/single.conf:/etc/telegraf/telegraf.conf:ro"]

  # ── P2 Bento / Redpanda Connect(Apache 컴포넌트만) / benthos-umh — 같은 스트림 설정 3개(streams 모드) ──
  bento:
    image: ghcr.io/warpstreamlabs/bento:1.21.2
    profiles: [bento]
    depends_on: *pipe-deps
    command: ["streams", "/streams/relay1.yaml", "/streams/relay2.yaml", "/streams/relay3.yaml"]
    volumes: ["./benthos:/streams:ro"]
  rpconnect:
    image: docker.redpanda.com/redpandadata/connect:4.111.0
    profiles: [rpconnect]
    depends_on: *pipe-deps
    command: ["streams", "/streams/relay1.yaml", "/streams/relay2.yaml", "/streams/relay3.yaml"]
    volumes: ["./benthos:/streams:ro"]
  benthos-umh:
    image: ghcr.io/united-manufacturing-hub/benthos-umh:0.16.0
    profiles: [benthos-umh]
    depends_on: *pipe-deps
    command: ["streams", "/streams/relay1.yaml", "/streams/relay2.yaml", "/streams/relay3.yaml"]
    volumes: ["./benthos:/streams:ro"]

  # ── P1 LF Edge eKuiper 2.4.2 (규칙은 REST 로 생성: ekuiper/setup.py) ──────────────
  ekuiper:
    image: lfedge/ekuiper:2.4.2
    profiles: [ekuiper]
    hostname: ekuiper
    depends_on: *pipe-deps
    environment:
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://emqx:1883"
      MQTT_SOURCE__DEFAULT__QOS: "1"
      KUIPER__BASIC__CONSOLELOG: "true"

  # ── P3 Vector 0.58.0 ─────────────────────────────────────────────────────────
  vector:
    image: timberio/vector:0.58.0-alpine
    profiles: [vector]
    depends_on: *pipe-deps
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes: ["./vector/vector.yaml:/etc/vector/vector.yaml:ro"]

  # ── P3 Apache NiFi 2.12.0 (흐름은 nifi/setup.py 가 REST 로 생성·시작 — 09-29: 재현 가능 설정만 인정) ──
  nifi:
    image: apache/nifi:2.12.0
    profiles: [nifi]
    depends_on: *pipe-deps
    ports: ["39443:8443"]
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: bench
      SINGLE_USER_CREDENTIALS_PASSWORD: pipebench-nifi-12345
      NIFI_WEB_PROXY_HOST: "localhost:39443"

  # ── P2 Kafka Connect + Lenses Stream Reactor 12.1.2 MQTT source (P-D, 중계 ① 대체). Kafka ≥4.0 → KAFKA_IMAGE=apache/kafka:4.3.1 ──
  # 중계 ②·③ 은 relay23.conf(Telegraf 1.40.1, single.conf 에서 ②③만)가 맡는다 — 중계 ① 비교가 목적.
  kconnect:
    build: ./kconnect
    image: pipebench-kconnect:4.3.1-sr12.1.2
    profiles: [kconnect]
    depends_on: *pipe-deps
  kconnect-telegraf23:
    image: telegraf:1.40.1-alpine
    profiles: [kconnect]
    depends_on: *pipe-deps
    environment:
      <<: *influx-env
      REPUBLISH_BROKER: tcp://emqx:1883
    volumes: ["./telegraf/relay23.conf:/etc/telegraf/telegraf.conf:ro"]

  # ── P1 RMQTT 0.24.0 브로커 내장 Kafka 출력(P-C, 중계 ① 제거) ─────────────────────
  # 발행기는 V1 lite 모양(iiot/AR-100/reactor-line-01/<tag>, 태그별 최종 스키마)을 RMQTT 로 보낸다. ②③ 은 relay23.conf.
  rmqtt-pc:
    image: rmqtt/rmqtt:0.24.0
    profiles: [rmqtt-pc]
    hostname: rmqtt
    depends_on: *pipe-deps
    command: ["-f", "./rmqtt.toml"]
    volumes:
      - ./rmqtt/rmqtt.toml:/app/rmqtt/rmqtt.toml:ro
      - ./rmqtt/rmqtt-bridge-egress-kafka.toml:/app/rmqtt/rmqtt-plugins/rmqtt-bridge-egress-kafka.toml:ro
  rmqtt-pc-telegraf23:
    image: telegraf:1.40.1-alpine
    profiles: [rmqtt-pc]
    depends_on: *pipe-deps
    environment:
      <<: *influx-env
      REPUBLISH_BROKER: tcp://rmqtt:1883
    volumes: ["./telegraf/relay23.conf:/etc/telegraf/telegraf.conf:ro"]

  # ── P2 TBMQ 2.4.0 Integration Executor Kafka 출력(P-C). 통합은 tbmq/setup.py 가 REST 로 생성(09-29: 재현 가능 설정만 인정) ──
  tbmq-pc:
    image: thingsboard/tbmq:2.4.0
    profiles: [tbmq-pc]
    hostname: tbmq
    depends_on: [tbmq-pc-postgres, tbmq-pc-valkey, kafka-init]
    ports: ["39083:8083"]
    environment:
      TB_SERVICE_ID: tbmq
      SPRING_DATASOURCE_URL: jdbc:postgresql://tbmq-pc-postgres:5432/thingsboard_mqtt_broker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TB_KAFKA_SERVERS: kafka:9092                           # 벤치 Kafka 를 TBMQ 내부 저장에도 공유(TBMQ 토픽은 tbmq.* 접두)
      REDIS_HOST: tbmq-pc-valkey
      SECURITY_MQTT_BASIC_ENABLED: "false"
      MQTT_PERSISTENT_SESSION_DEVICE_PERSISTED_MESSAGES_LIMIT: "100000"   # V1 큐 10만에 맞춤(09-29)
  tbmq-pc-ie:
    image: thingsboard/tbmq-integration-executor:2.4.0
    profiles: [tbmq-pc]
    depends_on: [tbmq-pc]
    environment:
      TB_SERVICE_ID: tbmq-ie
      TB_KAFKA_SERVERS: kafka:9092
  tbmq-pc-postgres:
    image: postgres:17
    profiles: [tbmq-pc]
    environment:
      POSTGRES_DB: thingsboard_mqtt_broker
      POSTGRES_PASSWORD: postgres
  tbmq-pc-valkey:
    image: valkey/valkey:8.0.11-alpine
    profiles: [tbmq-pc]
  tbmq-pc-telegraf23:
    image: telegraf:1.40.1-alpine
    profiles: [tbmq-pc]
    depends_on: *pipe-deps
    environment:
      <<: *influx-env
      REPUBLISH_BROKER: tcp://tbmq:1883
    volumes: ["./telegraf/relay23.conf:/etc/telegraf/telegraf.conf:ro"]
