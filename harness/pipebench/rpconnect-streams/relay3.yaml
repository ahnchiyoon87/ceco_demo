# 중계 ③ (V1 Telegraf#3 alert-republish.conf 재현) — Bento / Redpanda Connect / benthos-umh 공용
# Kafka sensor.alerts(그룹 benthos-alert-republish, newest) →
#   a) MQTT scada/alerts/<tag> QoS1, V1 Telegraf JSON 모양 {"fields":{"detail","value"},"name":"alert","tags":{...},"timestamp":ns}
#   b) MQTT scada/hmi/latest-alert QoS1, 텍스트 "MM-DD HH:MM:SS UTC | severity | tag | alert_type" (FUXA 최근 알람 표시)
input:
  kafka_franz:
    seed_brokers: ["kafka:9092"]
    topics: ["sensor.alerts"]
    consumer_group: "benthos-alert-republish"
    start_offset: latest          # Redpanda Connect 4.111: start_from_oldest(옛 항목)는 기본 start_offset 과 충돌해 설정 검사에서 거부(#111) — 같은 의미(V1 newest)
output:
  broker:
    pattern: fan_out
    outputs:
      - mqtt:
          urls: ["tcp://emqx:1883"]
          client_id: "benthos-alert-republisher"
          topic: 'scada/alerts/${! json("tag") }'
          qos: 1
        processors:
          - mapping: |
              let doc = this
              let tags = ["alert_type","detector","device","severity","site","tag"].filter(k -> $doc.get(k) != null).fold({}, i -> i.tally.merge({(i.value): $doc.get(i.value).string()}))
              let fields = {"detail": this.detail, "value": this.value}.filter(kv -> kv.value != null)
              root = {"fields": $fields, "name": "alert", "tags": $tags, "timestamp": this.ts.number().int64()}
      - mqtt:
          urls: ["tcp://emqx:1883"]
          client_id: "benthos-alert-republisher-hmi"
          topic: "scada/hmi/latest-alert"
          qos: 1
        processors:
          - mapping: |
              root = (this.ts.number() / 1000000000).ts_format("01-02 15:04:05", "UTC") + " UTC | " + this.severity.string() + " | " + this.tag.string() + " | " + this.alert_type.string()
