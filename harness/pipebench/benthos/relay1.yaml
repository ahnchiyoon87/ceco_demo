# 중계 ① (V1 Telegraf#1 bridge-edgex.conf 재현) — Bento 1.21.2 / Redpanda Connect 4.111.0(Apache 컴포넌트만) / benthos-umh 0.16.0 공용
# MQTT edgex/telemetry(EdgeX Event v3) → reading 마다 1건으로 펼침 → 계측 12태그만·센티널(≤ -999998) 제외 →
# {"ts","site","device","tag","value","quality"} → Kafka sensor.telemetry.raw, key = tag(태그 단위 순서), lz4, acks=all.
# V1 과 다른 점(알려진 차이): 파티셔너가 Kafka 표준 murmur2(Telegraf 는 sarama 해시) → 태그→파티션 배정은 달라도 태그 단위 순서는 같다.
# 사용 컴포넌트: mqtt(입력) · kafka_franz(출력) · mapping/unarchive(처리) — 모두 Apache/MIT, 엔터프라이즈(RCL) 없음.
input:
  mqtt:
    urls: ["tcp://emqx:1883"]
    topics: ["edgex/telemetry"]
    client_id: "benthos-relay1"
    qos: 1
    clean_session: false          # V1 persistent_session = true
pipeline:
  processors:
    - mapping: 'root = this.readings'
    - unarchive:
        format: json_array
    - mapping: |
        let tags = ["LT-101","LT-102","TT-101","TT-102","PT-101","FT-101","FT-102","IT-101","IT-102","VT-101","pH-101","CT-101"]
        let v = this.value.number().catch(0.0)
        root = if !$tags.contains(this.resourceName) || $v <= -999998.0 { deleted() } else {
          {"ts": this.origin, "site": "AR-100", "device": this.deviceName, "tag": this.resourceName, "value": $v, "quality": "GOOD"}
        }
        meta kafka_key = this.resourceName
output:
  kafka_franz:
    seed_brokers: ["kafka:9092"]
    topic: "sensor.telemetry.raw"
    key: '${! meta("kafka_key") }'
    compression: lz4
    max_in_flight: 16
    batching:
      count: 2000
      period: 1s
