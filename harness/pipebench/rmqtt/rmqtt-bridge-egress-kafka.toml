##--------------------------------------------------------------------
## pipebench P-C: rmqtt-bridge-egress-kafka (0.24.0 업스트림 예제 형식)
## 발행기가 V1 lite 경로 모양(iiot/AR-100/reactor-line-01/<tag>, 페이로드 = raw 최종 스키마 1건)을 보내면
## 브로커가 그대로 Kafka sensor.telemetry.raw 로 넘긴다.
## 알려진 차이: 0.24.0 설정에 레코드 key 지정이 없다(remote.partition 고정만) → V1 의 key=tag(태그 단위 순서)를 못 맞춘다.
##   6파티션 무키 분산이면 태그 단위 순서가 깨질 수 있음 → 검사기가 순서 역전을 센다. partition=0 고정 변형은 아래 주석.
## message.timeout.ms 기본 5000 → 120000: Kafka 재시작(R03) 동안 5초 만에 버리지 않게(V1 Telegraf max_retry 10 과 비슷한 여유).
##--------------------------------------------------------------------
[[bridges]]
enable = true
name = "bridge_kafka_raw"
servers = "kafka:9092"
client_id_prefix = "rmqtt_raw"
concurrent_client_limit = 3

[bridges.properties]
"message.timeout.ms" = "120000"
"acks" = "all"
"compression.type" = "lz4"
"enable.idempotence" = "true"

[[bridges.entries]]
local.topic_filter = "iiot/#"
remote.topic = "sensor.telemetry.raw"
remote.queue_timeout = "0m"
#remote.partition = 0
