# Stream Reactor MQTT source — V1 중계 ①(Telegraf#1) 자리.
# 알려진 한계(② 에서 확인): KCQL 은 MQTT 메시지 1건 → Kafka 레코드 1건. EdgeX Event(12 reading)를 태그별 12건으로 펼치고
# 비계측·센티널을 거르는 변환이 없다(표준 SMT 로 배열 펼치기 불가) → raw 토픽에 이벤트 통째로 들어간다 = V1 스키마 불일치.
# 직접 SMT 를 짜면 "엔진급 기능 직접 제작"이 아니라 어댑터지만, 후보 비교는 제품 기본 기능으로 한다.
name=mqtt-relay1
connector.class=io.lenses.streamreactor.connect.mqtt.source.MqttSourceConnector
tasks.max=1
connect.mqtt.hosts=tcp://emqx:1883
connect.mqtt.client.id=kconnect-relay1
connect.mqtt.service.quality=1
connect.mqtt.clean=false
connect.mqtt.kcql=INSERT INTO sensor.telemetry.raw SELECT * FROM edgex/telemetry WITHCONVERTER=`io.lenses.streamreactor.connect.converters.source.BytesConverter`
