# 알람 표시·상태(ISA-18.2) 비교 벤치 (EXP-ALM, CANDIDATES §7). 호스트 포트 없음, rot 스택과 비공유. latest 금지.
#   harness/alarmbench/stage2.sh pgisa|alerta|keep|thingsboard
# 기준 버전(V1)은 상태 관리가 없어 띄울 부품이 없다(E10 공백) — STAGE2.md 기준선 행 참조.
# 자원 한도 없음(09-29 결정 I5): 실제 사용량 자체가 ③ 효율 측정값이다. 공정성은 같은 호스트에서 벤치 하나씩 실행으로 확보.
name: alarmbench


networks:
  alm: {}

volumes:
  alarm-db:
  alerta-db:
  keep-state:
  tb-db:
  tb-data:

services:
  # ── P1: PostgreSQL 상태 테이블 + 트랜잭션 함수(연결 코드: pgisa/isa_pg.sql) ──
  # 09-29 결정: 운영 배치는 업무 DB(ar100_work)와 같은 PostgreSQL 의 별도 스키마 isa. 벤치는 같은 이미지의 별도 인스턴스.
  alarm-db:
    profiles: [pgisa]
    image: postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232   # V1 ai-work-db 와 같은 이미지(digest, V1_INVENTORY)
    networks: [alm]
    environment: {POSTGRES_PASSWORD: bench, POSTGRES_DB: ar100_work}
    volumes: [alarm-db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ar100_work"], interval: 5s, timeout: 5s, retries: 30}

  # ── Alerta 9.1 (ISA_18_2 모델) + PostgreSQL ──
  alerta-db:
    profiles: [alerta]
    image: postgres:17.11
    networks: [alm]
    environment: {POSTGRES_USER: alerta, POSTGRES_PASSWORD: bench, POSTGRES_DB: monitoring}
    volumes: [alerta-db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "alerta"], interval: 5s, timeout: 5s, retries: 30}
  alerta:
    profiles: [alerta]
    image: alerta/alerta-web:9.1.0
    networks: [alm]
    depends_on: {alerta-db: {condition: service_healthy}}
    environment:
      DATABASE_URL: postgres://alerta:bench@alerta-db:5432/monitoring
      ADMIN_USERS: admin@bench.local
      ADMIN_PASSWORD: bench-admin-pw
      ADMIN_KEY: bench-admin-key-000000000000000000
      AUTH_REQUIRED: "True"
    volumes: [./alerta/alertad.conf:/app/alertad.conf:ro]

  # ── Keep 0.54.3 (MIT 코어, ee/ 미사용) — API 만(화면 keep-ui 는 ③ 이후) ──
  keep-api:
    profiles: [keep]
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api:0.54.3
    networks: [alm]
    environment:
      PORT: "8080"
      SECRET_MANAGER_TYPE: FILE
      SECRET_MANAGER_DIRECTORY: /state
      DATABASE_CONNECTION_STRING: sqlite:////state/db.sqlite3?check_same_thread=False
      AUTH_TYPE: DB                        # 사용자별 기록(누가 확인했나)의 전제
      KEEP_JWT_SECRET: bench-jwt-secret
      KEEP_DEFAULT_USERNAME: keep
      KEEP_DEFAULT_PASSWORD: keep-bench-pw
      PUSHER_DISABLED: "true"
      USE_NGROK: "false"
    volumes: [keep-state:/state]

  # ── ThingsBoard CE 4.3 (알람 ACK/CLEAR) + PostgreSQL ──
  tb-db:
    profiles: [thingsboard]
    image: postgres:17.11
    networks: [alm]
    environment: {POSTGRES_PASSWORD: bench, POSTGRES_DB: thingsboard}
    volumes: [tb-db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, timeout: 5s, retries: 30}
  tb-install:                              # 스키마·데모 계정(tenant@thingsboard.org) 1회 설치
    profiles: [thingsboard]
    image: thingsboard/tb-node:4.3.1.6
    networks: [alm]
    depends_on: {tb-db: {condition: service_healthy}}
    restart: "no"
    environment: &tb-env
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://tb-db:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: bench
      DATABASE_TS_TYPE: sql
      TB_QUEUE_TYPE: in-memory
      INSTALL_TB: "true"
      LOAD_DEMO: "true"
  thingsboard:
    profiles: [thingsboard]
    image: thingsboard/tb-node:4.3.1.6
    hostname: thingsboard
    networks: [alm]
    depends_on: {tb-install: {condition: service_completed_successfully}}
    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://tb-db:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: bench
      DATABASE_TS_TYPE: sql
      TB_QUEUE_TYPE: in-memory
    volumes: [tb-data:/data]

  client:
    profiles: [tools]
    build: ../benchcommon
    image: bench-client:1.0
    networks: [alm]
    environment: {PYTHONUTF8: "1", BENCH_GUARD_FORCED: "${BENCH_GUARD_FORCED:-0}"}
    volumes: ["../..:/repo:ro", "../../experiments:/experiments"]
