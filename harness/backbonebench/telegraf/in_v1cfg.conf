# Telegraf 1.40 inputs.kafka_consumer 호환 점검(EXP-BB): V1 telegraf/sink.conf 의 process_raw 입력 블록 그대로(kafka_version 미설정).
# 출력만 InfluxDB 대신 파일(하니스가 건수를 센다).
[agent]
  interval = "1s"
  round_interval = false
  metric_batch_size = 5000
  metric_buffer_limit = 200000
  flush_interval = "2s"
  omit_hostname = true

[[inputs.kafka_consumer]]
  brokers = ["${KAFKA_BROKER}"]
  topics = ["sensor.telemetry.raw"]
  consumer_group = "telegraf-influx-raw-v1cfg"
  offset = "newest"
  max_message_len = 1000000

  name_override = "process_raw"
  data_format = "json_v2"
  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "process_raw"
    timestamp_path = "ts"
    timestamp_format = "unix_ns"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "site"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "device"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "tag"
    [[inputs.kafka_consumer.json_v2.tag]]
      path = "quality"
    [[inputs.kafka_consumer.json_v2.field]]
      path = "value"
      type = "float"

[[outputs.file]]
  files = ["/out/${PROFILE}_in_v1cfg.jsonl"]
  data_format = "json"
