# Telegraf 1.40 outputs.kafka 호환 점검(EXP-BB). 출력 블록은 V1 telegraf/bridge-edgex.conf 의 [[outputs.kafka]] 를 그대로 옮기고
# 토픽만 tg.out.raw 로 바꿨다(실제 raw 토픽과 섞이지 않게). 입력은 하니스가 보내는 line protocol(socket_listener).
[agent]
  interval = "1s"
  round_interval = false
  metric_batch_size = 2000
  metric_buffer_limit = 100000
  flush_interval = "1s"
  omit_hostname = true

[[inputs.socket_listener]]
  service_address = "tcp://:8094"
  data_format = "influx"

[[outputs.kafka]]
  brokers = ["${KAFKA_BROKER}"]
  topic = "tg.out.raw"
  routing_tag = "tag"
  compression_codec = 3
  required_acks = -1
  max_retry = 10
  data_format = "json"
  json_timestamp_units = "1ns"
  json_transformation = '''
  {
    "ts":      $number(timestamp),
    "site":    tags.site,
    "device":  tags.device,
    "tag":     tags.tag,
    "value":   fields.value,
    "quality": tags.quality
  }
  '''
