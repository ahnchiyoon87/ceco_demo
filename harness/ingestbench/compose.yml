# 수집 층 벤치 (EXP-ING, CANDIDATES §2). Modbus TCP(가상설비) → MQTT 발행을 후보마다 같은 조건으로 잰다.
#   docker compose -p ingestbench -f harness/ingestbench/compose.yml --profile <profile> up -d
#   (직접 부르지 말고 harness/ingestbench/stage2.sh 를 쓴다 — 가드·자원 기록·정리 포함)
#
# 원칙
# - 원본 V1·다른 벤치와 네트워크·포트 비공유. 호스트 포트는 수동 설정이 필요한 P3 UI 만 39xxx.
# - 네트워크 두 개: field(설비 LAN: 시뮬레이터·수집기) / uplink(수집기·벤치 브로커·검사기).
#   R02(수집기↔브로커 단절)는 수집기의 송신 컨테이너를 uplink 에서만 떼어 설비 폴링은 유지한다.
# - 벤치 브로커는 Mosquitto 2.1.2(측정 완료 브로커, 고정 상수). HiveMQ Edge 는 자체 내장 브로커로 발행(P-EB).
# - downstream: 하류 파서. V1 모양 후보는 V1 Telegraf#1 원문(입력·가공 그대로, 출력만 파일), 다른 모양은 후보별 적응 설정(설정만).
#   판정은 결과 동등: 같은 12태그·값·시각의 raw 레코드가 나오는가(check_ingest.py downstream 절).
# - 서비스 이름은 <profile>-… 로 시작한다(자원 샘플러 정규식 ^ingestbench-<profile>-).
name: ingestbench

networks:
  field:
  uplink:

x-edgex-common: &edgex-common
  networks: [field, uplink]
  restart: unless-stopped
  profiles: [edgex]
  read_only: true
  security_opt: ["no-new-privileges:true"]
  user: "2002:2001"

x-edgex-env: &edgex-env
  EDGEX_SECURITY_SECRET_STORE: "false"

services:
  # ── 공통(모든 프로파일) ──────────────────────────────────────────────
  plant-simulator:
    image: rot-plant-simulator:v2-ts        # 회전 스택과 같은 V2 설비(배속 600 기본값, 레지스터 지도는 V1 과 같음: 12태그 float32 HR 0~22, 1초 스캔)
    hostname: plant-simulator
    networks: [field]
    environment:
      DIRECT_MQTT_ENABLE: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    hostname: mosquitto
    networks: [uplink]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  downstream:
    # 하류 파서(결과 동등 판정용): 후보 발행 → sensor.telemetry.raw 와 같은 레코드를 파일로. 09-29 결정: V1 설정 호환이 아니라 결과 동등이 기준.
    # V1 모양(EdgeX Event) 후보는 V1 Telegraf#1 원문(downstream/v1-edgex.conf, telegraf 1.33), 다른 모양은 후보별 적응 설정(telegraf 1.40.1).
    image: ${DOWNSTREAM_IMAGE:-telegraf:1.33-alpine}
    hostname: downstream
    networks: [uplink]
    depends_on: [mosquitto]
    environment:
      V1PARSE_FILE: ${V1PARSE_FILE:-/out/downstream_unset.jsonl}
      INGEST_TOPIC: ${INGEST_TOPIC:-edgex/telemetry}
      INGEST_BROKER: ${INGEST_BROKER:-tcp://mosquitto:1883}
      INGEST_USER: ${INGEST_USER:-}
      INGEST_PASS: ${INGEST_PASS:-}
    volumes:
      - ./downstream/${DOWNSTREAM_CONF:-v1-edgex.conf}:/etc/telegraf/telegraf.conf:ro
      - ../../experiments/EXP-ING/raw:/out

  client:
    build: .
    image: ingestbench-client:1.0
    profiles: [tools]
    networks: [field, uplink]
    volumes:
      - ../..:/repo:ro
      - ../../experiments:/experiments

  # ── V1 기준: EdgeX 4.0.0 (docker-compose.edgex.yml 을 벤치 브로커로만 바꿔 옮김) ─────────
  # CANDIDATES 개정 #74: EdgeX 4.0 LTS 2027-03 종료 → V1 강제 교체 대상. 기준선 측정용으로만 띄운다.
  edgex-postgres:
    networks: [field]
    restart: unless-stopped
    profiles: [edgex]
    security_opt: ["no-new-privileges:true"]
    image: postgres:16.3-alpine3.20
    hostname: edgex-postgres
    environment:
      POSTGRES_DB: edgex_db
      POSTGRES_PASSWORD: postgres
    volumes:
      - edgex-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edgex_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  edgex-mqtt-broker:
    <<: *edgex-common
    networks: [field]
    image: eclipse-mosquitto:2.0.21
    hostname: edgex-mqtt-broker
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto-no-auth.conf"]

  edgex-core-keeper:
    <<: *edgex-common
    networks: [field]
    image: edgexfoundry/core-keeper:4.0.0
    hostname: edgex-core-keeper
    depends_on:
      edgex-postgres: {condition: service_healthy}
      edgex-mqtt-broker: {condition: service_started}
    environment:
      <<: *edgex-env
      DATABASE_HOST: edgex-postgres
      MESSAGEBUS_AUTHMODE: none
      MESSAGEBUS_HOST: edgex-mqtt-broker
      MESSAGEBUS_PORT: "1883"
      MESSAGEBUS_PROTOCOL: tcp
      MESSAGEBUS_SECRETNAME: ""
      MESSAGEBUS_TYPE: mqtt
      SERVICE_HOST: edgex-core-keeper

  edgex-common-config:
    <<: *edgex-common
    networks: [field]
    image: edgexfoundry/core-common-config-bootstrapper:4.0.0
    hostname: edgex-common-config
    restart: "no"
    command: ["/core-common-config-bootstrapper", "--registry", "-cp=keeper.http://edgex-core-keeper:59890", "-o"]
    depends_on:
      edgex-core-keeper: {condition: service_started}
    environment:
      <<: *edgex-env
      ALL_SERVICES_DATABASE_HOST: edgex-postgres
      ALL_SERVICES_MESSAGEBUS_HOST: edgex-mqtt-broker
      ALL_SERVICES_REGISTRY_HOST: edgex-core-keeper
      APP_SERVICES_CLIENTS_CORE_METADATA_HOST: edgex-core-metadata
      DEVICE_SERVICES_CLIENTS_CORE_METADATA_HOST: edgex-core-metadata
      APP_SERVICES_WRITABLE_STOREANDFORWARD_RETRYINTERVAL: "5s"
      APP_SERVICES_WRITABLE_STOREANDFORWARD_MAXRETRYCOUNT: "1000"

  edgex-core-metadata:
    <<: *edgex-common
    networks: [field]
    image: edgexfoundry/core-metadata:4.0.0
    hostname: edgex-core-metadata
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890", "-o"]
    depends_on:
      edgex-common-config: {condition: service_started}
    environment:
      <<: *edgex-env
      SERVICE_HOST: edgex-core-metadata

  edgex-core-data:
    <<: *edgex-common
    networks: [field]
    image: edgexfoundry/core-data:4.0.0
    hostname: edgex-core-data
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890", "-o"]
    depends_on:
      edgex-common-config: {condition: service_started}
      edgex-core-metadata: {condition: service_started}
    environment:
      <<: *edgex-env
      SERVICE_HOST: edgex-core-data

  edgex-core-command:
    <<: *edgex-common
    networks: [field]
    image: edgexfoundry/core-command:4.0.0
    hostname: edgex-core-command
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890", "-o"]
    depends_on:
      edgex-common-config: {condition: service_started}
      edgex-core-metadata: {condition: service_started}
    environment:
      <<: *edgex-env
      SERVICE_HOST: edgex-core-command

  edgex-device-modbus:
    <<: *edgex-common
    networks: [field]
    image: edgexfoundry/device-modbus:4.0.0
    hostname: edgex-device-modbus
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890", "-o"]
    depends_on:
      edgex-core-data: {condition: service_started}
      edgex-core-metadata: {condition: service_started}
      plant-simulator: {condition: service_healthy}
    environment:
      <<: *edgex-env
      SERVICE_HOST: edgex-device-modbus
      DEVICE_PROFILESDIR: /res/profiles
      DEVICE_DEVICESDIR: /res/devices
      DEVICE_UPDATELASTCONNECTED: "true"
    volumes:
      - ../../edgex/profiles:/res/profiles:ro
      - ../../edgex/devices:/res/devices:ro

  # 송신 컨테이너(R02 단절 대상). field(내부 버스) + uplink(벤치 브로커).
  edgex-app-mqtt-export:
    <<: *edgex-common
    image: edgexfoundry/app-service-configurable:4.0.0
    hostname: edgex-app-mqtt-export
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890", "-o"]
    depends_on:
      edgex-core-data: {condition: service_started}
      mosquitto: {condition: service_started}
    environment:
      <<: *edgex-env
      EDGEX_PROFILE: mqtt-export
      SERVICE_HOST: edgex-app-mqtt-export
      WRITABLE_STOREANDFORWARD_ENABLED: "true"
      WRITABLE_PIPELINE_EXECUTIONORDER: "Transform, MQTTExport"
      WRITABLE_PIPELINE_FUNCTIONS_TRANSFORM_PARAMETERS_TYPE: "json"
      WRITABLE_PIPELINE_FUNCTIONS_MQTTEXPORT_PARAMETERS_BROKERADDRESS: "tcp://mosquitto:1883"
      WRITABLE_PIPELINE_FUNCTIONS_MQTTEXPORT_PARAMETERS_TOPIC: "edgex/telemetry"
      WRITABLE_PIPELINE_FUNCTIONS_MQTTEXPORT_PARAMETERS_CLIENTID: "edgex-mqtt-export"
      WRITABLE_PIPELINE_FUNCTIONS_MQTTEXPORT_PARAMETERS_QOS: "1"
      WRITABLE_PIPELINE_FUNCTIONS_MQTTEXPORT_PARAMETERS_AUTHMODE: "none"
      WRITABLE_PIPELINE_FUNCTIONS_MQTTEXPORT_PARAMETERS_AUTORECONNECT: "true"
      WRITABLE_PIPELINE_FUNCTIONS_MQTTEXPORT_PARAMETERS_PERSISTONERROR: "true"

  edgex-ui:
    <<: *edgex-common
    networks: [field]
    image: edgexfoundry/edgex-ui:4.0.0
    hostname: edgex-ui
    depends_on:
      edgex-core-metadata: {condition: service_started}
    environment:
      <<: *edgex-env
      SERVICE_HOST: edgex-ui

  # ── P1 Telegraf 1.40.1 inputs.modbus → outputs.mqtt ────────────────────────────
  telegraf:
    image: telegraf:1.40.1-alpine
    profiles: [telegraf]
    hostname: telegraf-ingest
    networks: [field, uplink]
    depends_on:
      plant-simulator: {condition: service_healthy}
      mosquitto: {condition: service_started}
    volumes:
      - ./telegraf/modbus-mqtt.conf:/etc/telegraf/telegraf.conf:ro

  # ── P1 benthos-umh v0.16.0 modbus 입력 → mqtt 출력 ─────────────────────────────
  benthos-umh:
    image: ghcr.io/united-manufacturing-hub/benthos-umh:0.16.0
    profiles: [benthos-umh]
    hostname: benthos-umh
    networks: [field, uplink]
    depends_on:
      plant-simulator: {condition: service_healthy}
      mosquitto: {condition: service_started}
    volumes:
      - ./benthos-umh/benthos.yaml:/benthos.yaml:ro

  # ── P1 HiveMQ Edge 2026.14 Modbus 어댑터 + 내장 브로커(P-EB) ─────────────────────
  # 검사기는 hivemq-edge:1883 을 직접 구독한다(수집+브로커 통합안). 오프라인 버퍼·Data Hub 는 상용 → 미사용.
  hivemq-edge:
    image: hivemq/hivemq-edge:2026.14
    profiles: [hivemq-edge]
    hostname: hivemq-edge
    networks: [field, uplink]
    depends_on:
      plant-simulator: {condition: service_healthy}
    volumes:
      - ./hivemq-edge/config.xml:/opt/hivemq/conf/config.xml:ro

  # ── P2 Neuron 2.13.0 (Modbus TCP 드라이버 + MQTT 앱, OSS 범위). 설정은 REST(neuron/setup.py) ──
  neuron:
    image: emqx/neuron:2.13.0
    profiles: [neuron]
    hostname: neuron
    networks: [field, uplink]
    depends_on:
      plant-simulator: {condition: service_healthy}
      mosquitto: {condition: service_started}

  # ── P2 Node-RED 5.0.7 + node-red-contrib-modbus 5.60.2 ─────────────────────────
  nodered:
    build: ./nodered
    image: ingestbench-nodered:5.0.7-modbus5.60.2
    profiles: [nodered]
    hostname: nodered
    networks: [field, uplink]
    depends_on:
      plant-simulator: {condition: service_healthy}
      mosquitto: {condition: service_started}

  # ── P3 ThingsBoard IoT Gateway 3.8.5 (Modbus 커넥터 → "ThingsBoard" 자리에 벤치 Mosquitto) ──
  tbgw:
    image: thingsboard/tb-gateway:3.8.5
    profiles: [tbgw]
    hostname: tbgw
    networks: [field, uplink]
    depends_on:
      plant-simulator: {condition: service_healthy}
      mosquitto: {condition: service_started}
    # 게이트웨이는 설정 폴더에 쓴다(읽기 전용 마운트면 커넥터 적재 실패 "Read-only file system", #109) 그리고 첫 실행 때
    # 기본 설정을 설정 폴더에 덮어쓴다(/start-gateway.sh) → 벤치 파일은 /bench 에 두고, 기본 설정을 깐 뒤 덮어쓰고 시작한다.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cp -r /default-config/config/* /thingsboard_gateway/config/ && cp -r /default-config/extensions/* /thingsboard_gateway/extensions/           && cp /bench/tb_gateway.json /bench/modbus.json /thingsboard_gateway/config/ && touch /thingsboard_gateway/config/.firstlaunch           && exec python /thingsboard_gateway/tb_gateway.py
    volumes:
      - ./tbgw/tb_gateway.json:/bench/tb_gateway.json:ro
      - ./tbgw/modbus.json:/bench/modbus.json:ro
      - tbgw-logs:/thingsboard_gateway/logs
      - tbgw-ext:/thingsboard_gateway/extensions

  # ── P3 Apache StreamPipes 0.98.0 (공식 installer/compose/docker-compose.yml 구성, 태그만 고정) ──
  # 어댑터(Modbus/PLC4X)·MQTT 싱크는 UI 에서 수동 생성(STAGE2.md). UI 호스트 포트 39088.
  streampipes-backend:
    image: apachestreampipes/backend:0.98.0
    profiles: [streampipes]
    hostname: backend
    networks: [field, uplink]
    depends_on: [streampipes-couchdb]
    environment:
      - SP_PRIORITIZED_PROTOCOL=nats
    volumes:
      - sp-backend:/root/.streampipes
  streampipes-ui:
    image: apachestreampipes/ui:0.98.0
    profiles: [streampipes]
    hostname: ui
    networks: [uplink]
    environment:
      - SP_HTTP_SERVER_ADAPTER_ENDPOINT=extensions-all-iiot:8090
    ports:
      - "39088:8088"
    depends_on: [streampipes-couchdb, streampipes-backend]
  streampipes-couchdb:
    image: couchdb:3.3.1                     # StreamPipes 0.98 installer 고정값
    profiles: [streampipes]
    hostname: couchdb
    networks: [uplink]
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    volumes:
      - sp-couchdb:/opt/couchdb/data
  streampipes-influxdb:
    image: influxdb:2.6                      # StreamPipes 0.98 installer 고정값(2.6 은 지원 종료 — STAGE2.md 약점)
    profiles: [streampipes]
    hostname: influxdb
    networks: [uplink]
    environment:
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=sp-admin
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=sp-admin
      - DOCKER_INFLUXDB_INIT_ORG=sp
      - DOCKER_INFLUXDB_INIT_BUCKET=sp
      - DOCKER_INFLUXDB_INIT_MODE=setup
    volumes:
      - sp-influx2:/var/lib/influxdb2
  streampipes-nats:
    image: nats:2.15.0-alpine                # installer 는 태그 없는 `nats` → 고정
    profiles: [streampipes]
    hostname: nats
    networks: [uplink]
  streampipes-extensions-all-iiot:
    image: apachestreampipes/extensions-all-iiot:0.98.0
    profiles: [streampipes]
    hostname: extensions-all-iiot
    networks: [field, uplink]

  # ── P3 OpenRemote 1.31.1 (AGPL-3.0 ⚠제품화 시 주의). Modbus 에이전트는 UI 수동 설정. 호스트 39443 ──
  openremote-proxy:
    image: openremote/proxy:3.2.19.0
    profiles: [openremote]
    networks: [uplink]
    depends_on:
      openremote-manager: {condition: service_healthy}
    ports:
      - "39443:443"
    environment:
      DOMAINNAME: localhost
      MANAGER_HOST: manager
      KEYCLOAK_HOST: keycloak
  openremote-postgresql:
    image: openremote/postgresql:17.9.0.1-slim
    profiles: [openremote]
    hostname: postgresql
    networks: [uplink]
    shm_size: 128mb
    volumes:
      - or-postgresql:/var/lib/postgresql/data
  openremote-keycloak:
    image: openremote/keycloak:26.7.3.0
    profiles: [openremote]
    hostname: keycloak
    networks: [uplink]
    depends_on:
      openremote-postgresql: {condition: service_healthy}
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: bench-secret
      KC_HOSTNAME: https://localhost:39443/auth
  openremote-manager:
    image: openremote/manager:1.31.1
    profiles: [openremote]
    hostname: manager
    networks: [field, uplink]
    depends_on:
      openremote-keycloak: {condition: service_healthy}
    environment:
      OR_ADMIN_PASSWORD: bench-secret
      OR_HOSTNAME: localhost
      OR_SSL_PORT: "39443"
      OR_METRICS_ENABLED: "true"
    volumes:
      - or-manager:/storage

volumes:
  edgex-db:
  tbgw-logs:
  tbgw-ext:
  sp-backend:
  sp-couchdb:
  sp-influx2:
  or-postgresql:
  or-manager:
