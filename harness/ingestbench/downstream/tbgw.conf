# ═══════════════════════════════════════════════════════════════════════════
# ThingsBoard IoT Gateway 3.8.5 용 하류 파서(설정만, 코드 없음) — 09-29 결정: 판정은 "결과 동등"(같은 12태그·값·시각이 sensor.telemetry.raw 에 도달).
# V1 Telegraf#1(downstream/v1-edgex.conf)과 같은 출력 레코드({ts ns, site, device, tag, value, quality})를 만든다.
# 바뀐 곳은 입력 해석뿐: {"reactor-line-01":[{ts(ms), values{태그→값}}]} 배열 원소마다 values 를 태그별 레코드로 펼침.
# 필터(계측 12태그만·센티널 제외)와 출력 변환식은 V1 원문 그대로. 이미지: telegraf:1.40.1-alpine(1.33 은 강제 교체 대상).
# 형식 [미검증] — 기동 금지 중 작성. ② 첫 실행 때 downstream 레코드 수·일치로 확인된다.
# ═══════════════════════════════════════════════════════════════════════════
[agent]·inputs·processors 를 한 글자도 바꾸지 않고 옮기고,
# 바뀐 곳은 셋뿐이다: ① 브로커 주소·토픽을 환경변수로(벤치 브로커), ② client_id, ③ outputs.kafka → outputs.file.
# 출력 JSON 은 V1 이 Kafka sensor.telemetry.raw 에 쓰는 레코드와 같은 변환식(json_transformation)이다.
# 후보 메시지가 이 파서를 통과해 12태그 레코드가 나오면 "V1 하류 무수정 호환"이다.

[agent]
  interval = "1s"
  round_interval = false
  metric_batch_size = 2000
  metric_buffer_limit = 100000
  flush_interval = "1s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["${INGEST_BROKER}"]
  topics = ["${INGEST_TOPIC}"]
  qos = 1
  username = "${INGEST_USER}"   # OpenRemote 서비스 사용자 등 인증 필요한 브로커용(비어 있으면 익명)
  password = "${INGEST_PASS}"
  client_id = "downstream-ingestbench"
  persistent_session = true
  connection_timeout = "30s"
  name_override = "sensor"
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sensor"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "reactor-line-01"
      timestamp_key = "ts"
      timestamp_format = "unix_ms"
      disable_prepend_keys = true

[[processors.unpivot]]
  order = 1
  namepass = ["sensor"]
  use_fieldname_as = "tag"
  tag_key = "resource"
  value_key = "value"

[[processors.rename]]
  order = 2
  namepass = ["sensor"]
  [[processors.rename.replace]]
    tag = "resource"
    dest = "tag"

[[processors.override]]
  order = 3
  namepass = ["sensor"]
  [processors.override.tags]
    device = "reactor-line-01"

[[processors.starlark]]
  order = 9
  namepass = ["sensor"]
  source = '''
SENSOR_TAGS = {
    "LT-101": 1, "LT-102": 1, "TT-101": 1, "TT-102": 1,
    "PT-101": 1, "FT-101": 1, "FT-102": 1, "IT-101": 1,
    "IT-102": 1, "VT-101": 1, "pH-101": 1, "CT-101": 1,
}
BAD_QUALITY = -999998.0

def apply(metric):
    tag = metric.tags.get("tag")
    if tag == None or tag not in SENSOR_TAGS:
        return None
    v = metric.fields.get("value")
    if v == None or v <= BAD_QUALITY:
        return None
    metric.tags["site"] = "AR-100"
    metric.tags["quality"] = "GOOD"
    return metric
'''

[[outputs.file]]
  files = ["${V1PARSE_FILE}"]
  data_format = "json"
  json_timestamp_units = "1ns"
  json_transformation = '''
  {
    "ts":      $number(timestamp),
    "site":    tags.site,
    "device":  tags.device,
    "tag":     tags.tag,
    "value":   fields.value,
    "quality": tags.quality
  }
  '''
