# V1 모양(EdgeX Event) 후보용 하류 파서 = V1 Telegraf#1 원문.
# telegraf/bridge-edgex.conf(V1 Telegraf#1)의 [agent]·inputs·processors 를 한 글자도 바꾸지 않고 옮기고,
# 바뀐 곳은 넷뿐이다: ① 브로커 주소·토픽을 환경변수로(벤치 브로커), ② client_id, ③ outputs.kafka → outputs.file, ④ 인증 칸(빈 값 = 익명, V1 과 같음).
# 출력 JSON 은 V1 이 Kafka sensor.telemetry.raw 에 쓰는 레코드와 같은 변환식(json_transformation)이다.
# 후보 메시지가 이 파서를 통과해 12태그 레코드가 나오면 "V1 하류 무수정 호환"이다.

[agent]
  interval = "1s"
  round_interval = false
  metric_batch_size = 2000
  metric_buffer_limit = 100000
  flush_interval = "1s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["${INGEST_BROKER}"]
  topics = ["${INGEST_TOPIC}"]
  qos = 1
  username = "${INGEST_USER}"   # OpenRemote 서비스 사용자 등 인증 필요한 브로커용(비어 있으면 익명)
  password = "${INGEST_PASS}"
  client_id = "downstream-ingestbench"
  persistent_session = true
  connection_timeout = "30s"
  name_override = "sensor"

  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sensor"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "readings"
      timestamp_key = "origin"
      timestamp_format = "unix_ns"
      tags = ["resourceName", "deviceName"]
      [inputs.mqtt_consumer.json_v2.object.fields]
        value = "float"

[[processors.rename]]
  order = 1
  namepass = ["sensor"]
  [[processors.rename.replace]]
    tag = "resourceName"
    dest = "tag"
  [[processors.rename.replace]]
    tag = "deviceName"
    dest = "device"

[[processors.defaults]]
  order = 2
  namepass = ["sensor"]
  [processors.defaults.fields]
    value = 0.0

[[processors.starlark]]
  order = 3
  namepass = ["sensor"]
  source = '''
SENSOR_TAGS = {
    "LT-101": 1, "LT-102": 1, "TT-101": 1, "TT-102": 1,
    "PT-101": 1, "FT-101": 1, "FT-102": 1, "IT-101": 1,
    "IT-102": 1, "VT-101": 1, "pH-101": 1, "CT-101": 1,
}
BAD_QUALITY = -999998.0

def apply(metric):
    tag = metric.tags.get("tag")
    if tag == None or tag not in SENSOR_TAGS:
        return None
    v = metric.fields.get("value")
    if v == None or v <= BAD_QUALITY:
        return None
    metric.tags["site"] = "AR-100"
    metric.tags["quality"] = "GOOD"
    return metric
'''

[[outputs.file]]
  files = ["${V1PARSE_FILE}"]
  data_format = "json"
  json_timestamp_units = "1ns"
  json_transformation = '''
  {
    "ts":      $number(timestamp),
    "site":    tags.site,
    "device":  tags.device,
    "tag":     tags.tag,
    "value":   fields.value,
    "quality": tags.quality
  }
  '''
