# 알람 워커 후보: Bento 1.21.2 / Redpanda Connect 4.111.0(Apache 컴포넌트만) 공용.
# V1 consumer.py 의 엔진 몫(Kafka 소비 · DB 영속 뒤 커밋 · 실패 시 재시도 · 순서)을 설정으로:
#   kafka_franz(그룹 ${ALW_GROUP}, earliest, checkpoint_limit 1 = 파티션마다 한 건씩 커밋 — V1 동기 커밋과 같음)
#   → sql_insert(postgres) 로 alarm_intake 에 (topic, partition, offset, 원문 바이트) 1행. 업무 판단은 DB 트리거(sql/20_intake_trigger.sql).
# 출력 성공(행 삽입 커밋) 뒤에만 오프셋이 커밋된다(at-least-once). DB 다운이면 출력이 재시도하고 소비가 멈춘다(V1 워커는 예외로 재시작).
input:
  kafka_franz:
    seed_brokers: ["kafka:9092"]
    topics: ["sensor.alerts"]
    consumer_group: "${ALW_GROUP:alw-bento}"
    start_from_oldest: true
    checkpoint_limit: 1
    auto_replay_nacks: true
output:
  sql_insert:
    driver: postgres
    dsn: "postgres://ar100:alwbench@work-db:5432/ar100_work?sslmode=disable"
    table: alarm_intake
    columns: [topic, partition_id, offset_id, raw_payload]
    args_mapping: 'root = [ meta("kafka_topic"), meta("kafka_partition").number(), meta("kafka_offset").number(), content() ]'
    max_in_flight: 1
    batching:
      count: 1
logger:
  level: INFO
