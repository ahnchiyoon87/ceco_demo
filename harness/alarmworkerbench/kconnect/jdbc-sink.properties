# 엔진 몫: sensor.alerts → alarm_intake(raw_payload, topic, partition_id, offset_id) 1행(업무 판단은 DB 트리거).
# SMT: HoistField(값 → Struct{raw_payload: bytes}) → InsertField(topic·partition·offset 필드 추가). 커밋: 싱크 put 성공 뒤(Connect 기본).
# 그룹 = connect-alw-jdbc. 배치 1건(consumer.max.poll.records=1)으로 V1 의 한 건씩 커밋과 맞춘다.
name=alw-jdbc
connector.class=io.aiven.connect.jdbc.JdbcSinkConnector
tasks.max=1
topics=sensor.alerts
connection.url=jdbc:postgresql://work-db:5432/ar100_work
connection.user=ar100
connection.password=alwbench
insert.mode=insert
pk.mode=none
auto.create=false
auto.evolve=false
table.name.format=alarm_intake
batch.size=1
max.retries=100000
retry.backoff.ms=1000
consumer.override.max.poll.records=1
consumer.override.auto.offset.reset=earliest
transforms=hoist,meta
transforms.hoist.type=org.apache.kafka.connect.transforms.HoistField$Value
transforms.hoist.field=raw_payload
transforms.meta.type=org.apache.kafka.connect.transforms.InsertField$Value
transforms.meta.topic.field=topic
transforms.meta.partition.field=partition_id
transforms.meta.offset.field=offset_id
