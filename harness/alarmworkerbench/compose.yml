# 알람 워커 벤치 (EXP-ALW, 09-29 지시). V1 직접 짠 소비자(operations/consumer.py → 업무 DB 사건) 대 엔진 기능으로 대체하는 후보.
#   docker compose -p alwbench -f harness/alarmworkerbench/compose.yml --profile <profile> up -d   (직접 부르지 말고 stage2.sh)
# 정답: 같은 알람 흐름(결정적 입력 파일)에 대해 V1 과 같은 사건·상관(correlation)·이벤트·inbox 상태, 재전달 시 변화 없음.
# 고정 상수: Kafka(KAFKA_IMAGE, 기본 V1 3.9.0) · PostgreSQL 17(V1 ai-work-db 와 같은 이미지). 호스트 포트 없음.
name: alwbench

services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: alwbench-kraft-cluster01
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    depends_on:
      kafka: {condition: service_healthy}
    volumes:
      - ../../kafka/create-topics.sh:/create-topics.sh:ro     # V1 토픽(sensor.alerts 3파티션·7일)
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  work-db:
    image: postgres:17
    hostname: work-db
    environment:
      POSTGRES_DB: ar100_work
      POSTGRES_USER: ar100
      POSTGRES_PASSWORD: alwbench                              # 벤치 전용 값(비밀 아님)
    volumes:
      - ./${INITDB:-initdb/none}:/docker-entrypoint-initdb.d:ro   # 엔진 후보: sql/(V1 스키마 + 접수 트리거), V1: 비움(워커가 만든다)
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ar100 -d ar100_work"], interval: 5s, timeout: 5s, retries: 24}

  client:
    build: .
    image: alwbench-client:1.0
    profiles: [tools]
    volumes:
      - ../..:/repo:ro
      - ../../experiments:/experiments

  # ── V1 기준: 직접 짠 소비자(코드 그대로 마운트) ─────────────────────────────
  v1-worker:
    build: {context: ., dockerfile: Dockerfile.v1worker}
    image: alwbench-v1worker:1.0
    profiles: [v1]
    restart: unless-stopped                                   # V1 compose 와 같음(예외 → 재시작)
    depends_on: &deps
      work-db: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      DB_HOST: work-db
      DB_PORT: "5432"
      DB_NAME: ar100_work
      DB_USER: ar100
      DB_PASSWORD: alwbench
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHONPATH: /app
    volumes:
      - ../../ai-layer/knowledge/backend:/app/backend:ro

  # ── 후보: Bento 1.21.2 / Redpanda Connect 4.111.0 (kafka_franz → sql_insert) ──
  bento:
    image: ghcr.io/warpstreamlabs/bento:1.21.2
    profiles: [bento]
    restart: unless-stopped
    depends_on: *deps
    environment: {ALW_GROUP: alw-bento}
    command: ["-c", "/engine/bento.yaml"]
    volumes: ["./engine:/engine:ro"]
  rpconnect:
    image: docker.redpanda.com/redpandadata/connect:4.111.0
    profiles: [rpconnect]
    restart: unless-stopped
    depends_on: *deps
    environment: {ALW_GROUP: alw-rpconnect}
    command: ["run", "/engine/bento.yaml"]
    volumes: ["./engine:/engine:ro"]

  # ── 후보: eKuiper 2.4.2 (kafka 소스 → sql 싱크, 규칙은 ekuiper/setup.py) ──
  ekuiper:
    image: lfedge/ekuiper:2.4.2
    profiles: [ekuiper]
    hostname: ekuiper
    restart: unless-stopped
    depends_on: *deps

  # ── 후보: Kafka Connect + Aiven JDBC sink 6.12.0 (소스 빌드) ──
  kconnect:
    build: ./kconnect
    image: alwbench-kconnect:4.3.1-aivenjdbc6.12.0
    profiles: [kconnect]
    restart: unless-stopped
    depends_on: *deps
