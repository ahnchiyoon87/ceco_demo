# V2 개선 후보 규칙(09-29 결정 2) — V1 rules.yml 에 없는 "탐지기 정지" 탐지(E11 두 번째 조건, F10).
# 근거: V1_FACTS §5 — JobManager 재시작 뒤 Flink 잡 0개인데 화면엔 "알람 없음"만 보였다. 기존 FlinkJobRestarting 은 재시작 횟수만 봄.
groups:
  - name: pipeline-health-v2
    rules:
      - alert: DetectorJobsZero
        expr: max by (job, instance) (flink_jobmanager_numRunningJobs) == 0
        for: 1m
        labels: { severity: critical, tier: "3" }
        annotations:
          summary: "탐지 잡 0개 ({{ $labels.instance }})"
          description: "Flink JobManager 는 살아 있으나 실행 중 잡이 없음 — 탐지·알람이 조용히 멈춘 상태."
