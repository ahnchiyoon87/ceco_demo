# mon_prepare.py 생성. VictoriaMetrics -promscrape.config (rot). 규칙은 vmalert.
global:
  scrape_interval: 10s
  external_labels:
    pipeline: ar100-iiot
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - mon-vm:9090
- job_name: emqx
  metrics_path: /api/v5/prometheus/stats
  static_configs:
  - targets:
    - emqx:18083
- job_name: kafka
  static_configs:
  - targets:
    - kafka-exporter:9308
- job_name: flink
  static_configs:
  - targets:
    - flink-jobmanager:9249
    - flink-taskmanager:9249
- job_name: influxdb
  metrics_path: /metrics
  static_configs:
  - targets:
    - influxdb:8086
- job_name: cadvisor
  static_configs:
  - targets:
    - cadvisor:8080
- job_name: synthetic-down
  static_configs:
  - targets:
    - mon-nonexistent:9999
- job_name: victim
  static_configs:
  - targets:
    - mon-victim:8080
- job_name: detector-sim
  static_configs:
  - targets:
    - mon-detector:8080
- job_name: cadvisor-next
  static_configs:
  - targets:
    - mon-cadvisor:8080
- job_name: kafka-next
  static_configs:
  - targets:
    - mon-kafka-exporter:9308
