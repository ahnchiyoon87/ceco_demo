# mon_prepare.py 가 생성(손으로 고치지 말 것). V1 과 차이: alertmanager=mon-am, 벤치 잡 5개.
# 전체 스택 모드: V1 prometheus/prometheus.yml 의 scrape_configs 그대로(rot-iiot 에 읽기로 붙어 같은 대상) + 벤치 합성 대상.
# 규칙: V1 prometheus/rules.yml 만(V1 그대로).
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    pipeline: ar100-iiot
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - mon-am:9093
rule_files:
- /etc/prometheus/rules.yml
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: emqx
  metrics_path: /api/v5/prometheus/stats
  static_configs:
  - targets:
    - emqx:18083
- job_name: kafka
  static_configs:
  - targets:
    - kafka-exporter:9308
- job_name: flink
  static_configs:
  - targets:
    - flink-jobmanager:9249
    - flink-taskmanager:9249
- job_name: influxdb
  metrics_path: /metrics
  static_configs:
  - targets:
    - influxdb:8086
- job_name: cadvisor
  static_configs:
  - targets:
    - cadvisor:8080
- job_name: synthetic-down
  static_configs:
  - targets:
    - mon-nonexistent:9999
- job_name: victim
  static_configs:
  - targets:
    - mon-victim:8080
- job_name: detector-sim
  static_configs:
  - targets:
    - mon-detector:8080
- job_name: cadvisor-next
  static_configs:
  - targets:
    - mon-cadvisor:8080
- job_name: kafka-next
  static_configs:
  - targets:
    - mon-kafka-exporter:9308
