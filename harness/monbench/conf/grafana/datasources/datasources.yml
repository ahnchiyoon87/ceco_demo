# V1 grafana/provisioning/datasources/datasources.yml 과 같은 두 데이터소스·uid. 주소만 벤치 기준:
#   InfluxDB  → rot 스택 influxdb(rot-iiot 네트워크, V1 과 같은 이름) / Prometheus → 벤치 후보(mon-prom 별칭)
apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData: {version: Flux, organization: "${INFLUX_ORG}", defaultBucket: "${INFLUX_BUCKET}", httpMode: POST}
    secureJsonData: {token: "${INFLUX_TOKEN}"}
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://mon-prom:9090
    jsonData: {timeInterval: 10s}
