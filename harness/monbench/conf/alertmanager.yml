# V1 prometheus/alertmanager.yml 과 같은 라우팅·억제. 수신처만 벤치 웹훅(mon-sink)을 추가해 전달 여부를 센다.
route:
  receiver: default
  group_by: [alertname, tier]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url: http://mon-sink:8080/alert
        send_resolved: true

inhibit_rules:
  - source_matchers: [alertname = "PipelineServiceDown"]
    target_matchers: [severity = "warning"]
    equal: [tier]
