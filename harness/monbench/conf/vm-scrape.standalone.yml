# mon_prepare.py 생성. VictoriaMetrics -promscrape.config (standalone). 규칙은 vmalert.
global:
  scrape_interval: 10s
  external_labels:
    pipeline: ar100-iiot
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - mon-vm:9090
- job_name: synthetic-down
  static_configs:
  - targets:
    - mon-nonexistent:9999
- job_name: victim
  static_configs:
  - targets:
    - mon-victim:8080
- job_name: detector-sim
  static_configs:
  - targets:
    - mon-detector:8080
- job_name: cadvisor-next
  static_configs:
  - targets:
    - mon-cadvisor:8080
- job_name: kafka-next
  static_configs:
  - targets:
    - mon-kafka-exporter:9308
