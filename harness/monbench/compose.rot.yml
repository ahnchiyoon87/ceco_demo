# 전체 스택 모드 덧씌우기(09-29 결정 3): 벤치 수집기·Grafana·kafka-exporter·클라이언트를 rot-iiot 에 "읽기로만" 붙인다.
# 붙는 목적은 스크레이프(수집기)·조회(Grafana 가 rot InfluxDB, 클라이언트가 V1 Prometheus 대상 상태)뿐. rot 컨테이너 조작 없음.
#   docker compose -f harness/monbench/compose.yml -f harness/monbench/compose.rot.yml ...
networks:
  rot:
    external: true
    name: ${ROT_NETWORK:-rot-iiot}

services:
  prom-v1: {networks: {rot: {}}}
  prom315: {networks: {rot: {}}}
  prom313: {networks: {rot: {}}}
  vm: {networks: {rot: {}}}
  grafana-v1: {networks: {rot: {}}}
  grafana13: {networks: {rot: {}}}
  kafka-exporter: {networks: {rot: {}}}
  client: {networks: {rot: {}}}
