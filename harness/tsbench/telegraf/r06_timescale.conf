# ④ R06 훅(EXP-TS): Telegraf 1.40 = V1 telegraf-sink 역할(쓰기 주체·버퍼). agent 값은 V1 telegraf/sink.conf 그대로(버퍼 200000).
# 입력은 하니스가 12행/초로 보내는 line protocol(측정값 r06_raw). DB 가 5분 멈춘 동안 출력 버퍼가 보관 → 재기동 후 재전송되는지 센다.
[agent]
  interval = "1s"
  round_interval = false
  metric_batch_size = 5000
  metric_buffer_limit = 200000
  flush_interval = "2s"
  omit_hostname = true

[[inputs.socket_listener]]
  service_address = "tcp://:8094"
  data_format = "influx"

[[outputs.postgresql]]
  connection = "host=timescaledb user=postgres password=bench dbname=postgres sslmode=disable"
  tags_as_foreign_keys = false
  timestamp_column_name = "time"
