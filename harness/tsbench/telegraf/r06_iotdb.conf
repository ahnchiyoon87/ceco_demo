# ④ R06 훅(EXP-TS): Telegraf 1.40 = V1 telegraf-sink 역할(쓰기 주체·버퍼). agent 값은 V1 telegraf/sink.conf 그대로(버퍼 200000).
# 입력은 하니스가 12행/초로 보내는 line protocol(측정값 r06_raw). DB 가 5분 멈춘 동안 출력 버퍼가 보관 → 재기동 후 재전송되는지 센다.
[agent]
  interval = "1s"
  round_interval = false
  metric_batch_size = 5000
  metric_buffer_limit = 200000
  flush_interval = "2s"
  omit_hostname = true

[[inputs.socket_listener]]
  service_address = "tcp://:8094"
  data_format = "influx"

[[outputs.iotdb]]
  host = "iotdb"
  port = "6667"
  user = "root"
  password = "root"
  timestamp_precision = "millisecond"
  convert_tags_to = "fields"
# 측정값 이름을 root.bench.* 로(트리 모델 경로) [미검증: 플러그인이 root. 접두를 요구하는지 ②에서 확인]
[[processors.rename]]
  [[processors.rename.replace]]
    measurement = "r06_raw"
    dest = "root.bench.r06_raw"
