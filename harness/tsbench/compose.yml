# 시계열 저장 비교 벤치 (EXP-TS, CANDIDATES §6). 호스트 포트 없음, rot 스택과 네트워크·볼륨 비공유. latest 금지.
#   harness/tsbench/stage2.sh <engine>
# 한 번에 한 엔진만(stage2.sh 가 강제).
# 자원 한도 없음(09-29 결정 I5): 실제 사용량 자체가 ③ 효율 측정값이다. 공정성은 같은 호스트에서 벤치 하나씩 실행으로 확보.
name: tsbench


x-influx2-env: &influx2-env               # V1 docker-compose.yml influxdb 초기화 값(비밀만 벤치용 고정값)
  DOCKER_INFLUXDB_INIT_MODE: setup
  DOCKER_INFLUXDB_INIT_USERNAME: admin
  DOCKER_INFLUXDB_INIT_PASSWORD: bench-password-1
  DOCKER_INFLUXDB_INIT_ORG: uengine
  DOCKER_INFLUXDB_INIT_BUCKET: process
  DOCKER_INFLUXDB_INIT_RETENTION: 30d
  DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: bench-admin-token-000000000000

networks:
  ts: {}

volumes:
  influx-data:
  influx3-data:
  pg-data:
  questdb-data:
  vm-data:
  iotdb-data:
  greptime-data:
  crate-data:
  ch-data:
  taos-data:

services:
  influx27:                               # 기준 버전(V1 influxdb:2.7 — 강제 교체 대상). 태그는 V1 과 같은 마이너 태그
    profiles: [influx27]
    image: influxdb:2.7
    networks: {ts: {aliases: [influxdb]}}
    environment: *influx2-env
    volumes: [influx-data:/var/lib/influxdb2]
    healthcheck: {test: ["CMD", "influx", "ping"], interval: 5s, timeout: 5s, retries: 30}

  influx29:                               # 같은 제품 최신(P1, 강제 교체 1순위)
    profiles: [influx29]
    image: influxdb:2.9.1
    networks: {ts: {aliases: [influxdb]}}
    environment: *influx2-env
    volumes: [influx-data:/var/lib/influxdb2]
    healthcheck: {test: ["CMD", "influx", "ping"], interval: 5s, timeout: 5s, retries: 30}

  influx3:
    profiles: [influx3]
    image: influxdb:3.11.5-core
    hostname: influxdb3
    networks: {ts: {aliases: [influxdb3]}}
    # 인증 켬(기본). 관리자 토큰은 stage2.sh 가 `influxdb3 create token --admin` 으로 만들어 클라이언트에 넘긴다.
    command: ["influxdb3", "serve", "--node-id", "bench", "--object-store", "file", "--data-dir", "/var/lib/influxdb3/data"]
    volumes: [influx3-data:/var/lib/influxdb3]

  timescaledb:
    profiles: [timescale]
    image: timescale/timescaledb:2.30.1-pg18-oss   # Apache 판(-oss) — TSL 기능(압축·연속집계·보존정책) 없음
    networks: [ts]
    environment: {POSTGRES_PASSWORD: bench, TIMESCALEDB_TELEMETRY: "off"}
    volumes: [pg-data:/var/lib/postgresql]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, timeout: 5s, retries: 30}

  pgpartman:
    profiles: [pgpartman]
    build: ./pgpartman
    image: bench-pg-partman:18.6
    networks: [ts]
    environment: {POSTGRES_PASSWORD: bench}
    volumes: [pg-data:/var/lib/postgresql]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, timeout: 5s, retries: 30}

  questdb:
    profiles: [questdb]
    image: questdb/questdb:10.0.1
    networks: [ts]
    volumes: [questdb-data:/var/lib/questdb]

  victoriametrics:
    profiles: [victoriametrics]
    image: victoriametrics/victoria-metrics:v1.153.0
    networks: [ts]
    command: ["-storageDataPath=/victoria-metrics-data", "-retentionPeriod=100y", "-search.latencyOffset=30s"]  # 기본값 명시(가시화 지연 요인)
    volumes: [vm-data:/victoria-metrics-data]

  iotdb:
    profiles: [iotdb]
    image: apache/iotdb:2.0.11-standalone
    networks: [ts]
    environment: {cn_internal_address: iotdb, dn_rpc_address: 0.0.0.0, dn_internal_address: iotdb}
    volumes: [iotdb-data:/iotdb/data]

  greptime:
    profiles: [greptime]
    image: greptime/greptimedb:v1.2.1
    networks: [ts]
    command: ["standalone", "start", "--http-addr", "0.0.0.0:4000", "--rpc-bind-addr", "0.0.0.0:4001",
              "--mysql-addr", "0.0.0.0:4002", "--postgres-addr", "0.0.0.0:4003", "--data-home", "/greptimedb_data"]
    volumes: [greptime-data:/greptimedb_data]

  cratedb:
    profiles: [cratedb]
    image: crate/crate:6.4.5
    networks: [ts]
    command: ["crate", "-Cdiscovery.type=single-node", "-Cnode.name=bench"]
    volumes: [crate-data:/data]

  clickhouse:
    profiles: [clickhouse]
    image: clickhouse/clickhouse-server:26.8.14.3  # 26.8 LTS 최신 패치(2026-09-28)
    networks: [ts]
    environment: {CLICKHOUSE_PASSWORD: bench}
    ulimits: {nofile: {soft: 262144, hard: 262144}}
    volumes: [ch-data:/var/lib/clickhouse]

  tdengine:                               # AGPL-3.0 ⚠ 제품화 시 주의
    profiles: [tdengine]
    image: tdengine/tsdb:3.4.2.8
    hostname: tdengine
    networks: [ts]
    environment: {TZ: UTC}
    volumes: [taos-data:/var/lib/taos]

  # ④ R06 훅: 엔진별 Telegraf 출력 설정(telegraf/r06_<engine>.conf) — stage2.sh R06=1 일 때만
  telegraf-r06:
    profiles: [r06]
    image: telegraf:1.40.1-alpine
    networks: [ts]
    environment: {INFLUX3_TOKEN: "${INFLUX3_TOKEN:-}"}
    volumes: ["./telegraf/r06_${TS_ENGINE:-influx29}.conf:/etc/telegraf/telegraf.conf:ro"]

  client:
    profiles: [tools]
    build: ../benchcommon
    image: bench-client:1.0
    networks: [ts]
    environment:
      PYTHONUTF8: "1"
      INFLUX3_TOKEN: "${INFLUX3_TOKEN:-}"
      BENCH_GUARD_FORCED: ${BENCH_GUARD_FORCED:-0}
    volumes:
      - ../..:/repo:ro
      - ../../experiments:/experiments
