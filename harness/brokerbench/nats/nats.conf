# EXP-138 NATS Server 2.15.0 MQTT (CANDIDATES §3 [묶음 NATS]). MQTT 는 JetStream 위에서만 동작(server_name 필수).
# V1 EMQX 역할만: MQTT 1883, MQTT over WebSocket 8083, 영속(JetStream 파일 저장), 모니터링 HTTP 8222(/varz·/connz).
# 인증 없음(V1 EMQX 와 같음). MQTT 3.1.1 만 지원(QoS2 → QoS1 강등 없음, QoS2 미지원은 V1 사용 범위 밖).
server_name: brokerbench-nats
http_port: 8222
jetstream {
  store_dir: /data
}
mqtt {
  port: 1883
  # V1 보장 맞춤(09-29): 세션당 미확인 QoS1 상한 기본 1024 → 65535(제품 최대). 오프라인 보관은 JetStream 스트림(기본 무제한 = V1 10만 이상).
  max_ack_pending: 32767   # 65534·65535 는 설정은 받지만 QoS1 전달이 조용히 멈춤(오류 로그 없음, #105 실측) → 동작 확인된 32767
}
websocket {
  port: 8083
  no_tls: true
}
