# NanoMQ 0.25.6 이미지 기본 설정(/etc/nanomq.conf) + 두 곳만 변경(브로커 벤치 c 이후):
#  1) max_mqueue_len 2048 → 100000 (V1 EMQX mqueue 10만과 같게)
#  2) sqlite 블록 추가: 오프라인 세션 메시지 디스크 캐시(Mosquitto persistence·HiveMQ 기본 영속과 같은 조건)
# NanoMQ Configuration 0.19.0

# #============================================================
# # NanoMQ Broker
# #============================================================

mqtt {
    property_size = 32
    max_topic_alias = 1024
    max_packet_size = 256MB
    max_mqueue_len = 100000
    retry_interval = 10s
    keepalive_multiplier = 1.25
    
    # Three of below, unsupported now
    max_inflight_window = 2048
    max_awaiting_rel = 10s
    await_rel_timeout = 10s
}

listeners.tcp {
    bind = "0.0.0.0:1883"
}

# listeners.ssl {
# 	bind = "0.0.0.0:8883"
# 	keyfile = "/etc/certs/key.pem"
# 	certfile = "/etc/certs/cert.pem"
# 	cacertfile = "/etc/certs/cacert.pem"
# 	verify_peer = false
# 	fail_if_no_peer_cert = false
# }

listeners.ws {
    bind = "0.0.0.0:8083/mqtt"
}

http_server {
    port = 8081
    limit_conn = 2
    username = admin
    password = public
    auth_type = basic
    jwt {
        public.keyfile = "/etc/certs/jwt/jwtRS256.key.pub"
    }
}

log {
    to = [file, console]
    level = warn
    dir = "/tmp"
    file = "nanomq.log"
    rotation {
        size = 10MB
        count = 5
    }
}

auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore

    # password = {include "/etc/nanomq_pwd.conf"}
    # acl = {include "/etc/nanomq_acl.conf"}
}

sqlite {
    disk_cache_size = 102400
    mounted_file_path = "/data/"
    flush_mem_threshold = 100
    resend_interval = 5000
}
