# EXP-140 comqtt v2.6.5 단일 노드(MIT). 이미지 동봉 /etc/comqtt/examples/single.yml 에서 바꾼 곳:
#  storage-path → /data(볼륨), dashboard 끔(사용자 파일 없음), ws 1882 → 8083, 로그는 콘솔만.
# 보장 맞춤: maximum-client-writes-pending 65535→100000(V1 큐 10만). 세션 만료 상한 무제한 기본 유지.
# storage-way 1(bolt 디스크) = 기본값 그대로 — 브로커 재시작을 넘어선 세션·큐(BR-04).
storage-way: 1
storage-path: /data/comqtt.db
bridge-way: 0
pprof-enable: false
dashboard-enable: false
auth:
  way: 0
  datasource: 0
mqtt:
  tcp: :1883
  ws: :8083
  http: :8080
  options:
    client-write-buffer-size: 1024
    client-read-buffer-size: 1024
    sys-topic-resend-interval: 1
    inline-client: true
    capabilities:
      maximum-message-expiry-interval: 86400
      maximum-session-expiry-interval: 4294967295
      maximum-client-writes-pending: 100000   # V1 큐 10만에 맞춤(09-29): 예제값 65535 → 100000
      maximum-packet-size: 0
      receive-maximum: 1024
      topic-alias-maximum: 65535
      maximum-qos: 2
      retain-available: 1
      wildcard-sub-available: 1
      sub-id-available: 1
      shared-sub-available: 1
      minimum-protocol-version: 3
log:
  enable: true
  format: 0
  output: 0
  level: 4
