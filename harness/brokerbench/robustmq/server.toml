# Minimal single-node config: everything below is all that's needed to start
# RobustMQ. Every other setting (ports, TLS, tuning, per-protocol config, ...)
# has a sensible built-in default -- see config/server.toml.template for the
# full, documented list of what can be overridden.

cluster_name = "broker-server"
broker_id = 1
broker_ip = "127.0.0.1"
roles = ["meta", "broker", "engine"]
grpc_port = 1228
http_port = 58080
meta_addrs = { 1 = "127.0.0.1:1228" }

[log]
log_config = "./config/logger.toml"
log_path = "./data/logs"

[mqtt_runtime.server]
tcp_port = 1883
tls_port = 1885
websocket_port = 8083
websockets_port = 8085
quic_port = 9083

[mqtt_runtime.auth]
default_user = "admin"
default_password = "robustmq"                # CHANGE IN PRODUCTION
durable_sessions_enable = true                # false = transient (memory-only, faster)
secret_free_login = false
is_self_protection_status = false

[mqtt_runtime.protocol]
max_session_expiry_interval = 7200
default_session_expiry_interval = 7200
topic_alias_max = 65535
max_packet_size = 10485760  # 10 MB
receive_max = 65535
max_message_expiry_interval = 3600
client_pkid_persistent = false

[mqtt_runtime.offline_message]
enable = true
expire_ms = 0        # 0 = never expires
max_messages_num = 0 # 0 = unlimited
