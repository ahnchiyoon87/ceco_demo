# EXP-141 RobustMQ v0.4.11 (brokerbench). 이미지 기본 config/server.toml(최소 단일 노드) + 아래 섹션만 추가.
# 섹션 원문은 이미지의 config/server.toml.template 에서 그대로 복사하고 값 셋만 바꿈:
#  - mqtt_runtime.auth.durable_sessions_enable false → true (브로커 재시작을 넘어선 세션, BR-04 · Mosquitto persistence 와 같은 조건)
#  - mqtt_runtime.protocol.default/max_session_expiry_interval 30/1800 → 7200 (V1 EMQX session_expiry 2h. 30초면 BR-03 이 조건 차이로 실패)
# 인증: 기본 켜짐(admin/robustmq, secret_free_login=false) — 제품 기본값 유지, 벤치는 BENCH_MQTT_USER/PASS 로 접속.
