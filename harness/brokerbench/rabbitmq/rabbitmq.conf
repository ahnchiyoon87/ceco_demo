# EXP-137 RabbitMQ 4.3.6 MQTT 플러그인 — V1 EMQX 가 하던 역할(1883, WebSocket, 익명 접속, 세션 보존)만 켠다.
# 익명: 4.x 는 mqtt.allow_anonymous 대신 anonymous_login_user(V1 EMQX 처럼 인증 없이 접속). 운영 시 끌 것(① 기본 보안).
loopback_users = none
anonymous_login_user = guest
anonymous_login_pass = guest
mqtt.listeners.tcp.default = 1883
web_mqtt.tcp.port = 8083
web_mqtt.ws_path = /mqtt
prometheus.tcp.port = 15692
