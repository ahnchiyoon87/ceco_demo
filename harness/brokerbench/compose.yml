# 브로커 비교 벤치 (EXP-130대). 원본 V1·다른 벤치와 네트워크·포트 비공유(호스트 포트 없음).
# 기준선 EMQX 는 V1 설정 파일을 그대로 쓴다. 후보는 각 제품 기본값 + 필요한 최소 설정(영속성·WebSocket)만.
name: brokerbench

services:
  emqx:
    image: emqx/emqx:5.8.6
    hostname: emqx
    volumes:
      - ../../emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro   # V1 과 같은 설정
    healthcheck: {test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"], interval: 5s, timeout: 10s, retries: 30}

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    hostname: mosquitto
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosq-data:/mosquitto/data

  nanomq:
    image: emqx/nanomq:0.25.6
    hostname: nanomq
    volumes:
      - ./nanomq.conf:/etc/nanomq.conf:ro    # 기본 설정 + 큐 10만·SQLite 영속(파일 머리 주석)
      - nanomq-data:/data

  hivemq:
    image: hivemq/hivemq-ce:2026.5
    hostname: hivemq
    volumes:
      - ./hivemq-config.xml:/opt/hivemq/conf/config.xml:ro
      - hivemq-data:/opt/hivemq/data

  # ─────────── 회전 1 후보 추가(CANDIDATES §3 + 개정 #74). 위 4개(측정 완료)와 달리 profiles 로만 뜬다 ───────────
  #   docker compose -f harness/brokerbench/compose.yml --profile <broker> up -d   (직접 부르지 말고 stage2_new.sh)
  # 원칙은 위와 같다: 각 제품 기본값 + V1 EMQX 가 하던 역할(1883·WebSocket·오프라인 세션 보존·지표)에 필요한 최소 설정만.
  rmqtt:
    image: rmqtt/rmqtt:0.24.0
    profiles: [rmqtt]
    hostname: rmqtt
    command: ["-f", "./rmqtt.toml"]
    volumes:
      - ./rmqtt/rmqtt.toml:/app/rmqtt/rmqtt.toml:ro     # 업스트림 0.24.0 원문 + 파일 머리 주석의 5곳
      - rmqtt-data:/var/log/rmqtt                        # sled 세션 저장 경로(/var/log/rmqtt/.cache)

  tbmq:
    image: thingsboard/tbmq:2.4.0
    profiles: [tbmq]
    hostname: tbmq
    depends_on: [tbmq-postgres, tbmq-kafka, tbmq-valkey]
    environment:                                         # 공식 msa/tbmq/configs/docker-compose.yml(2.4.0) 기준
      TB_SERVICE_ID: tbmq
      SPRING_DATASOURCE_URL: jdbc:postgresql://tbmq-postgres:5432/thingsboard_mqtt_broker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TB_KAFKA_SERVERS: tbmq-kafka:9092
      REDIS_HOST: tbmq-valkey
      SECURITY_MQTT_BASIC_ENABLED: "false"               # 공식 기본 true → 익명(V1 EMQX 와 같게). ① 기본 보안 기록
      LISTENER_WS_ENABLED: "true"                        # WS 8084(/mqtt)
      METRICS_ENDPOINTS_EXPOSE: "health,info,prometheus"  # 기본값 명시(HTTP 8083 /actuator/prometheus)
      # V1 보장 맞춤(09-29): DEVICE 영속 세션 보관 상한 기본 1만 → 10만(V1 EMQX max_mqueue_len). TTL 기본 7일 유지(≥ V1 2h)
      MQTT_PERSISTENT_SESSION_DEVICE_PERSISTED_MESSAGES_LIMIT: "100000"
    volumes:
      - tbmq-data:/data
  tbmq-postgres:
    image: postgres:17                                   # 공식 compose 와 같은 태그(V1 ai-work-db 와 같은 이미지, 로컬 보유)
    profiles: [tbmq]
    environment:
      POSTGRES_DB: thingsboard_mqtt_broker
      POSTGRES_PASSWORD: postgres
    volumes:
      - tbmq-pg:/var/lib/postgresql/data
  tbmq-kafka:
    image: apache/kafka:4.3.1                            # 공식 compose 는 4.0.0(① 관문 제외 라인) → 4.3.1 로
    profiles: [tbmq]
    hostname: tbmq-kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@tbmq-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://tbmq-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - tbmq-kafka:/var/lib/kafka/data
  tbmq-valkey:
    image: valkey/valkey:8.0.11-alpine                   # 공식 compose 의 8.0 을 패치까지 고정
    profiles: [tbmq]
    volumes:
      - tbmq-valkey:/data

  bifromq:
    image: apache/bifromq:4.0.0-incubating
    profiles: [bifromq]
    hostname: bifromq                                    # standalone.yml 무변경. WS 는 기본 80(/mqtt) [미확인]
    environment:
      # V1 보장 맞춤(09-29): 테넌트 설정 기본값은 JVM 시스템 속성으로 덮어쓴다(Setting.java: System.getProperty(name())).
      #  SessionInboxSize 1000 → 65535(제품 상한, V1 10만 미달 — 약점), MsgPubPerSec 200 → 1000(제품 상한 — 과부하 1200/s 는 연결당 상한 초과),
      #  ReceivingMaximum 200 → 65535, MaxSessionExpirySeconds → 7200 이상 보장
      EXTRA_JVM_OPTS: "-DSessionInboxSize=65535 -DMsgPubPerSec=1000 -DReceivingMaximum=65535 -DMaxSessionExpirySeconds=86400"
    volumes:
      - bifromq-data:/home/bifromq/data

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    profiles: [rabbitmq]
    hostname: rabbitmq
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq

  lavinmq:
    image: cloudamqp/lavinmq:2.10.0
    profiles: [lavinmq]
    hostname: lavinmq                                    # 설정 무변경. MQTT 1883 기본, 인증 guest/guest(제품 기본)
    volumes:
      - lavinmq-data:/var/lib/lavinmq

  artemis:
    image: apache/artemis:2.57.0
    profiles: [artemis]
    hostname: artemis
    environment:                                         # 이미지 README 의 환경변수만(브로커 인스턴스는 첫 기동 때 생성)
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "true"                            # V1 EMQX 처럼 익명 접속. ① 기본 보안 기록
    volumes:
      - artemis-data:/var/lib/artemis-instance

  activemq:
    image: apache/activemq:6.3.2
    profiles: [activemq]
    hostname: activemq
    volumes:
      - ./activemq/activemq.xml:/opt/apache-activemq/conf/activemq.xml:ro   # 기본 파일 + mqtt·ws 커넥터 주석 해제만
      - activemq-data:/opt/apache-activemq/data

  comqtt:
    image: ghcr.io/wind-c/comqtt:2.6.5
    profiles: [comqtt]
    hostname: comqtt
    command: ["-conf=/etc/comqtt/single.yml"]
    volumes:
      - ./comqtt/single.yml:/etc/comqtt/single.yml:ro
      - comqtt-data:/data

  robustmq:
    image: ghcr.io/robustmq/robustmq:v0.4.11
    profiles: [robustmq]
    hostname: robustmq
    volumes:
      - ./robustmq/server.toml:/robustmq/config/server.toml:ro
      - robustmq-data:/robustmq/data

  mochi:
    image: mochimqtt/server:2.7.9
    profiles: [mochi]
    hostname: mochi
    command: ["--config", "/config.yaml"]
    volumes:
      - ./mochi/config.yaml:/config.yaml:ro
      - mochi-data:/data

  nats:
    image: nats:2.15.0-alpine
    profiles: [nats]
    hostname: nats
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data

  hivemq-edge:
    image: hivemq/hivemq-edge:2026.14
    profiles: [hivemq-edge]
    hostname: hivemq-edge
    volumes:
      - ./hivemq-edge/config.xml:/opt/hivemq/conf/config.xml:ro

  client:
    build: .
    profiles: [tools]
    volumes:
      - ../..:/repo:ro
      - ../../experiments:/experiments

volumes:
  mosq-data:
  nanomq-data:
  hivemq-data:
  rmqtt-data:
  tbmq-data:
  tbmq-pg:
  tbmq-kafka:
  tbmq-valkey:
  bifromq-data:
  rabbitmq-data:
  lavinmq-data:
  artemis-data:
  activemq-data:
  comqtt-data:
  robustmq-data:
  mochi-data:
  nats-data:
