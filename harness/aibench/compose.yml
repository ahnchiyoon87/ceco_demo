# AI 온톨로지 벤치 (EXP-AI). 원본 V1·다른 벤치와 네트워크·볼륨·포트 비공유.
#   docker compose -f harness/aibench/compose.yml up -d --wait
#   docker compose -f harness/aibench/compose.yml exec ollama ollama pull bge-m3
#   docker compose -f harness/aibench/compose.yml run --rm engine python -m engine.load
name: aibench

services:
  neo4j:
    image: neo4j:5.26-community          # V1 과 같은 그래프 DB (그래프 DB 필수)
    environment:
      NEO4J_AUTH: neo4j/aibench-pass
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p aibench-pass 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 40

  ollama:
    image: ollama/ollama:0.34.4          # 로컬 임베딩(MIT). 모델 bge-m3(MIT)
    volumes:
      - ollama-models:/root/.ollama

  sim:
    image: iiot/plant-simulator:1.0      # V1 과 같은 가상설비 이미지
    hostname: sim
    environment:
      SCAN_INTERVAL_MS: "1000"

  engine:
    build: ../../candidates/ai-ontology
    profiles: [tools]
    working_dir: /app
    environment:
      REPO: /repo
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: aibench-pass
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: bge-m3
      SIM_URL: http://sim:8080
      SIM_MODBUS: sim:502
    volumes:
      - ../..:/repo:ro
      - ../../candidates/ai-ontology:/app:ro
      - ../../experiments:/experiments

volumes:
  ollama-models:
