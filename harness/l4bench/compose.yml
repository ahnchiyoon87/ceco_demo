# L4 비교 벤치. 원본 V1·실험 스택과 네트워크·볼륨·포트를 공유하지 않는다(호스트 포트 없음).
#   python harness/l4bench/prepare.py
#   docker compose -f harness/l4bench/compose.yml up -d --build
#   docker compose -f harness/l4bench/compose.yml run --rm submit-flinksql
name: l4bench

x-flink: &flink
  image: iiot/flink-onnx:1.0          # V1 과 같은 이미지
  environment:
    FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
  volumes:
    - ./generated/config.yaml:/opt/flink/conf/config.yaml:ro
    - ./generated/sql:/opt/flink/sql:ro
    - ./models:/opt/models:ro          # V1 model-store 볼륨의 model.onnx·model_meta.json 사본(sha256 은 decision-log)

services:
  kafka:
    image: apache/kafka:3.9.0         # V1 과 같은 버전·KRaft 단일 노드 설정
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"   # 384m 에서 GC 과부하(유휴 CPU 205%, EXP-L4 m3 무효) → 상향. 모든 후보 공통
      CLUSTER_ID: l4bench-kraft-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on: {kafka: {condition: service_healthy}}
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    # V1 과 같은 파티션 수: raw 6, alerts 3
    command:
      - |
        for spec in exp.l4.raw:6 exp.l4.clean:6 exp.l4.clean.flinksql:6 exp.l4.clean.flink22:6 exp.l4.clean.cep:6 exp.l4.clean.python:6 exp.l4.score.flinksql:3 exp.l4.score.flink22:3 exp.l4.score.cep:3 exp.l4.score.python:3 exp.l4.alerts.flinksql:3 exp.l4.alerts.flink22:3 exp.l4.alerts.python:3 exp.l4.alerts.cep:3 exp.l4.dropped.python:1 exp.l4.dropped.cep:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${spec%%:*}" --partitions "$${spec##*:}" --replication-factor 1             --config message.timestamp.type=LogAppendTime   # 지연 측정 기준을 브로커 수신 시각으로 통일(Flink DataStream 싱크는 이벤트 시각을 찍음)
        done

  flink-jobmanager:
    <<: *flink
    hostname: flink-jobmanager
    command: jobmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flink-taskmanager:
    <<: *flink
    hostname: flink-taskmanager
    command: taskmanager
    depends_on: {flink-jobmanager: {condition: service_healthy}}

  # EXP-112 후보: 같은 V1 SQL 을 Flink 2.2.1 에서 (profile flink22)
  flink22-jobmanager:
    image: l4bench-flink22:2.2.1          # candidates/l4-flink22/Dockerfile
    profiles: [flink22]
    hostname: flink22-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink22-jobmanager"
    volumes:
      - ./generated22/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated22/sql:/opt/flink/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flink22-taskmanager:
    image: l4bench-flink22:2.2.1
    profiles: [flink22]
    hostname: flink22-taskmanager
    command: taskmanager
    depends_on: {flink22-jobmanager: {condition: service_healthy}}
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink22-jobmanager"
    volumes:
      - ./generated22/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated22/sql:/opt/flink/sql:ro
      - ./models:/opt/models:ro

  submit-flink22:
    image: l4bench-flink22:2.2.1
    profiles: [flink22]
    depends_on:
      flink22-jobmanager: {condition: service_healthy}
    volumes:
      - ./generated22/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated22/sql:/opt/flink/sql:ro
      - ./generated22/job.properties:/opt/flink/job/job.properties:ro
      - ../../candidates/l4-flink22-onnx/target/anomaly-job-1.0.jar:/opt/flink/usrlib/anomaly-job.jar:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat /opt/flink/sql/01_sources.sql /opt/flink/sql/02_tier1_rules.sql /opt/flink/sql/03_tier1_zscore.sql /opt/flink/sql/04_tier1_cep.sql > /tmp/p.sql
        /opt/flink/bin/sql-client.sh -f /tmp/p.sql 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E "Job ID|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c org.uengine.iiot.AnomalyJob /opt/flink/usrlib/anomaly-job.jar /opt/flink/job/job.properties 2>&1 | grep -E "JobID|ERROR|Exception" | head -20

  # EXP-111 후보: Flink 2.2.1 전용 클러스터 = V1 SQL 임계치·Z-Score + DataStream CEP 잡 (profile flinkcep)
  flinkcep-jobmanager:
    image: l4bench-flink22:2.2.1
    profiles: [flinkcep]
    hostname: flinkcep-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkcep-jobmanager"
    volumes:
      - ./generatedcep/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedcep/sql:/opt/flink/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flinkcep-taskmanager:
    image: l4bench-flink22:2.2.1
    profiles: [flinkcep]
    hostname: flinkcep-taskmanager
    command: taskmanager
    depends_on: {flinkcep-jobmanager: {condition: service_healthy}}
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkcep-jobmanager"
    volumes:
      - ./generatedcep/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedcep/sql:/opt/flink/sql:ro
      - ./models:/opt/models:ro

  submit-flinkcep:
    image: l4bench-flink22:2.2.1
    profiles: [flinkcep]
    depends_on:
      flinkcep-jobmanager: {condition: service_healthy}
    volumes:
      - ./generatedcep/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedcep/sql:/opt/flink/sql:ro
      - ../../candidates/l4-flink-cep/target/cep-job-1.0.jar:/opt/flink/usrlib/cep-job.jar:ro
      - ./generatedcep/job.properties:/opt/flink/job/job.properties:ro
      - ../../candidates/l4-flink22-onnx/target/anomaly-job-1.0.jar:/opt/flink/usrlib/anomaly-job.jar:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat /opt/flink/sql/01_sources.sql /opt/flink/sql/02_tier1_rules.sql /opt/flink/sql/03_tier1_zscore.sql > /tmp/p.sql
        /opt/flink/bin/sql-client.sh -f /tmp/p.sql 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E "Job ID|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c exp.CepJob /opt/flink/usrlib/cep-job.jar 2>&1 | grep -E "JobID|Job has been submitted|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c org.uengine.iiot.AnomalyJob /opt/flink/usrlib/anomaly-job.jar /opt/flink/job/job.properties 2>&1 | grep -E "JobID|ERROR|Exception" | head -20

  # EXP-113 후보: Python 스트림 서비스 (profile python)
  l4-python:
    build: ../../candidates/l4-python
    profiles: [python]
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    environment:
      BOOTSTRAP: kafka:9092
      TAG_LIMITS: /app/tag_limits.csv
    volumes:
      - ../../flink/sql/tag_limits.csv:/app/tag_limits.csv:ro   # V1 과 같은 규격 파일
      - l4py-state:/state                                       # EXP-113b 재시작 스냅샷
      - ./models:/opt/models:ro                                 # V1 ONNX 모델 사본

  # V1 submit-jobs.sh 와 같은 방식: 01~04 SQL 을 합쳐 sql-client 로 제출 + V1 이미지 안의 ONNX 잡(anomaly-job.jar) 제출
  submit-flinksql:
    image: iiot/flink-onnx:1.0
    profiles: [tools]
    depends_on:
      flink-jobmanager: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    volumes:
      - ./generated/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated/sql:/opt/flink/sql:ro
      - ./generated/job.properties:/opt/flink/job/job.properties:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat /opt/flink/sql/01_sources.sql /opt/flink/sql/02_tier1_rules.sql /opt/flink/sql/03_tier1_zscore.sql /opt/flink/sql/04_tier1_cep.sql > /tmp/p.sql
        /opt/flink/bin/sql-client.sh -f /tmp/p.sql 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E "Job ID|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c org.uengine.iiot.AnomalyJob /opt/flink/job/anomaly-job.jar /opt/flink/job/job.properties 2>&1 | grep -E "JobID|ERROR|Exception" | head -20

  tools:
    build: ../tools
    profiles: [tools]
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    volumes:
      - ../..:/repo:ro
      - ../../experiments:/experiments
    environment:
      BOOTSTRAP: kafka:9092
      FLINK_REST: http://flink-jobmanager:8081

volumes:
  l4py-state:
