# L4 비교 벤치. 원본 V1·실험 스택과 네트워크·볼륨·포트를 공유하지 않는다(호스트 포트 없음).
#   python harness/l4bench/prepare.py
#   docker compose -f harness/l4bench/compose.yml up -d --build
#   docker compose -f harness/l4bench/compose.yml run --rm submit-flinksql
name: l4bench

x-flink: &flink
  image: iiot/flink-onnx:1.0          # V1 과 같은 이미지
  environment:
    FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
  volumes:
    - ./generated/config.yaml:/opt/flink/conf/config.yaml:ro
    - ./generated/sql:/opt/flink/sql:ro
    - ./models:/opt/models:ro          # V1 model-store 볼륨의 model.onnx·model_meta.json 사본(sha256 은 decision-log)

services:
  kafka:
    image: apache/kafka:3.9.0         # V1 과 같은 버전·KRaft 단일 노드 설정
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"   # 384m 에서 GC 과부하(유휴 CPU 205%, EXP-L4 m3 무효) → 상향. 모든 후보 공통
      CLUSTER_ID: l4bench-kraft-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on: {kafka: {condition: service_healthy}}
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    # V1 과 같은 파티션 수: raw 6, alerts 3
    command:
      - |
        for spec in exp.l4.raw:6 exp.l4.clean:6 exp.l4.clean.flinksql:6 exp.l4.clean.flink22:6 exp.l4.clean.cep:6 exp.l4.clean.python:6 exp.l4.score.flinksql:3 exp.l4.score.flink22:3 exp.l4.score.cep:3 exp.l4.score.python:3 exp.l4.alerts.flinksql:3 exp.l4.alerts.flink22:3 exp.l4.alerts.python:3 exp.l4.alerts.cep:3 exp.l4.alerts.flinkha:3 exp.l4.dropped.python:1 exp.l4.dropped.cep:1 exp.l4.clean.flinkha:6 exp.l4.score.flinkha:3 exp.l4.alerts.flink23:3 exp.l4.clean.flink23:6 exp.l4.score.flink23:3 exp.l4.alerts.flinkhac:3 exp.l4.clean.flinkhac:6 exp.l4.score.flinkhac:3 exp.l4.alerts.flinkhad:3 exp.l4.clean.flinkhad:6 exp.l4.score.flinkhad:3 exp.l4.alerts.ekuiper:3 exp.l4.score.ekuiper:3 exp.l4.alerts.quix:3 exp.l4.score.quix:3 exp.l4.alerts.risingwave:3 exp.l4.alerts.proton:3 exp.l4.alerts.feldera:3 exp.l4.alerts.arroyo:3 exp.l4.alerts.flinkhab:3 exp.l4.clean.flinkhab:6 exp.l4.score.flinkhab:3 exp.l4.alerts.kstreams:3 exp.l4.alerts.storm:3 exp.l4.alerts.beam:3 exp.l4.alerts.streampipes:3 exp.l4.clean.quix:6; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$${spec%%:*}" --partitions "$${spec##*:}" --replication-factor 1             --config message.timestamp.type=LogAppendTime   # 지연 측정 기준을 브로커 수신 시각으로 통일(Flink DataStream 싱크는 이벤트 시각을 찍음)
        done

  flink-jobmanager:
    <<: *flink
    hostname: flink-jobmanager
    command: jobmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flink-taskmanager:
    <<: *flink
    hostname: flink-taskmanager
    command: taskmanager
    depends_on: {flink-jobmanager: {condition: service_healthy}}

  # EXP-112 후보: 같은 V1 SQL 을 Flink 2.2.1 에서 (profile flink22)
  flink22-jobmanager:
    image: l4bench-flink22:2.2.1          # candidates/l4-flink22/Dockerfile
    profiles: [flink22]
    hostname: flink22-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink22-jobmanager"
    volumes:
      - ./generated22/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated22/sql:/opt/flink/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flink22-taskmanager:
    image: l4bench-flink22:2.2.1
    profiles: [flink22]
    hostname: flink22-taskmanager
    command: taskmanager
    depends_on: {flink22-jobmanager: {condition: service_healthy}}
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink22-jobmanager"
    volumes:
      - ./generated22/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated22/sql:/opt/flink/sql:ro
      - ./models:/opt/models:ro

  submit-flink22:
    image: l4bench-flink22:2.2.1
    profiles: [flink22]
    depends_on:
      flink22-jobmanager: {condition: service_healthy}
    volumes:
      - ./generated22/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated22/sql:/opt/flink/sql:ro
      - ./generated22/job.properties:/opt/flink/job/job.properties:ro
      - ../../candidates/l4-flink22-onnx/target/anomaly-job-1.0.jar:/opt/flink/usrlib/anomaly-job.jar:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat /opt/flink/sql/01_sources.sql /opt/flink/sql/02_tier1_rules.sql /opt/flink/sql/03_tier1_zscore.sql /opt/flink/sql/04_tier1_cep.sql > /tmp/p.sql
        /opt/flink/bin/sql-client.sh -f /tmp/p.sql 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E "Job ID|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c org.uengine.iiot.AnomalyJob /opt/flink/usrlib/anomaly-job.jar /opt/flink/job/job.properties 2>&1 | grep -E "JobID|ERROR|Exception" | head -20

  # EXP-111 후보: Flink 2.2.1 전용 클러스터 = V1 SQL 임계치·Z-Score + DataStream CEP 잡 (profile flinkcep)
  flinkcep-jobmanager:
    image: l4bench-flink22:2.2.1
    profiles: [flinkcep]
    hostname: flinkcep-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkcep-jobmanager"
    volumes:
      - ./generatedcep/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedcep/sql:/opt/flink/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flinkcep-taskmanager:
    image: l4bench-flink22:2.2.1
    profiles: [flinkcep]
    hostname: flinkcep-taskmanager
    command: taskmanager
    depends_on: {flinkcep-jobmanager: {condition: service_healthy}}
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkcep-jobmanager"
    volumes:
      - ./generatedcep/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedcep/sql:/opt/flink/sql:ro
      - ./models:/opt/models:ro

  submit-flinkcep:
    image: l4bench-flink22:2.2.1
    profiles: [flinkcep]
    environment:
      PATTERN_WINDOW_S: ${PATTERN_WINDOW_S:-10}   # L4-10: DS CEP 규칙 값은 제출 시 환경변수
    depends_on:
      flinkcep-jobmanager: {condition: service_healthy}
    volumes:
      - ./generatedcep/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedcep/sql:/opt/flink/sql:ro
      - ../../candidates/l4-flink-cep/target/cep-job-1.0.jar:/opt/flink/usrlib/cep-job.jar:ro
      - ./generatedcep/job.properties:/opt/flink/job/job.properties:ro
      - ../../candidates/l4-flink22-onnx/target/anomaly-job-1.0.jar:/opt/flink/usrlib/anomaly-job.jar:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat /opt/flink/sql/01_sources.sql /opt/flink/sql/02_tier1_rules.sql /opt/flink/sql/03_tier1_zscore.sql > /tmp/p.sql
        /opt/flink/bin/sql-client.sh -f /tmp/p.sql 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E "Job ID|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c exp.CepJob /opt/flink/usrlib/cep-job.jar 2>&1 | grep -E "JobID|Job has been submitted|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c org.uengine.iiot.AnomalyJob /opt/flink/usrlib/anomaly-job.jar /opt/flink/job/job.properties 2>&1 | grep -E "JobID|ERROR|Exception" | head -20

  # 자동 복구 후보: Flink 2.2.1 + HA(ZooKeeper) + 공유 체크포인트 (profile flinkha)
  zookeeper:
    image: zookeeper:3.9.5               # CANDIDATES §1 HA-A: 공식 최신 태그(3.9.3 → 3.9.5)
    profiles: [flinkha, flinkhab, storm]
    hostname: zookeeper

  flinkha-jobmanager:
    image: ${FLINKHA_IMAGE:-l4bench-flink22:2.2.1}
    profiles: [flinkha]
    hostname: flinkha-jobmanager
    command: jobmanager
    depends_on: [zookeeper]
    restart: unless-stopped              # HA-A: JM 프로세스가 죽으면 도커가 다시 띄우고, ZK·HA 저장소에서 잡을 되살린다
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkha-jobmanager"
    volumes:
      - ./generatedha/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedha/sql:/opt/flink/sql:ro
      - ./models:/opt/models:ro
      - flinkha-ckpt:/opt/flink/checkpoints   # HA 저장소(checkpoints/ha)와 체크포인트를 JM·TM 이 공유
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flinkha-taskmanager:
    image: ${FLINKHA_IMAGE:-l4bench-flink22:2.2.1}
    profiles: [flinkha]
    hostname: flinkha-taskmanager
    command: taskmanager
    depends_on: {flinkha-jobmanager: {condition: service_healthy}}
    restart: unless-stopped
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkha-jobmanager"
    volumes:
      - ./generatedha/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedha/sql:/opt/flink/sql:ro
      - ./models:/opt/models:ro
      - flinkha-ckpt:/opt/flink/checkpoints

  submit-flinkha:
    image: ${FLINKHA_IMAGE:-l4bench-flink22:2.2.1}
    profiles: [flinkha]
    depends_on:
      flinkha-jobmanager: {condition: service_healthy}
    volumes:
      - ./generatedha/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedha/sql:/opt/flink/sql:ro
      - ./generatedha/job.properties:/opt/flink/job/job.properties:ro
      - ../../candidates/l4-flink22-onnx/target/anomaly-job-1.0.jar:/opt/flink/extlib/anomaly-job.jar:ro
    entrypoint: ["/bin/bash", "-c"]
    # V1 과 같은 잡 4개: SQL 3 + ONNX 1. FLINKHA_IMAGE=l4bench-flink23:2.3.0 이면 그 이미지에 구운 2.3 ONNX 잡을 쓴다
    command:
      - |
        cat /opt/flink/sql/01_sources.sql /opt/flink/sql/02_tier1_rules.sql /opt/flink/sql/03_tier1_zscore.sql /opt/flink/sql/04_tier1_cep.sql > /tmp/p.sql
        /opt/flink/bin/sql-client.sh -f /tmp/p.sql 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E "Job ID|ERROR|Exception" | head -20
        J=/opt/flink/usrlib/anomaly-job.jar; [ -f $$J ] || J=/opt/flink/extlib/anomaly-job.jar
        /opt/flink/bin/flink run -d -c org.uengine.iiot.AnomalyJob $$J /opt/flink/job/job.properties 2>&1 | grep -E "JobID|ERROR|Exception" | head -20

  # ── stage2 P1: Flink 2.3.0 (같은 제품 최신). V1 SQL 무수정 + ONNX 잡 2.3 재컴파일 (profile flink23) ──
  flink23-jobmanager:
    image: l4bench-flink23:2.3.0
    build: {context: ../../candidates, dockerfile: l4-flink23/Dockerfile}
    profiles: [flink23]
    hostname: flink23-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink23-jobmanager"
    volumes:
      - ./generated23/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated23/sql:/opt/flink/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flink23-taskmanager:
    image: l4bench-flink23:2.3.0
    profiles: [flink23]
    hostname: flink23-taskmanager
    command: taskmanager
    depends_on: {flink23-jobmanager: {condition: service_healthy}}
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink23-jobmanager"
    volumes:
      - ./generated23/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated23/sql:/opt/flink/sql:ro
      - ./models:/opt/models:ro

  submit-flink23:
    image: l4bench-flink23:2.3.0
    profiles: [flink23]
    depends_on:
      flink23-jobmanager: {condition: service_healthy}
    volumes:
      - ./generated23/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated23/sql:/opt/flink/sql:ro
      - ./generated23/job.properties:/opt/flink/job/job.properties:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat /opt/flink/sql/01_sources.sql /opt/flink/sql/02_tier1_rules.sql /opt/flink/sql/03_tier1_zscore.sql /opt/flink/sql/04_tier1_cep.sql > /tmp/p.sql
        /opt/flink/bin/sql-client.sh -f /tmp/p.sql 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E "Job ID|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c org.uengine.iiot.AnomalyJob /opt/flink/usrlib/anomaly-job.jar /opt/flink/job/job.properties 2>&1 | grep -E "JobID|ERROR|Exception" | head -20

  # ── stage2 P2: HA-C = HA 없음 + 보존 체크포인트 + 재제출 스크립트(recover_hac.sh) (profile flinkhac) ──
  flinkhac-jobmanager:
    image: ${FLINKHA_IMAGE:-l4bench-flink22:2.2.1}
    profiles: [flinkhac]
    hostname: flinkhac-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkhac-jobmanager"
    volumes:
      - ./generatedhac/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedhac/sql:/opt/flink/sql:ro
      - flinkhac-ckpt:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flinkhac-taskmanager:
    image: ${FLINKHA_IMAGE:-l4bench-flink22:2.2.1}
    profiles: [flinkhac]
    hostname: flinkhac-taskmanager
    command: taskmanager
    depends_on: {flinkhac-jobmanager: {condition: service_healthy}}
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkhac-jobmanager"
    volumes:
      - ./generatedhac/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedhac/sql:/opt/flink/sql:ro
      - ./models:/opt/models:ro
      - flinkhac-ckpt:/opt/flink/checkpoints

  submit-flinkhac:            # 기본 = 처음 제출. 복구: docker compose ... --profile flinkhac run --rm submit-flinkhac recover
    image: ${FLINKHA_IMAGE:-l4bench-flink22:2.2.1}
    profiles: [flinkhac]
    depends_on:
      flinkhac-jobmanager: {condition: service_healthy}
    volumes:
      - ./generatedhac/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedhac/sql:/opt/flink/sql:ro
      - ./generatedhac/job.properties:/opt/flink/job/job.properties:ro
      - ../../candidates/l4-flink22-onnx/target/anomaly-job-1.0.jar:/opt/flink/extlib/anomaly-job.jar:ro
      - ./recover_hac.sh:/opt/flink/recover_hac.sh:ro
      - flinkhac-ckpt:/opt/flink/checkpoints
    entrypoint: ["/bin/bash", "/opt/flink/recover_hac.sh"]
    command: ["submit"]

  # ── stage2 P2: HA-D = HA 없음 + SQL 소스 group-offsets 재개 (profile flinkhad). 재시작 뒤 submit-flinkhad 재실행 ──
  flinkhad-jobmanager:
    image: ${FLINKHA_IMAGE:-l4bench-flink22:2.2.1}
    profiles: [flinkhad]
    hostname: flinkhad-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkhad-jobmanager"
    volumes:
      - ./generatedhad/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedhad/sql:/opt/flink/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flinkhad-taskmanager:
    image: ${FLINKHA_IMAGE:-l4bench-flink22:2.2.1}
    profiles: [flinkhad]
    hostname: flinkhad-taskmanager
    command: taskmanager
    depends_on: {flinkhad-jobmanager: {condition: service_healthy}}
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkhad-jobmanager"
    volumes:
      - ./generatedhad/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedhad/sql:/opt/flink/sql:ro
      - ./models:/opt/models:ro

  submit-flinkhad:
    image: ${FLINKHA_IMAGE:-l4bench-flink22:2.2.1}
    profiles: [flinkhad]
    depends_on:
      flinkhad-jobmanager: {condition: service_healthy}
    volumes:
      - ./generatedhad/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedhad/sql:/opt/flink/sql:ro
      - ./generatedhad/job.properties:/opt/flink/job/job.properties:ro
      - ../../candidates/l4-flink22-onnx/target/anomaly-job-1.0.jar:/opt/flink/extlib/anomaly-job.jar:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat /opt/flink/sql/01_sources.sql /opt/flink/sql/02_tier1_rules.sql /opt/flink/sql/03_tier1_zscore.sql /opt/flink/sql/04_tier1_cep.sql > /tmp/p.sql
        /opt/flink/bin/sql-client.sh -f /tmp/p.sql 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E "Job ID|ERROR|Exception" | head -20
        J=/opt/flink/usrlib/anomaly-job.jar; [ -f $$J ] || J=/opt/flink/extlib/anomaly-job.jar
        /opt/flink/bin/flink run -d -c org.uengine.iiot.AnomalyJob $$J /opt/flink/job/job.properties 2>&1 | grep -E "JobID|ERROR|Exception" | head -20

  # ══ stage2 후보 공통: 배포·앱 컨테이너는 /experiments 에 시도 기록(stage2_<RUN>_attempts.jsonl)을 남긴다. RUN 은 stage2.sh 가 넘긴다 ══

  # ── stage2 P1: LF Edge eKuiper 2.4.2 (-full: Kafka 소스·싱크 포함 빌드) (profile ekuiper) ──
  ekuiper:
    image: lfedge/ekuiper:2.4.2-full
    profiles: [ekuiper]
    hostname: ekuiper
    environment:
      KUIPER__BASIC__CONSOLELOG: "true"
    volumes:
      - ../../candidates/l4-ekuiper/kafka.yaml:/kuiper/etc/sources/kafka.yaml:ro
      - ekuiper-data:/kuiper/data          # 규칙·체크포인트 영속(재시작 시험 R04/R05 대비)

  deploy-ekuiper:                        # 규칙 등록(REST 9081). tools 이미지 재사용
    build: ../tools
    image: l4bench-tools:1.0
    profiles: [ekuiper]
    depends_on: [ekuiper]
    volumes: ["../..:/repo:ro", "../../experiments:/experiments"]
    environment:
      PATTERN_WINDOW_S: ${PATTERN_WINDOW_S:-10}
      RUN: ${RUN:-manual}
    command: ["python", "/repo/candidates/l4-ekuiper/deploy.py"]

  # ── stage2 P1: Quix Streams 3.26.0 (profile quix). 규칙은 앱 코드(엔진 API) 안에 있어 별도 배포 없음 ──
  quix:
    build: ../../candidates/l4-quix
    image: l4bench-quix:3.26.0
    profiles: [quix]
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    environment:
      BOOTSTRAP: kafka:9092
      TAG_LIMITS: /app/tag_limits.csv
      RUN: ${RUN:-manual}
    volumes:
      - ../../flink/sql/tag_limits.csv:/app/tag_limits.csv:ro
      - ./models:/opt/models:ro            # V1 ONNX 모델 사본(L4-12 시도)
      - ../../experiments:/experiments
      - quix-state:/state

  # ── stage2 P2: RisingWave v3.1.0 single_node (profile risingwave) ──
  # 문헌 최소 8 GiB(compute 6 GiB) — 우리 Docker 7.6 GB 에는 못 맞춘다. 사람 결정(09-29): 그대로 ②에서 돌리고 기동·처리 실패는 ② 실패로 기록.
  # 메모리 설정은 single_node 의 --total-memory-bytes(소스 src/cmd_all/src/single_node.rs v3.1.0)로 3 GiB, 병렬도 2(V1 과 같음).
  risingwave:
    image: risingwavelabs/risingwave:v3.1.0
    profiles: [risingwave]
    hostname: risingwave
    command: ["single_node", "--total-memory-bytes", "${RW_TOTAL_MEMORY_BYTES:-3221225472}", "--parallelism", "2"]
    volumes:
      - risingwave-data:/root/.risingwave

  deploy-risingwave:
    image: public.ecr.aws/docker/library/postgres:17.6-alpine   # psql 만 쓴다(Docker Hub 요청 한도 회피용 공식 이미지 미러)
    profiles: [risingwave]
    depends_on: [risingwave]
    environment:
      RUN: ${RUN:-manual}
    volumes: ["../..:/repo:ro", "../../experiments:/experiments"]
    entrypoint: ["/bin/sh", "/repo/candidates/l4-risingwave/deploy.sh"]

  # ── stage2 P2: Timeplus Proton 3.0.31 (profile proton) ──
  proton:
    image: d.timeplus.com/timeplus-io/proton:3.0.31   # Docker Hub timeplus/proton:3.0.31 과 같은 릴리스(공식 배포처)
    profiles: [proton]
    hostname: proton
    volumes:
      - proton-data:/var/lib/proton

  deploy-proton:
    build: ../tools
    image: l4bench-tools:1.0
    profiles: [proton]
    depends_on: [proton]
    environment:
      RUN: ${RUN:-manual}
    volumes: ["../..:/repo:ro", "../../experiments:/experiments"]
    command: ["python", "/repo/candidates/l4-proton/deploy.py"]

  # ── stage2 P3: Arroyo 0.15.0 (profile arroyo) ──
  arroyo:
    image: ghcr.io/arroyosystems/arroyo:0.15.0
    profiles: [arroyo]
    hostname: arroyo
    command: ["cluster"]
    volumes:
      - arroyo-data:/tmp/arroyo            # 기본 checkpoint-url /tmp/arroyo/checkpoints

  deploy-arroyo:
    build: ../tools
    image: l4bench-tools:1.0
    profiles: [arroyo]
    depends_on: [arroyo]
    environment:
      RUN: ${RUN:-manual}
    volumes: ["../..:/repo:ro", "../../experiments:/experiments"]
    command: ["python", "/repo/candidates/l4-arroyo/deploy.py"]

  # ── stage2 P2: Flink 2.3 DataStream CEP = 01~03 SQL + candidates/l4-flink-cep 를 2.3.0 으로 빌드한 잡 + ONNX (profile flinkcep23) ──
  flinkcep23-jobmanager:
    image: l4bench-flink23:2.3.0
    build: {context: ../../candidates, dockerfile: l4-flink23/Dockerfile}
    profiles: [flinkcep23]
    hostname: flinkcep23-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkcep23-jobmanager"
    volumes:
      - ./generatedcep23/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedcep23/sql:/opt/flink/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flinkcep23-taskmanager:
    image: l4bench-flink23:2.3.0
    profiles: [flinkcep23]
    hostname: flinkcep23-taskmanager
    command: taskmanager
    depends_on: {flinkcep23-jobmanager: {condition: service_healthy}}
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkcep23-jobmanager"
    volumes:
      - ./generatedcep23/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedcep23/sql:/opt/flink/sql:ro
      - ./models:/opt/models:ro

  submit-flinkcep23:
    image: l4bench-flink23:2.3.0
    profiles: [flinkcep23]
    environment:
      PATTERN_WINDOW_S: ${PATTERN_WINDOW_S:-10}
    depends_on:
      flinkcep23-jobmanager: {condition: service_healthy}
    volumes:
      - ./generatedcep23/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedcep23/sql:/opt/flink/sql:ro
      - ./generatedcep23/job.properties:/opt/flink/job/job.properties:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat /opt/flink/sql/01_sources.sql /opt/flink/sql/02_tier1_rules.sql /opt/flink/sql/03_tier1_zscore.sql > /tmp/p.sql
        /opt/flink/bin/sql-client.sh -f /tmp/p.sql 2>&1 | grep -a -E "Job ID|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c exp.CepJob /opt/flink/usrlib/cep-job.jar 2>&1 | grep -E "JobID|Job has been submitted|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c org.uengine.iiot.AnomalyJob /opt/flink/usrlib/anomaly-job.jar /opt/flink/job/job.properties 2>&1 | grep -E "JobID|ERROR|Exception" | head -20

  # ── stage2 P2: Flink HA-B = ZooKeeper HA + 애플리케이션 모드 (profile flinkhab) ──
  # 클러스터 2개: sql(V1 SQL 01~04 를 StatementSet 잡 1개로, candidates/l4-flink-sqlrunner) · onnx(V1 ONNX 잡). HA 애플리케이션 모드 = 클러스터당 잡 1개.
  # 2.3 판: FLINKHAB_BASE=l4bench-flink23:2.3.0 FLINKHAB_FLINK=2.3.0 (flink23 이미지 빌드 후)
  flinkhab-sql-jobmanager:
    image: l4bench-flinkhab-sql:${FLINKHAB_FLINK:-2.2.1}
    build:
      context: ../../candidates
      dockerfile: l4-flinkhab/Dockerfile
      target: sql
      args: {BASE: "${FLINKHAB_BASE:-l4bench-flink22:2.2.1}", FLINK_VERSION: "${FLINKHAB_FLINK:-2.2.1}"}
    profiles: [flinkhab]
    hostname: flinkhab-sql-jobmanager
    command: ["standalone-job", "--job-classname", "exp.SqlRunner", "/opt/flink/sql/app.sql"]
    depends_on: [zookeeper]
    restart: unless-stopped
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkhab-sql-jobmanager"
    volumes:
      - ./generatedhab/config-sql.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedhab/sql:/opt/flink/sql:ro
      - flinkhab-ckpt:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  flinkhab-sql-taskmanager:
    image: l4bench-flinkhab-sql:${FLINKHAB_FLINK:-2.2.1}
    profiles: [flinkhab]
    hostname: flinkhab-sql-taskmanager
    command: taskmanager
    depends_on: [flinkhab-sql-jobmanager]
    restart: unless-stopped
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkhab-sql-jobmanager"
    volumes:
      - ./generatedhab/config-sql.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedhab/sql:/opt/flink/sql:ro
      - flinkhab-ckpt:/opt/flink/checkpoints

  flinkhab-onnx-jobmanager:
    image: l4bench-flinkhab-onnx:${FLINKHAB_FLINK:-2.2.1}
    build:
      context: ../../candidates
      dockerfile: l4-flinkhab/Dockerfile
      target: onnx
      args: {BASE: "${FLINKHAB_BASE:-l4bench-flink22:2.2.1}", FLINK_VERSION: "${FLINKHAB_FLINK:-2.2.1}"}
    profiles: [flinkhab]
    hostname: flinkhab-onnx-jobmanager
    command: ["standalone-job", "--job-classname", "org.uengine.iiot.AnomalyJob", "/opt/flink/job/job.properties"]
    depends_on: [zookeeper]
    restart: unless-stopped
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkhab-onnx-jobmanager"
    volumes:
      - ./generatedhab/config-onnx.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedhab/job.properties:/opt/flink/job/job.properties:ro
      - flinkhab-ckpt:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  flinkhab-onnx-taskmanager:
    image: l4bench-flinkhab-onnx:${FLINKHAB_FLINK:-2.2.1}
    profiles: [flinkhab]
    hostname: flinkhab-onnx-taskmanager
    command: taskmanager
    depends_on: [flinkhab-onnx-jobmanager]
    restart: unless-stopped
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flinkhab-onnx-jobmanager"
    volumes:
      - ./generatedhab/config-onnx.yaml:/opt/flink/conf/config.yaml:ro
      - ./generatedhab/job.properties:/opt/flink/job/job.properties:ro
      - ./models:/opt/models:ro
      - flinkhab-ckpt:/opt/flink/checkpoints

  # ── stage2 P2: Kafka Streams 4.3.1 (profile kstreams). 규칙은 앱(엔진 DSL) 안에 ──
  kstreams:
    build: ../../candidates/l4-kstreams
    image: l4bench-kstreams:4.3.1
    profiles: [kstreams]
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    environment:
      BOOTSTRAP: kafka:9092
      TAG_LIMITS: /app/tag_limits.csv
      RUN: ${RUN:-manual}
    volumes:
      - ../../flink/sql/tag_limits.csv:/app/tag_limits.csv:ro
      - ../../experiments:/experiments
      - kstreams-state:/state

  # ── stage2 P3: Apache Storm 3.1.0 = ZooKeeper + Nimbus + Supervisor + 토폴로지 제출 (profile storm) ──
  storm-nimbus:
    image: storm:3.1.0
    profiles: [storm]
    hostname: storm-nimbus
    command: ["storm", "nimbus"]
    depends_on: [zookeeper]
    volumes:
      - ../../candidates/l4-storm/storm.yaml:/conf/storm.yaml

  storm-supervisor:
    image: storm:3.1.0
    profiles: [storm]
    hostname: storm-supervisor
    command: ["storm", "supervisor"]
    depends_on: [storm-nimbus]
    volumes:
      - ../../candidates/l4-storm/storm.yaml:/conf/storm.yaml
      - storm-data:/data

  submit-storm:
    build: ../../candidates/l4-storm
    image: l4bench-storm:3.1.0
    profiles: [storm]
    depends_on: [storm-nimbus]
    environment:
      BOOTSTRAP: kafka:9092
      TAG_LIMITS: /app/tag_limits.csv
      RUN: ${RUN:-manual}
    volumes:
      - ../../candidates/l4-storm/storm.yaml:/conf/storm.yaml
      - ../../flink/sql/tag_limits.csv:/app/tag_limits.csv:ro
      - ../../experiments:/experiments
    command: ["storm", "jar", "/app/topology.jar", "exp.L4Topology"]

  # ── stage2 P3: Apache Beam 2.76.0 Java + DirectRunner (profile beam). 규칙 시도는 파이프라인 구성 시점에 기록 ──
  beam:
    build: ../../candidates/l4-beam
    image: l4bench-beam:2.76.0
    profiles: [beam]
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    environment:
      BOOTSTRAP: kafka:9092
      TAG_LIMITS: /app/tag_limits.csv
      RUN: ${RUN:-manual}
    volumes:
      - ../../flink/sql/tag_limits.csv:/app/tag_limits.csv:ro
      - ../../experiments:/experiments

  # ── stage2 P3: Apache StreamPipes 0.98.0 (profile streampipes). 공식 installer/compose(release/0.98.0) 구성에서 UI 만 뺌 ──
  # 서비스 이름(couchdb·nats·influxdb·backend·extensions-all-iiot)은 StreamPipes 기본 주소라 그대로 쓴다.
  couchdb:
    image: couchdb:3.3.1
    profiles: [streampipes]
    environment: {COUCHDB_USER: admin, COUCHDB_PASSWORD: admin}
    volumes: [sp-couchdb:/opt/couchdb/data]

  nats:
    image: nats:2.15.0                    # 공식 compose 는 태그 없는 nats — 벤치는 고정 태그
    profiles: [streampipes]

  influxdb:
    image: influxdb:2.6
    profiles: [streampipes]
    environment:
      INFLUXDB_DATA_ENGINE: tsm1
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: sp-admin
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: sp-admin
      DOCKER_INFLUXDB_INIT_ORG: sp
      DOCKER_INFLUXDB_INIT_BUCKET: sp
      DOCKER_INFLUXDB_INIT_MODE: setup
    volumes: [sp-influxdb:/var/lib/influxdb, sp-influxdb2:/var/lib/influxdb2]

  backend:
    image: apachestreampipes/backend:0.98.0
    profiles: [streampipes]
    depends_on: [couchdb, nats, influxdb]
    environment:
      SP_PRIORITIZED_PROTOCOL: nats
      SP_INITIAL_ADMIN_EMAIL: admin@streampipes.apache.org
      SP_INITIAL_ADMIN_PASSWORD: admin
    volumes: [sp-backend:/root/.streampipes]

  extensions-all-iiot:
    image: apachestreampipes/extensions-all-iiot:0.98.0
    profiles: [streampipes]
    depends_on: [backend]

  deploy-streampipes:
    build: ../tools
    image: l4bench-tools:1.0
    profiles: [streampipes]
    depends_on: [backend]
    environment:
      SP_API: http://backend:8030/streampipes-backend
      RUN: ${RUN:-manual}
    volumes: ["../..:/repo:ro", "../../experiments:/experiments"]
    command: ["python", "/repo/candidates/l4-streampipes/probe.py"]

  # EXP-113 후보: Python 스트림 서비스 (profile python)
  l4-python:
    build: ../../candidates/l4-python
    profiles: [python]
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    environment:
      BOOTSTRAP: kafka:9092
      TAG_LIMITS: /app/tag_limits.csv
      PATTERN_WINDOW_S: ${PATTERN_WINDOW_S:-10}   # L4-10 규칙 변경 시험용(기본 = V1)
    volumes:
      - ../../flink/sql/tag_limits.csv:/app/tag_limits.csv:ro   # V1 과 같은 규격 파일
      - l4py-state:/state                                       # EXP-113b 재시작 스냅샷
      - ./models:/opt/models:ro                                 # V1 ONNX 모델 사본

  # V1 submit-jobs.sh 와 같은 방식: 01~04 SQL 을 합쳐 sql-client 로 제출 + V1 이미지 안의 ONNX 잡(anomaly-job.jar) 제출
  submit-flinksql:
    image: iiot/flink-onnx:1.0
    profiles: [tools]
    depends_on:
      flink-jobmanager: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    volumes:
      - ./generated/client-config.yaml:/opt/flink/conf/config.yaml:ro
      - ./generated/sql:/opt/flink/sql:ro
      - ./generated/job.properties:/opt/flink/job/job.properties:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cat /opt/flink/sql/01_sources.sql /opt/flink/sql/02_tier1_rules.sql /opt/flink/sql/03_tier1_zscore.sql /opt/flink/sql/04_tier1_cep.sql > /tmp/p.sql
        /opt/flink/bin/sql-client.sh -f /tmp/p.sql 2>&1 | sed -E 's/\x1b\[[0-9;]*m//g' | grep -E "Job ID|ERROR|Exception" | head -20
        /opt/flink/bin/flink run -d -c org.uengine.iiot.AnomalyJob /opt/flink/job/anomaly-job.jar /opt/flink/job/job.properties 2>&1 | grep -E "JobID|ERROR|Exception" | head -20

  tools:
    build: ../tools
    image: l4bench-tools:1.0             # stage2 배포 서비스(deploy-*)도 같은 이미지를 쓴다
    profiles: [tools]
    depends_on: {kafka-init: {condition: service_completed_successfully}}
    volumes:
      - ../..:/repo:ro
      - ../../experiments:/experiments
    environment:
      BOOTSTRAP: kafka:9092
      FLINK_REST: http://flink-jobmanager:8081

volumes:
  l4py-state:
  flinkha-ckpt:
  flinkhac-ckpt:
  ekuiper-data:
  quix-state:
  risingwave-data:
  proton-data:
  arroyo-data:
  flinkhab-ckpt:
  kstreams-state:
  storm-data:
  sp-backend:
  sp-couchdb:
  sp-influxdb:
  sp-influxdb2:
