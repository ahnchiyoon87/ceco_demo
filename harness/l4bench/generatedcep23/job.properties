# ═══════════════════════════════════════════════════════════════
# Tier 3-C · Flink ONNX 이상탐지 잡 — 설정
# 재빌드 없이 이 파일만 바꿔 동작을 조정합니다.
# ═══════════════════════════════════════════════════════════════
kafka.bootstrap          = kafka:9092
kafka.topic.raw          = exp.l4.raw
kafka.topic.clean        = exp.l4.clean.cep
kafka.topic.score        = exp.l4.score.cep
kafka.topic.alerts       = exp.l4.alerts.cep
kafka.group.id           = flinkcep23-tier2-onnx

# ── 결측치 보간 (PDF p.5) ──
#   linear : 공백이 닫힐 때 선형 보간. 물리적 타당성 ↑, 지연 발생.
#   locf   : 직전 관측치 유지. 지연 0, 추세 단절.
# max-gap-ms 를 넘는 공백은 선형 보간을 포기하고 LOCF 로 대체한다.
interpolation.mode       = linear
interpolation.max-gap-ms = 20000
scan.interval.ms         = 1000

# ── Autoencoder 추론 ──
model.path               = /opt/models/model.onnx
model.meta               = /opt/models/model_meta.json
window.steps             = 10
inference.interval.ms    = 1000
# 재구성 오차 임계치. 비우면 model_meta.json 의 학습 시 산출값(99.5 백분위)을 쓴다.
anomaly.threshold        =
