server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 42m;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"available","component":"web"}';
    }

    location /api/ {
        # Re-resolve Docker service addresses after backend replacement.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $knowledge http://knowledge:8000;
        proxy_pass $knowledge$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # An ambiguous approval response must never cause a proxy retry.
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 502 504 =503 /backend-unavailable;
    }

    location = /backend-unavailable {
        internal;
        default_type application/json;
        return 503 '{"detail":"Backend unavailable. Check saved action records before retrying a decision."}';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
