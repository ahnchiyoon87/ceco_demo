map $http_upgrade $operator_connection {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 42m;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"available","component":"web"}';
    }

    location /api/ {
        # Re-resolve Docker service addresses after backend replacement.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $knowledge http://knowledge:8000;
        proxy_pass $knowledge$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # An ambiguous approval response must never cause a proxy retry.
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 502 504 =503 /backend-unavailable;
    }

    location /simulation/ {
        # Human UI controls only. Never hand simulator credentials to the browser
        # or the AI service. Cross-site writes and proxy retries are disabled.
        set $same_origin 0;
        if ($http_origin = "$scheme://$http_host") { set $same_origin 1; }
        if ($request_method = GET) { set $same_origin 1; }
        if ($same_origin = 0) { return 403; }
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $controls http://portal-controls:8090;
        rewrite ^/simulation/(.*)$ /$1 break;
        proxy_pass $controls$uri;
        proxy_set_header X-Portal-Same-Origin $same_origin;
        include /etc/nginx/snippets/portal-token.conf;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        client_max_body_size 1k;
    }

    location /operator/ {
        # One portal origin for FUXA assets, authenticated API and live socket.
        # Socket.IO query strings contain session tokens; do not access-log them.
        access_log off;
        resolver 127.0.0.11 valid=5s ipv6=off;
        include /etc/nginx/snippets/operator-gate.conf;
        rewrite ^/operator/(.*)$ /$1 break;
        proxy_pass $operator_gate$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $operator_connection;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
        proxy_redirect ~^/(.*)$ /operator/$1;
        sub_filter '<base href="/">' '<base href="/operator/">';
        sub_filter_once on;
        add_header Cache-Control "no-store" always;
    }

    location = /backend-unavailable {
        internal;
        default_type application/json;
        return 503 '{"detail":"Backend unavailable. Check saved action records before retrying a decision."}';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
