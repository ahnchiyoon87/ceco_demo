# 정비 판단 층 — KPI(BSC) · 결정(DMN 결정표) · 대안(손익 식) · 규칙(제외) · 정비 절차 단계(BPMN 순서) · 회복 기준
# (hyd-iot-edu 온톨로지 v1.0 다섯 층을 반응기 라인 하나에 맞춰 줄인 것)
#
# 숫자를 여기 박지 않는다. 손익 식은 기업 시스템 사실값(PostgreSQL enterprise.fact 키)과 현재 관측을 이름으로 읽는다.
# 식에 쓰는 이름
#   mes_* · erp_* · cmms_*     enterprise.fact 의 현재 값
#   t_<현장 작업>              현장 정비 작업 시간[h] (가상설비 field_tasks, 등록부 작업 정의가 정본)
#   o_<태그>  usl_<태그>       최신 관측값·상한 (태그의 '-' 는 '_' 로: TT-101 → o_TT_101)
#   c_<명령>  b_<명령>         현재 명령값 · 계획을 만든 시점의 명령값 (c_pump_speed_sp, b_pump_speed_sp)
#   i_interlock · i_maintenance 현재 PLC 인터록·정비 모드(0/1)
#   opt_<파라미터>  d_<파생값>  대안 파라미터 · 대안의 파생 계산(derived)
#   a_<고장모드>               AI 원인 평가의 무게(supported 1 · unknown 0.5 · refuted/not_applicable 0). 점검형 대안의 부품 기대 사용량
# 대안의 자격(eligibility): kind targeted = 치료하는 고장모드 중 하나라도 AI 평가가 supported 일 때만,
#                           kind inspect  = 원인 미확정일 때: 치료 대상 중 supported·unknown 이 둘 이상 남았거나,
#                                           supported 없이 unknown 이 남았을 때. 하나가 supported 이고 나머지가 refuted 면
#                                           원인이 좁혀진 것이라 원인 대응(targeted) 대안을 쓴다.
# 단계 종류: control(PLC 작업 요청) · field(가상 정비팀 현장 작업) · operator(운전원만 할 수 있는 일, until 조건을 기다림)
#            wait(설비 시간 대기, hours 식). abort_on_no_fault: false 면 "고장 없음" 소견에도 계획을 계속한다(점검형).

kpis:
  - {id: KPI-PRODUCTION-LOSS, name: 생산 손실, unit: 만원, perspective: 재무, owner: 생산팀,
     description: 정지·감속 시간만큼 잃는 생산 가치와 배치 폐기}
  - {id: KPI-DELIVERY-LOSS, name: 납기 지연 손실, unit: 만원, perspective: 고객, owner: 영업팀,
     description: 남은 수주를 납기 안에 못 만들 때 고객 라인 정지 보상}
  - {id: KPI-QUALITY-LOSS, name: 품질 손실, unit: 만원, perspective: 고객, owner: 품질팀,
     description: 온도 상한 초과 운전 중 생산분의 품질 이탈}
  - {id: KPI-MAINT-COST, name: 정비 비용, unit: 만원, perspective: 내부 프로세스, owner: 설비팀,
     description: 정비 인건비와 부품·약품}
  - {id: KPI-EQUIPMENT-RISK, name: 설비·안전 위험, unit: 만원, perspective: 학습과 성장, owner: 설비팀,
     description: 이상 상태로 운전을 이어가는 동안의 손상 기대 손실}

# KPI 사이의 가치 인과(BSC): +는 같은 방향, −는 상충
influences:
  - {from: KPI-PRODUCTION-LOSS, to: KPI-DELIVERY-LOSS, sign: "+", note: 정지가 길면 납기 여유를 먹는다}
  - {from: KPI-EQUIPMENT-RISK, to: KPI-PRODUCTION-LOSS, sign: "-", note: 위험을 감수하고 운전하면 당장의 생산 손실은 준다}
  - {from: KPI-QUALITY-LOSS, to: KPI-PRODUCTION-LOSS, sign: "-", note: 품질을 지키려 멈추면 생산 손실이 는다}

# 손익 식이 읽는 기업 시스템 입력(정본: enterprise.fact). 이 목록에 없는 키를 식에 쓰면 엔진이 거부한다.
inputs:
  - {system: MES, keys: [mes_hour_value, mes_nominal_rate_m3h, mes_order_remaining_m3, mes_order_due_h, mes_late_penalty_per_h,
                          mes_batch_remaining_h, mes_batch_scrap_cost, mes_offspec_loss_per_h]}
  - {system: ERP, keys: [erp_spare_bearing_qty, erp_bearing_cost, erp_bearing_lead_h, erp_descale_chem_qty, erp_descale_cost,
                          erp_strainer_kit_cost, erp_cv_kit_cost]}
  - {system: CMMS, keys: [cmms_labor_per_h, cmms_crew_callout_h, cmms_trip_restart_h, cmms_seizure_risk_per_h, cmms_overtemp_risk_per_h]}

decisions:
  # ─────────────────────────────── 시나리오 1 ───────────────────────────────
  - id: DEC-COOLING-RECOVERY
    name: 반응기 냉각 회복 정비
    question: 반응기 온도 상승을 일으킨 냉각 능력 저하를 어떤 정비로 회복할 것인가
    triggered_by: SYM-REACTOR-OVERTEMP
    recovery:
      section: AR100-COOLING-WATER#5
      hold_s: 30
      timeout_s: 180
      all: ["o_TT_101 <= c_temp_sp_c + 2.0", "o_FT_103 >= 20"]
    shared_derived:
      slack_h: "mes_order_due_h - mes_order_remaining_m3 / mes_nominal_rate_m3h"
    rules:
      - {id: RULE-NO-OVERTEMP-RUN, when: "opt_keeps_overtemp == 1 and o_TT_101 > usl_TT_101", then: EXCLUDE,
         policy: AR100-MAINT-POLICY#3, reason: 상한 초과 온도로 운전을 이어가는 대안은 제외}
      - {id: RULE-NO-DESCALE-CHEM, when: "opt_uses_descale == 1 and erp_descale_chem_qty < 1", then: EXCLUDE,
         policy: AR100-MAINT-POLICY#5, reason: 세정제 재고 없음}
    options:
      - id: OPT-CW-SWITCH-ONLINE
        name: 예비 스트레이너로 전환하고 막힌 바스켓 세척(운전 유지)
        kind: targeted
        treats: [FM-CW-STRAINER-CLOG]
        params: {keeps_overtemp: 0, uses_descale: 0}
        derived: {down_h: "0", hot_h: "t_strainer_switch + cmms_crew_callout_h"}
        impacts:
          KPI-QUALITY-LOSS: "-d_hot_h * mes_offspec_loss_per_h"
          KPI-MAINT-COST: "-(t_strainer_switch + t_strainer_clean) * cmms_labor_per_h - erp_strainer_kit_cost"
          KPI-EQUIPMENT-RISK: "-d_hot_h * cmms_overtemp_risk_per_h"
        procedure: [AR100-COOLING-WATER#3]
        steps:
          - {kind: field, wm: WM-FLD-STRAINER-SWITCH, say: 정비팀이 예비 바스켓으로 전환한다}
          - {kind: field, wm: WM-FLD-STRAINER-CLEAN, say: 막힌 바스켓을 격리해 분해 세척한다, abort_on_no_fault: false}
      - id: OPT-CW-DERATE-SWITCH
        name: 공급 펌프를 낮춰 반응열을 줄인 뒤 스트레이너 전환·세척
        kind: targeted
        treats: [FM-CW-STRAINER-CLOG]
        params: {keeps_overtemp: 0, uses_descale: 0, derate_frac: 0.6}
        derived: {down_h: "0", hot_h: "(t_strainer_switch + cmms_crew_callout_h) * 0.5"}
        impacts:
          KPI-PRODUCTION-LOSS: "-(t_strainer_switch + t_strainer_clean + cmms_crew_callout_h) * (1 - opt_derate_frac) * mes_hour_value"
          KPI-QUALITY-LOSS: "-d_hot_h * mes_offspec_loss_per_h"
          KPI-MAINT-COST: "-(t_strainer_switch + t_strainer_clean) * cmms_labor_per_h - erp_strainer_kit_cost"
          KPI-EQUIPMENT-RISK: "-d_hot_h * cmms_overtemp_risk_per_h"
        procedure: [AR100-COOLING-WATER#3]
        steps:
          - {kind: control, wm: WM-P101-SPEED, params: {pump_speed_pct: "max(20, min(80, round(b_pump_speed_sp * opt_derate_frac)))"}, say: 공급 펌프 감속(반응열 감소)}
          - {kind: field, wm: WM-FLD-STRAINER-SWITCH, say: 정비팀이 예비 바스켓으로 전환한다}
          - {kind: field, wm: WM-FLD-STRAINER-CLEAN, say: 막힌 바스켓을 격리해 분해 세척한다, abort_on_no_fault: false}
          - {kind: control, wm: WM-P101-SPEED, params: {pump_speed_pct: "max(20, min(80, round(b_pump_speed_sp)))"}, say: 공급 펌프 속도 원복}
      - id: OPT-JACKET-DESCALE
        name: 공급을 멈추고 재킷 냉각 코일 화학 세정
        kind: targeted
        treats: [FM-JACKET-FOULING]
        params: {keeps_overtemp: 0, uses_descale: 1}
        derived: {down_h: "t_jacket_descale + t_release_lockout + cmms_trip_restart_h + cmms_crew_callout_h", hot_h: "cmms_crew_callout_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value"
          KPI-DELIVERY-LOSS: "-max(0, d_down_h - d_slack_h) * mes_late_penalty_per_h"
          KPI-MAINT-COST: "-(t_jacket_descale + t_release_lockout) * cmms_labor_per_h - erp_descale_cost"
          KPI-EQUIPMENT-RISK: "-d_hot_h * cmms_overtemp_risk_per_h"
        procedure: [AR100-COOLING-WATER#4, AR100-MAINT-POLICY#1]
        steps:
          - {kind: control, wm: WM-P101-STOP, say: 공급 펌프 정지(반응열 제거)}
          - {kind: control, wm: WM-PLC-MAINT-ON, say: 정비 모드 켜기(원격 명령 차단·LOTO)}
          - {kind: field, wm: WM-FLD-JACKET-DESCALE, say: 정비팀이 재킷 냉각 코일을 화학 세정한다}
          - {kind: field, wm: WM-FLD-LOTO-RELEASE, say: 작업 완료 확인·격리 해제·정비 해제 키}
          - {kind: control, wm: WM-P101-START, say: 공급 펌프 재기동}
      - id: OPT-JACKET-DERATE-RUN
        name: 감속 운전으로 버티다 다음 계획 정지 때 세정
        kind: targeted
        treats: [FM-JACKET-FOULING]
        params: {keeps_overtemp: 1, uses_descale: 0, derate_frac: 0.5, derate_h: 4}
        derived: {down_h: "0", hot_h: "opt_derate_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-opt_derate_h * (1 - opt_derate_frac) * mes_hour_value"
          KPI-QUALITY-LOSS: "-d_hot_h * mes_offspec_loss_per_h * opt_derate_frac"
          KPI-EQUIPMENT-RISK: "-d_hot_h * cmms_overtemp_risk_per_h"
        procedure: [AR100-COOLING-WATER#4]
        steps:
          - {kind: control, wm: WM-P101-SPEED, params: {pump_speed_pct: "max(20, min(80, round(b_pump_speed_sp * opt_derate_frac)))"}, say: 공급 펌프 감속}
      - id: OPT-COOLING-FULL-INSPECT
        name: 공급을 멈추고 냉각 계통 전체 점검(스트레이너 전환·세척 + 재킷 세정)
        kind: inspect
        treats: [FM-CW-STRAINER-CLOG, FM-JACKET-FOULING]
        params: {keeps_overtemp: 0, uses_descale: 1}
        derived: {down_h: "t_strainer_switch + t_jacket_descale + t_release_lockout + cmms_trip_restart_h + cmms_crew_callout_h", hot_h: "cmms_crew_callout_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value"
          KPI-DELIVERY-LOSS: "-max(0, d_down_h - d_slack_h) * mes_late_penalty_per_h"
          KPI-MAINT-COST: "-(t_strainer_switch + t_strainer_clean + t_jacket_descale + t_release_lockout) * cmms_labor_per_h - erp_descale_cost - erp_strainer_kit_cost"
          KPI-EQUIPMENT-RISK: "-d_hot_h * cmms_overtemp_risk_per_h"
        procedure: [AR100-COOLING-WATER#3, AR100-COOLING-WATER#4, AR100-MAINT-POLICY#1]
        steps:
          - {kind: control, wm: WM-P101-STOP, say: 공급 펌프 정지}
          - {kind: field, wm: WM-FLD-STRAINER-SWITCH, say: 예비 바스켓 전환, abort_on_no_fault: false}
          - {kind: field, wm: WM-FLD-STRAINER-CLEAN, say: 대기 바스켓 세척, abort_on_no_fault: false}
          - {kind: control, wm: WM-PLC-MAINT-ON, say: 정비 모드 켜기(LOTO)}
          - {kind: field, wm: WM-FLD-JACKET-DESCALE, say: 재킷 화학 세정, abort_on_no_fault: false}
          - {kind: field, wm: WM-FLD-LOTO-RELEASE, say: 작업 완료 확인·격리 해제}
          - {kind: control, wm: WM-P101-START, say: 공급 펌프 재기동}

  # ─────────────────────────────── 시나리오 2 ───────────────────────────────
  - id: DEC-AGITATOR-REPAIR
    name: 교반기 진동 정비
    question: 교반기 진동의 원인을 어떤 정비로 언제 제거할 것인가
    triggered_by: SYM-MIXER-CURRENT-VIBRATION
    recovery:
      section: AR100-AGITATOR-MAINT#6
      hold_s: 30
      timeout_s: 180
      all: ["o_VT_101 < 4.5", "o_IT_102 < usl_IT_102", "o_IT_102 > 1.0"]
    shared_derived:
      slack_h: "mes_order_due_h - mes_order_remaining_m3 / mes_nominal_rate_m3h"
      vib_ratio: "o_VT_101 / usl_VT_101"
    rules:
      - {id: RULE-ZONE-D-NO-WAIT, when: "opt_waits_batch == 1 and o_VT_101 >= 11.0", then: EXCLUDE,
         policy: AR100-MAINT-POLICY#4, reason: 진동 영역 D 에서는 배치 종료를 기다리지 않는다}
      - {id: RULE-NO-SPARE-BEARING, when: "opt_uses_bearing == 1 and erp_spare_bearing_qty < 1", then: EXCLUDE,
         policy: AR100-MAINT-POLICY#5, reason: 예비 베어링 재고 없음}
      - {id: RULE-BATCH-ALREADY-STOPPED, when: "opt_waits_batch == 1 and c_agitator_run == 0", then: EXCLUDE,
         policy: AR100-AGITATOR-MAINT#3, reason: 교반기가 이미 멈춰 배치가 중단됨 — 배치 종료를 기다릴 이유가 없음}
    options:
      - id: OPT-BEARING-NOW
        name: 지금 정지하고 베어링 점검·교체
        kind: targeted
        treats: [FM-MIXER-BEARING-WEAR]
        params: {waits_batch: 0, uses_bearing: 1}
        derived: {down_h: "t_bearing_replace + t_release_lockout + cmms_trip_restart_h + cmms_crew_callout_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value - mes_batch_scrap_cost * c_agitator_run"
          KPI-DELIVERY-LOSS: "-max(0, d_down_h - d_slack_h) * mes_late_penalty_per_h"
          KPI-MAINT-COST: "-(t_bearing_replace + t_release_lockout) * cmms_labor_per_h - erp_bearing_cost"
          KPI-EQUIPMENT-RISK: "-cmms_crew_callout_h * cmms_seizure_risk_per_h * d_vib_ratio"
        procedure: [AR100-AGITATOR-MAINT#4, AR100-MAINT-POLICY#1]
        steps:
          - {kind: control, wm: WM-M101-STOP, say: 교반기 정지}
          - {kind: control, wm: WM-PLC-MAINT-ON, say: 정비 모드 켜기(LOTO)}
          - {kind: field, wm: WM-FLD-BEARING-REPLACE, say: 정비팀이 베어링을 분해 점검하고 마모 시 교체한다}
          - {kind: field, wm: WM-FLD-LOTO-RELEASE, say: 작업 완료 확인·격리 해제}
          - {kind: control, wm: WM-M101-START, say: 교반기 재기동}
      - id: OPT-BEARING-AFTER-BATCH
        name: 배치 종료까지 운전하고 정지해 베어링 점검·교체
        kind: targeted
        treats: [FM-MIXER-BEARING-WEAR]
        params: {waits_batch: 1, uses_bearing: 1}
        derived: {down_h: "t_bearing_replace + t_release_lockout + cmms_trip_restart_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value"
          KPI-DELIVERY-LOSS: "-max(0, d_down_h - d_slack_h) * mes_late_penalty_per_h"
          KPI-MAINT-COST: "-(t_bearing_replace + t_release_lockout) * cmms_labor_per_h - erp_bearing_cost"
          KPI-EQUIPMENT-RISK: "-mes_batch_remaining_h * cmms_seizure_risk_per_h * d_vib_ratio"
        procedure: [AR100-AGITATOR-MAINT#3, AR100-AGITATOR-MAINT#4]
        steps:
          - {kind: wait, hours: "mes_batch_remaining_h", say: 현재 배치 종료까지 운전(진동 감시)}
          - {kind: control, wm: WM-M101-STOP, say: 배치 종료 후 교반기 정지}
          - {kind: control, wm: WM-PLC-MAINT-ON, say: 정비 모드 켜기(LOTO)}
          - {kind: field, wm: WM-FLD-BEARING-REPLACE, say: 정비팀이 베어링을 분해 점검하고 마모 시 교체한다}
          - {kind: field, wm: WM-FLD-LOTO-RELEASE, say: 작업 완료 확인·격리 해제}
          - {kind: control, wm: WM-M101-START, say: 교반기 재기동}
      - id: OPT-ALIGN-NOW
        name: 지금 정지하고 축 정렬 점검·조정
        kind: targeted
        treats: [FM-MIXER-SHAFT-MISALIGNMENT]
        params: {waits_batch: 0, uses_bearing: 0}
        derived: {down_h: "t_shaft_align + t_release_lockout + cmms_trip_restart_h + cmms_crew_callout_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value - mes_batch_scrap_cost * c_agitator_run"
          KPI-DELIVERY-LOSS: "-max(0, d_down_h - d_slack_h) * mes_late_penalty_per_h"
          KPI-MAINT-COST: "-(t_shaft_align + t_release_lockout) * cmms_labor_per_h"
          KPI-EQUIPMENT-RISK: "-cmms_crew_callout_h * cmms_seizure_risk_per_h * d_vib_ratio"
        procedure: [AR100-AGITATOR-MAINT#5, AR100-MAINT-POLICY#1]
        steps:
          - {kind: control, wm: WM-M101-STOP, say: 교반기 정지}
          - {kind: control, wm: WM-PLC-MAINT-ON, say: 정비 모드 켜기(LOTO)}
          - {kind: field, wm: WM-FLD-SHAFT-ALIGN, say: 정비팀이 커플링 정렬을 측정하고 조정한다}
          - {kind: field, wm: WM-FLD-LOTO-RELEASE, say: 작업 완료 확인·격리 해제}
          - {kind: control, wm: WM-M101-START, say: 교반기 재기동}
      - id: OPT-ALIGN-AFTER-BATCH
        name: 배치 종료까지 운전하고 정지해 축 정렬 점검·조정
        kind: targeted
        treats: [FM-MIXER-SHAFT-MISALIGNMENT]
        params: {waits_batch: 1, uses_bearing: 0}
        derived: {down_h: "t_shaft_align + t_release_lockout + cmms_trip_restart_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value"
          KPI-DELIVERY-LOSS: "-max(0, d_down_h - d_slack_h) * mes_late_penalty_per_h"
          KPI-MAINT-COST: "-(t_shaft_align + t_release_lockout) * cmms_labor_per_h"
          KPI-EQUIPMENT-RISK: "-mes_batch_remaining_h * cmms_seizure_risk_per_h * d_vib_ratio"
        procedure: [AR100-AGITATOR-MAINT#3, AR100-AGITATOR-MAINT#5]
        steps:
          - {kind: wait, hours: "mes_batch_remaining_h", say: 현재 배치 종료까지 운전(진동 감시)}
          - {kind: control, wm: WM-M101-STOP, say: 배치 종료 후 교반기 정지}
          - {kind: control, wm: WM-PLC-MAINT-ON, say: 정비 모드 켜기(LOTO)}
          - {kind: field, wm: WM-FLD-SHAFT-ALIGN, say: 정비팀이 커플링 정렬을 측정하고 조정한다}
          - {kind: field, wm: WM-FLD-LOTO-RELEASE, say: 작업 완료 확인·격리 해제}
          - {kind: control, wm: WM-M101-START, say: 교반기 재기동}
      - id: OPT-AGITATOR-INSPECT-BOTH
        name: 지금 정지하고 축 정렬과 베어링을 모두 점검(원인을 좁히지 못했을 때)
        kind: inspect
        treats: [FM-MIXER-BEARING-WEAR, FM-MIXER-SHAFT-MISALIGNMENT]
        params: {waits_batch: 0, uses_bearing: 1}
        derived: {down_h: "t_shaft_align + t_bearing_replace + t_release_lockout + cmms_trip_restart_h + cmms_crew_callout_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value - mes_batch_scrap_cost * c_agitator_run"
          KPI-DELIVERY-LOSS: "-max(0, d_down_h - d_slack_h) * mes_late_penalty_per_h"
          KPI-MAINT-COST: "-(t_shaft_align + t_bearing_replace + t_release_lockout) * cmms_labor_per_h - erp_bearing_cost * a_FM_MIXER_BEARING_WEAR"
          KPI-EQUIPMENT-RISK: "-cmms_crew_callout_h * cmms_seizure_risk_per_h * d_vib_ratio"
        procedure: [AR100-AGITATOR-MAINT#4, AR100-AGITATOR-MAINT#5]
        steps:
          - {kind: control, wm: WM-M101-STOP, say: 교반기 정지}
          - {kind: control, wm: WM-PLC-MAINT-ON, say: 정비 모드 켜기(LOTO)}
          - {kind: field, wm: WM-FLD-SHAFT-ALIGN, say: 축 정렬 측정·필요 시 조정, abort_on_no_fault: false}
          - {kind: field, wm: WM-FLD-BEARING-REPLACE, say: 베어링 분해 점검·마모 시 교체, abort_on_no_fault: false}
          - {kind: field, wm: WM-FLD-LOTO-RELEASE, say: 작업 완료 확인·격리 해제}
          - {kind: control, wm: WM-M101-START, say: 교반기 재기동}

  # ─────────────────────────────── 시나리오 3 ───────────────────────────────
  - id: DEC-PRESSURE-RESPONSE
    name: 반응기 고압·인터록 트립 대응 정비
    question: 고압 지시와 인터록 트립의 원인을 어떤 정비로 처리하고 생산을 재개할 것인가
    triggered_by: SYM-REACTOR-OVERPRESSURE
    recovery:
      section: AR100-PRESSURE-RESPONSE#6
      hold_s: 30
      timeout_s: 240
      all: ["abs(o_PT_101 - o_PT_102) <= 0.3", "o_PT_102 < usl_PT_102", "o_FT_101 > 3.0"]
    shared_derived:
      slack_h: "mes_order_due_h - mes_order_remaining_m3 / mes_nominal_rate_m3h"
    rules:
      - {id: RULE-NO-INTERLOCK-BYPASS, when: "opt_bypasses_interlock == 1", then: EXCLUDE,
         policy: AR100-MAINT-POLICY#2, reason: 인터록 우회 재기동은 손익과 무관하게 제외}
    options:
      - id: OPT-PT-CALIBRATE
        name: PT-101 비교 교정 후 인터록 리셋·재기동
        kind: targeted
        treats: [FM-PT101-DRIFT]
        params: {bypasses_interlock: 0}
        derived: {down_h: "(t_pt_calibrate + cmms_trip_restart_h + cmms_crew_callout_h) * i_interlock"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value"
          KPI-DELIVERY-LOSS: "-max(0, d_down_h - d_slack_h) * mes_late_penalty_per_h"
          KPI-MAINT-COST: "-t_pt_calibrate * cmms_labor_per_h"
        procedure: [AR100-PRESSURE-RESPONSE#3, AR100-PRESSURE-RESPONSE#5]
        steps:
          - {kind: field, wm: WM-FLD-PT101-CALIBRATE, say: 정비팀이 PT-101 을 격리해 기준 압력계와 비교 교정한다}
          - {kind: operator, until: "i_interlock == 0", timeout_s: 240, say: 운전원이 FUXA 에서 고압 인터록을 리셋한다(AI 는 리셋할 수 없다)}
          - {kind: control, wm: WM-P101-START, say: 공급 펌프 재기동}
      - id: OPT-CV-REPAIR
        name: 배출 밸브 분해 정비 후 인터록 리셋·재기동
        kind: targeted
        treats: [FM-OUTLET-RESTRICTION]
        params: {bypasses_interlock: 0}
        derived: {down_h: "t_cv_repair + t_release_lockout + cmms_trip_restart_h + cmms_crew_callout_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value"
          KPI-DELIVERY-LOSS: "-max(0, d_down_h - d_slack_h) * mes_late_penalty_per_h"
          KPI-MAINT-COST: "-(t_cv_repair + t_release_lockout) * cmms_labor_per_h - erp_cv_kit_cost"
        procedure: [AR100-PRESSURE-RESPONSE#4, AR100-PRESSURE-RESPONSE#5, AR100-MAINT-POLICY#1]
        steps:
          - {kind: control, wm: WM-P101-STOP, say: 공급 펌프 정지 확인(인터록 트립 상태면 이미 정지)}
          - {kind: control, wm: WM-PLC-MAINT-ON, say: 정비 모드 켜기(LOTO)}
          - {kind: field, wm: WM-FLD-CV101-REPAIR, say: 정비팀이 배출 밸브를 격리해 분해 정비한다}
          - {kind: field, wm: WM-FLD-LOTO-RELEASE, say: 작업 완료 확인·격리 해제}
          - {kind: operator, until: "i_interlock == 0", timeout_s: 240, say: 압력이 5.2 barg 아래로 내려오면 운전원이 고압 인터록을 리셋한다}
          - {kind: control, wm: WM-P101-START, say: 공급 펌프 재기동}
      - id: OPT-INTERLOCK-BYPASS
        name: 인터록을 우회하고 바로 재기동(PT-102 로 감시)
        kind: inspect
        treats: [FM-PT101-DRIFT, FM-OUTLET-RESTRICTION]
        params: {bypasses_interlock: 1}
        derived: {down_h: "cmms_trip_restart_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value"
        procedure: [AR100-MAINT-POLICY#2]
        steps: []
      - id: OPT-PRESSURE-INSPECT-BOTH
        name: 계기 교정과 배출 밸브 정비를 모두 수행(원인을 좁히지 못했을 때)
        kind: inspect
        treats: [FM-PT101-DRIFT, FM-OUTLET-RESTRICTION]
        params: {bypasses_interlock: 0}
        derived: {down_h: "t_pt_calibrate + t_cv_repair + t_release_lockout + cmms_trip_restart_h + cmms_crew_callout_h"}
        impacts:
          KPI-PRODUCTION-LOSS: "-d_down_h * mes_hour_value"
          KPI-DELIVERY-LOSS: "-max(0, d_down_h - d_slack_h) * mes_late_penalty_per_h"
          KPI-MAINT-COST: "-(t_pt_calibrate + t_cv_repair + t_release_lockout) * cmms_labor_per_h - erp_cv_kit_cost"
        procedure: [AR100-PRESSURE-RESPONSE#3, AR100-PRESSURE-RESPONSE#4, AR100-PRESSURE-RESPONSE#5]
        steps:
          - {kind: control, wm: WM-P101-STOP, say: 공급 펌프 정지 확인}
          - {kind: field, wm: WM-FLD-PT101-CALIBRATE, say: PT-101 비교 교정, abort_on_no_fault: false}
          - {kind: control, wm: WM-PLC-MAINT-ON, say: 정비 모드 켜기(LOTO)}
          - {kind: field, wm: WM-FLD-CV101-REPAIR, say: 배출 밸브 분해 정비, abort_on_no_fault: false}
          - {kind: field, wm: WM-FLD-LOTO-RELEASE, say: 작업 완료 확인·격리 해제}
          - {kind: operator, until: "i_interlock == 0", timeout_s: 240, say: 운전원이 고압 인터록을 리셋한다}
          - {kind: control, wm: WM-P101-START, say: 공급 펌프 재기동}
