# V2 고장 지식 그래프 데이터 — 증상 → 고장모드 → 원인 → 확인 관측·조치 절
# 새 고장 유형은 이 파일(또는 같은 폴더의 다른 *.yaml)과 knowledge-docs 문서만 추가한다. 코드는 바꾸지 않는다.
# 판정 규칙이 아니다: check.text 는 LLM 이 읽는 근거 설명이며 코드가 평가하지 않는다(PROTOCOL.md §2).
# investigation: 증상의 조사 절차 절(확인 순서). section 은 "문서ID#절" — 절은 제목 앞 번호(있으면) 또는 제목을 '-'로 이은 이름.

components:
  - {id: M-101-BEARING, name: 교반기 베어링, part_of: M-101}
  - {id: M-101-SHAFT, name: 교반기 축·커플링, part_of: M-101}
  - {id: HX-101, name: 재킷히터, part_of: R-101}
  - {id: HX-102, name: 재킷 냉각 코일, part_of: R-101}
  - {id: ST-103-BASKET, name: 냉각수 스트레이너 바스켓, part_of: HX-102}
  - {id: PT-101-TX, name: PT-101 압력 트랜스미터, part_of: R-101}
  - {id: CV-101-STEM, name: 배출 밸브 스템·패킹, part_of: R-101}

symptoms:
  - id: SYM-MIXER-CURRENT-VIBRATION
    name: 교반기 진동 상한 초과
    observed_on: M-101
    signatures: [{alert_type: CEP_BEARING, tag: VT-101}, {alert_type: THRESHOLD_USL, tag: IT-102}, {alert_type: THRESHOLD_USL, tag: VT-101}]
    section: AR100-FAILURE-MODES#1
    investigation: [AR100-AGITATOR-MAINT#1, AR100-AGITATOR-MAINT#2, AR100-MIXER-RESPONSE#2]
  - id: SYM-REACTOR-OVERTEMP
    name: 반응기 온도 상한 초과
    observed_on: R-101
    signatures: [{alert_type: THRESHOLD_USL, tag: TT-101}, {alert_type: THRESHOLD_USL, tag: TT-102}, {alert_type: THRESHOLD_USL, tag: TT-104},
                 {alert_type: THRESHOLD_LSL, tag: FT-103}, {alert_type: THRESHOLD_USL, tag: PDT-103}]
    section: AR100-FAILURE-MODES#2
    investigation: [AR100-COOLING-WATER#1, AR100-COOLING-WATER#2, AR100-THERMAL-RESPONSE#적용-근거와-범위]

failure_modes:
  - id: FM-MIXER-BEARING-WEAR
    name: 교반기 베어링 마모
    manifests_as: [SYM-MIXER-CURRENT-VIBRATION]
    affects: M-101-BEARING
    causes: [윤활 부족, 수명 도달, 이물 혼입]
    checks:
      - {text: IT-102 가 상한 9.6 A 를 먼저 넘고 VT-101 이 뒤따라 상한을 넘으면(CEP_BEARING) 지지한다. VT-101 만 오르고 IT-102 가 상한 아래면 지지하지 않는다. 베어링 실물 상태는 센서로 잴 수 없어 확정은 분해 점검이다., observable: true, tags: [IT-102, VT-101], field_check: 베어링 분해 점검(유격·박리·윤활)}
    section: AR100-FAILURE-MODES#1
  - id: FM-MIXER-SHAFT-MISALIGNMENT
    name: 교반기 축 정렬 불량
    manifests_as: [SYM-MIXER-CURRENT-VIBRATION]
    affects: M-101-SHAFT
    causes: [조립 불량, 충격, 기초 볼트 풀림]
    checks:
      - {text: VT-101 이 상한을 넘는데 IT-102 가 상한 아래에 머물고 CEP_BEARING 이 없으면 지지한다. IT-102 가 먼저 상한을 넘었으면 지지하지 않는다. 확정은 레이저 정렬 측정이다., observable: true, tags: [IT-102, VT-101], field_check: 커플링 레이저 정렬 측정}
    section: AR100-FAILURE-MODES#1
  - id: FM-MIXER-CRITICAL-SPEED
    name: 임계 속도 부근 운전
    manifests_as: [SYM-MIXER-CURRENT-VIBRATION]
    affects: M-101
    causes: [운전 속도 설정]
    checks:
      - {text: 교반 속도 센서·설정값이 없다. 이 공정의 교반기는 고정속이라 운전 중 속도가 바뀌지 않았다., observable: false, tags: [], field_check: 회전수 현장 확인}
    section: AR100-FAILURE-MODES#1
  - id: FM-MIXER-LOW-LEVEL
    name: 반응기 액위 부족
    manifests_as: [SYM-MIXER-CURRENT-VIBRATION]
    affects: R-101
    causes: [공급 부족, 배출 과다]
    checks:
      - {text: LT-102 최신값이 하한 이상이면 액위 부족으로 전류·진동 상승을 설명할 수 없다(액위가 낮으면 전류가 줄어든다). 하한 미만일 때만 후보로 남는다., observable: true, tags: [LT-102]}
    section: AR100-FAILURE-MODES#1
  - id: FM-HEATER-STUCK-ON
    name: 히터 출력 고착
    manifests_as: [SYM-REACTOR-OVERTEMP]
    affects: HX-101
    causes: [릴레이·접점 융착, 출력 제어기 고장]
    checks:
      - {text: 온도가 목표보다 높아 히터가 쉬어야 하는데도 TT-102 가 TT-101 보다 크게(약 10°C 이상) 높으면 열 공급이 계속된다는 근거다. 냉각 중이면 TT-102 는 TT-101 보다 낮다., observable: true, tags: [TT-101, TT-102], commands: [heater_enable, temp_sp_c]}
    section: AR100-FAILURE-MODES#2
  - id: FM-COOLING-LOSS
    name: 냉각 명령 꺼짐
    manifests_as: [SYM-REACTOR-OVERTEMP]
    affects: HX-102
    causes: [냉각기 정지 명령, 운전원 조작]
    checks:
      - {text: cooler_enable 이 꺼져 있고 TT-104 − TT-103 이 거의 0 이면 근거. 냉각 명령이 켜져 있으면 이 고장모드로 설명할 수 없다., observable: true, tags: [TT-103, TT-104], commands: [cooler_enable]}
    section: AR100-FAILURE-MODES#2
  - id: FM-CW-STRAINER-CLOG
    name: 냉각수 스트레이너 막힘
    manifests_as: [SYM-REACTOR-OVERTEMP]
    affects: ST-103-BASKET
    causes: [냉각수 속 이물, 스케일 조각 유입]
    checks:
      - {text: FT-103 이 하한 20 m3/h 미만이고 PDT-103 이 상한 0.8 bar 를 넘으며 TT-104 − TT-103 이 크게(약 25°C 이상) 벌어지면 지지한다. 유량·차압이 정상이면 설명할 수 없다., observable: true, tags: [FT-103, PDT-103, TT-103, TT-104], commands: [cooler_enable], field_check: 바스켓 분해 시 이물 양}
    section: AR100-FAILURE-MODES#2
  - id: FM-JACKET-FOULING
    name: 재킷 전열면 스케일
    manifests_as: [SYM-REACTOR-OVERTEMP]
    affects: HX-102
    causes: [냉각수 경도, 장기 운전 퇴적]
    checks:
      - {text: FT-103 과 PDT-103 이 정상인데 TT-104 − TT-103 이 작고(약 5°C 미만) TT-101 이 오르면 지지한다. 유량이 하한 미만이면 유량 문제가 먼저라 지지하지 않는다., observable: true, tags: [FT-103, PDT-103, TT-103, TT-104, TT-101], commands: [cooler_enable], field_check: 세정 시 스케일 양}
    section: AR100-FAILURE-MODES#2
  - id: FM-SETPOINT-TOO-HIGH
    name: 목표 온도 과대 설정
    manifests_as: [SYM-REACTOR-OVERTEMP]
    affects: R-101
    causes: [설정 오류]
    checks:
      - {text: 현재 목표 온도 temp_sp_c 가 TT-101 상한 이상이면 근거, 상한 미만이면 이 고장모드로 상한 초과를 설명할 수 없다., observable: true, tags: [TT-101], commands: [temp_sp_c]}
    section: AR100-FAILURE-MODES#2

actions:
  - {id: stop_mixer, mitigates: [SYM-MIXER-CURRENT-VIBRATION], procedure: [AR100-MIXER-RESPONSE#3, AR100-MIXER-RESPONSE#4]}
  - {id: enable_cooling, mitigates: [SYM-REACTOR-OVERTEMP], procedure: [AR100-THERMAL-RESPONSE#조사와-제안, AR100-THERMAL-RESPONSE#승인과-실행]}
  - {id: inspect_only, mitigates: [SYM-MIXER-CURRENT-VIBRATION, SYM-REACTOR-OVERTEMP], procedure: [AR100-EVIDENCE-POLICY#본문]}
