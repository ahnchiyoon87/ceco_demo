# V2 온톨로지 시나리오 정답 (구현 전 고정, 2026-09-28)
# 이 파일은 추론 엔진·검색·온톨로지 데이터 구현 전에 커밋한다(git 기록이 사전 등록 증거). 결과를 보고 고치지 않는다.
# 근거: 0_plant/simulator/plant.yaml·plant.py(고장 주입 물리), 5_ai/manuals/AR100-*.md(기존 문서), 새 문서는 SC3 에서만 추가.
#
# 판정 방식
#   causes: 추론 결과의 고장모드별 상태가 아래와 정확히 같아야 1점(시나리오당 고장모드 수만큼 채점).
#           supported(관측으로 지지) / refuted(관측이 반대) / unknown(센서로 확인 불가, 현장 점검) / not_applicable(전제 불충족)
#   confirmed_cause: 항상 없음(null). 원인을 "확정"으로 출력하면 그 시나리오 원인 판정은 0점.
#   sections: 검색 상위 3개 안에 필수 절이 모두 있으면 통과(Recall@3). 금지 절이 상위 3개에 있으면 실패.
#   action: 허용 조치(stop_mixer / enable_cooling / inspect_only) 중 아래와 같아야 통과.
#   고장 주입 정답(시나리오 이름)은 추론 입력에 넣지 않는다.

scenarios:
  SC1_bearing:
    title: 교반기 베어링 열화 의심 (전류↑ 후 10초 내 진동↑)
    plant_setup: {agitator_run: 1}
    inject: {scenario: bearing_wear}
    alarm_trigger: {alert_type: CEP_BEARING, tag: VT-101}
    causes:
      FM-MIXER-BEARING-WEAR: unknown          # 베어링 실물 상태는 센서로 확인 불가 (ASSET-CONTEXT, MIXER §2-4)
      FM-MIXER-SHAFT-MISALIGNMENT: unknown    # 축 변형·정렬은 센서로 확인 불가
      FM-MIXER-CRITICAL-SPEED: unknown        # 교반 속도 센서 없음
      FM-MIXER-LOW-LEVEL: refuted             # 액위 부족: LT-102 가 lsl 15% 이상이면 기각 (정상 운전 액위 유지)
    confirmed_cause: null
    sections_required: [AR100-MIXER-RESPONSE#2, AR100-MIXER-RESPONSE#3]
    sections_forbidden: [AR100-THERMAL-RESPONSE#*]
    action: stop_mixer                        # IT-102·VT-101 최신값이 모두 usl 초과인 현재 복합 이상일 때 (MIXER §3). 아니면 inspect_only

  SC2_heater_stuck:
    title: 히터 출력 고착 (정지 명령과 무관하게 열 공급 지속)
    plant_setup: {heater_enable: 0, cooler_enable: 0}
    inject: {scenario: heater_stuck}
    alarm_trigger: {alert_type: THRESHOLD_USL, tag: TT-101}
    causes:
      FM-HEATER-STUCK-ON: supported           # heater_enable=0 인데 재킷 TT-102 가 반응기 TT-101 보다 높게 유지 → 열 공급 지속
      FM-COOLING-LOSS: not_applicable         # 냉각 명령이 꺼져 있어 냉각 상실을 판단할 전제가 없음
      FM-SETPOINT-TOO-HIGH: refuted           # 목표 온도 temp_sp_c 가 usl 95 미만이면 기각
    confirmed_cause: null
    sections_required: [AR100-THERMAL-RESPONSE#조사와-제안, AR100-THERMAL-RESPONSE#승인과-실행]
    sections_forbidden: [AR100-MIXER-RESPONSE#*]
    action: enable_cooling                    # THERMAL: 최신·현재 TT-101 usl 초과, 냉각 꺼짐, 인터록 없음, 목표 lsl~usl

  SC3_overpressure:                           # 확장 시험: 코드 변경 0줄, 온톨로지 데이터 + 새 문서만 추가
    title: 반응기 압력 순간 과압 (신규 고장 유형)
    plant_setup: {}
    inject: {scenario: spike}
    alarm_trigger: {alert_type: THRESHOLD_USL, tag: PT-101}
    causes:
      FM-PRESSURE-OVERHEAT: refuted           # 온도 상승에 따른 압력 상승: TT-101 이 usl 미만이면 기각
      FM-PRESSURE-OUTLET-BLOCKED: refuted     # 배출 막힘: 밸브 개도 > 0 인데 FT-102 가 0 근처가 아니면 기각
      FM-PRESSURE-TRANSIENT: supported        # 순간 과압: 과압이 짧게(≤ 15s) 나타난 뒤 usl 아래로 복귀
    confirmed_cause: null
    sections_required: [AR100-PRESSURE-RESPONSE#1, AR100-PRESSURE-RESPONSE#2]
    sections_forbidden: [AR100-MIXER-RESPONSE#*]
    action: inspect_only                      # 고압 인터록은 가상설비(PLC) 가 담당. AI 는 점검 요청만
    code_change_lines: 0                      # 엔진·에이전트 코드 diff 0 줄이어야 통과
