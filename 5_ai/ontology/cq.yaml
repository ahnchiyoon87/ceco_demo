# Competency Questions (FINAL §14.2) — V1·V2 공통 측정. 추가만 가능.
# 판정: answered = 실제 조회(Cypher/SQL)로 근거와 함께 답이 나옴 / partial = 일부만 / no = 답할 데이터·관계 없음.
# 각 CQ 의 조회문은 5_ai/ontology/v1/cq-queries.md, 5_ai/ontology/v2/cq-queries.md 에 두고 실행 결과로 판정한다.
cqs:
  CQ01: VT-101은 어느 설비·부품의 무엇을 측정하는가?
  CQ02: R-101에 속한 설비와 센서는 무엇인가?
  CQ03: M-101에 적용되는 최신 절차 문서 버전은?
  CQ04: 이 알람을 만든 관측값(센서, 값, 시각, 품질)은?
  CQ05: 사건 X의 원인후보와 그 근거(관측값, 문서 버전)는?
  CQ06: 사건 X에서 관측 사실과 AI 추론은 각각 무엇인가?
  CQ07: 원인후보를 만든 Agent 실행(모델, 프롬프트 버전, 호출 도구)은?
  CQ08: 조치안 Y를 누가 언제 승인/반려했고 사유는?
  CQ09: 승인 시점과 실행 직전 조건이 달랐던 사례는?
  CQ10: 명령은 성공했으나 실제 상태가 바뀌지 않은 사례는?
  CQ11: 인터록으로 차단된 명령은? (경로 C1/C2/C3 구분)
  CQ12: 근거 문서 없이 제시된 원인후보가 있는가?
  CQ13: 같은 설비에서 반복된 사건은?
  CQ14: PT-101 고압 인터록 조건은 어떤 명령을 막는가?
  CQ15: 이 알람은 확인됐는가, 누가 언제? (ISA-18.2 상태)
