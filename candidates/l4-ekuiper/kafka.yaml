# eKuiper Kafka 소스 설정(/kuiper/etc/sources/kafka.yaml). -full 이미지의 kafka 플러그인이 읽는다.
# partition 은 적지 않는다: 문서 기본 예시의 partition: 0 은 한 파티션만 읽는다(raw 는 6 파티션) — ② 첫 확인 항목
default:
  brokers: "kafka:9092"
  groupID: "ekuiper-l4"
  maxBytes: 1000000
l4:
  brokers: "kafka:9092"
  groupID: "ekuiper-l4"
  maxBytes: 1000000
