# ═══ DMZ 브로커 — Mosquitto 2.1.2 ═══
# OT 허브 브리지가 들어오고(OT 가 연 연결), IT 수집기·DMZ 적재기·게이트웨이가 붙는다. DMZ 는 OT·IT 로 연결을 열지 않는다.
per_listener_settings false
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# 영속 저장: 브리지가 끊긴 동안 쌓인 요청이 브로커 재시작에도 남고, 만료되면 버려진다(격리 실습)
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
# 한도(건)는 .env MQTT_MAX_QUEUED_MESSAGES 가 정본(약 20 msg/s × 1 h = 72000)
max_queued_messages __MQTT_MAX_QUEUED_MESSAGES__
# 끊긴 채 다시 오지 않는 세션 유지(clean session 꺼짐) 클라이언트의 세션을 버퍼 목표와 같은 1시간 뒤 지운다.
# 기본값은 '만료 없음'이라 버려진 세션이 한도까지 쌓다 계속 버린다
persistent_client_expiration 1h
max_queued_bytes 33554432
sys_interval 10
log_type error
log_type warning
log_type notice
connection_messages true
