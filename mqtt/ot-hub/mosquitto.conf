# ═══ OT 허브(사이트 브로커, UNS) — Mosquitto 2.1.2 ═══
# 엣지·FUXA·OT 수신기가 붙는다. DMZ 브로커로 가는 연결은 이 허브가 브리지로 먼저 연다(HANDOFF §2-1 ①).
per_listener_settings false
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
# 끊김 버퍼(17번 D10): 한도 = 초당 건수 × 목표 보관 시간(약 20 msg/s × 1 h), 디스크·메모리 상한은 바이트로.
# 넘치면 새 값을 버리고 $SYS/broker/publish/messages/dropped 로 센다.
# 한도(건)는 .env MQTT_MAX_QUEUED_MESSAGES 가 정본(약 20 msg/s × 1 h = 72000)
max_queued_messages __MQTT_MAX_QUEUED_MESSAGES__
# 끊긴 채 다시 오지 않는 세션 유지(clean session 꺼짐) 클라이언트의 세션을 버퍼 목표와 같은 1시간 뒤 지운다.
# 기본값은 '만료 없음'이라 버려진 세션이 한도까지 쌓다 계속 버린다
persistent_client_expiration 1h
max_queued_bytes 33554432
sys_interval 10
log_type error
log_type warning
log_type notice
connection_messages true

# ── DMZ 브로커로 가는 브리지(OT 가 연다). MQTT 5 로 두어 메시지 만료가 넘어가게 한다(17번 E16) ──
connection dmz
address dmz-broker:1883
bridge_protocol_version mqttv50
bridge_session_expiry_interval 3600
remote_clientid ot-hub-bridge
local_clientid ot-hub-bridge-local
remote_username bridge-ot
remote_password __MQTT_BRIDGE_PASSWORD__
cleansession false
restart_timeout 1 10
# out = 데이터·상태·ACK·통신 상태·요청 응답(QoS 1, 끊기면 위 버퍼)
topic AR-100/reaction/+/+/tag/+ out 1
topic AR-100/reaction/+/+/status/+ out 1
topic AR-100/reaction/+/+/ack/+ out 1
topic AR-100/reaction/+/+/state/+ out 1
topic AR-100/response/# out 1
# in = DMZ 요청 토픽(QoS 1·세션 유지)과 읽기 전용 분석 경고. 브리지 in 에는 로컬 ACL 이 걸리지 않으므로(⑨-4) 이 두 줄이 거르는 역할을 한다
topic AR-100/request/in in 1
topic AR-100/alert/display in 0
