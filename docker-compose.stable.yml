# V1 안정화 덧씌우기 — 원본 V1 compose 위에 얹는다(원본 파일은 고치지 않는다).
# 세션 2~4 에서 실측으로 찾아 고친 "같은 제품이면 어디서나 필요한 수정"만 모았다. 근거: reports/STABILITY.md, decision-log.
#   docker compose --env-file .env --env-file .env.rotation \
#     -f docker-compose.yml -f docker-compose.edgex.yml -f docker-compose.timescale.yml -f docker-compose.stable.yml \
#     --profile edgex up -d --no-build
#
# 1) Flink 재시작 복구(HA, ZooKeeper) — S1: V1 은 HA 가 꺼져 JobManager·Docker 재시작 때 탐지 잡이 사라짐.
#    Flink 2.2.1 빌드(flink/Dockerfile.v2, ONNX 잡 onnx-job-2x)로 판정 70/70 이 V1 알람과 같고, JobManager kill 뒤 잡 4개 자동 복귀를 확인했다(#107).
# 2) ONNX 잡 체크포인트 — S17: V1 제출 설정에 체크포인트가 없어 ML 잡 상태를 복원하지 못함 → client-config.v2.yaml(10 s).
# 3) Kafka 데이터 위치 — S21: KAFKA_LOG_DIRS 가 없으면 이미지 기본값 /tmp 에 저장돼 볼륨이 비고, 재생성 때 데이터가 사라짐.
# 4) InfluxDB 설정 볼륨 — S15: /etc/influxdb2 가 이름 없는 볼륨이면 같은 이름 컨테이너 재생성 때 옛 설정이 넘어와 초기 설정이 실패함.

services:
  zookeeper:
    image: zookeeper:3.9.5
    container_name: ${CN_PREFIX:-}zookeeper
    hostname: zookeeper
    restart: unless-stopped
    networks: [iiot]
    volumes:
      - zookeeper-data:/data

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile.v2
    image: rot-flink-onnx:v2
    depends_on: [zookeeper]
    volumes:
      - ./flink/conf/config.v2.yaml:/opt/flink/conf/config.yaml:ro

  flink-taskmanager:
    image: rot-flink-onnx:v2
    volumes:
      - ./flink/conf/config.v2.yaml:/opt/flink/conf/config.yaml:ro

  flink-job-submitter:
    image: rot-flink-onnx:v2
    volumes:
      - ./flink/conf/client-config.v2.yaml:/opt/flink/conf/config.yaml:ro

  kafka:
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data

  influxdb:
    volumes:
      - influx-config:/etc/influxdb2

  # 5) 원본 FUXA 이미지는 digest로만 고정돼 있다 — 태그 고정 원칙에 따라 V1 기록 판으로 고정.
  fuxa:
    image: frangoteam/fuxa:1.3.4

volumes:
  zookeeper-data:
  influx-config:
