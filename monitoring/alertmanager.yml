route:
  receiver: default
  group_by: [alertname, tier]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  # 데모 구성이라 수신처는 로그 전용입니다.
  # 실제 운영에서는 webhook/email/slack 수신자를 여기에 추가하세요.
  - name: default

inhibit_rules:
  # 서비스 자체가 죽었으면 그 서비스에서 파생된 경보는 억제한다
  - source_matchers: [alertname = "PipelineServiceDown"]
    target_matchers: [severity = "warning"]
    equal: [tier]
