# ═══ DMZ 수신 Prometheus: OT agent 의 remote_write 를 받고(짧게 보관), DMZ 대상도 직접 읽는다 ═══
global: { scrape_interval: 15s, external_labels: { zone: dmz } }
scrape_configs:
  - job_name: dmz-loader        # 적재기 + DMZ 브로커 $SYS 지표(같은 Bento 의 두 스트림)
    static_configs: [ { targets: ['dmz-loader:4195'] } ]
  - job_name: dmz-gateway
    static_configs: [ { targets: ['dmz-gateway:8088'] } ]
  - job_name: dmz-influx
    static_configs: [ { targets: ['dmz-influx:8086'] } ]
  - job_name: dmz-prom
    static_configs: [ { targets: ['localhost:9090'] } ]
