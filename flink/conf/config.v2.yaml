# ═══════════════════════════════════════════════════════════════
# Flink 1.20 — 설정 (Flink 1.19+ 신규 config.yaml 포맷)
# ═══════════════════════════════════════════════════════════════
# ── 장애 복구 ──
# 기본값(NoRestartBackoffTimeStrategy)은 한 번 실패하면 잡이 그대로 죽는다.
# TaskManager 하트비트 타임아웃 같은 일시적 장애에서 자동 복구되도록 한다.
# 체크포인트가 있으므로 복구 시 정확히 한 번 의미가 유지된다 (PDF p.6).
restart-strategy:
  type: exponential-delay
  exponential-delay:
    initial-backoff: 5s
    max-backoff: 2min
    backoff-multiplier: 2.0
    reset-backoff-threshold: 10min
    jitter-factor: 0.1

heartbeat:
  timeout: 120000
  interval: 10000

jobmanager:
  rpc:
    address: flink-jobmanager
    port: 6123
  memory:
    process:
      size: 1024m   # (경량화 #131) 1600m → 1024m. 힙 실측 245 MB. 공식 규칙: 704m 에서 권장 힙 128 MB(리서치 09)
  execution:
    failover-strategy: region
  bind-host: 0.0.0.0

# Java 17 모듈 접근 옵션. 이미지 기본 config.yaml 을 덮어쓰면 이 값이 사라져
# 잡 제출 시 InaccessibleObjectException 이 발생하므로 반드시 함께 유지한다.
env:
  java:
    opts:
      all: --add-exports=java.base/sun.net.util=ALL-UNNAMED --add-exports=java.rmi/sun.rmi.registry=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED

taskmanager:
  bind-host: 0.0.0.0
  host: flink-taskmanager
  numberOfTaskSlots: 8
  memory:
    process:
      size: 1536m   # (경량화 #131) 4608m → 1536m. 힙 실측 527 MB. 관리 메모리 0(HashMap 상태) → 힙 약 850 MB
    managed:
      fraction: 0.0 # HashMap 상태 저장은 관리 메모리를 쓰지 않음 — 공식 문서 권고(리서치 09)

parallelism:
  default: 2

rest:
  address: 0.0.0.0
  bind-address: 0.0.0.0

execution:
  checkpointing:
    interval: 10s
    mode: EXACTLY_ONCE
    timeout: 60s
    min-pause: 5s
    externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

state:
  backend:
    type: hashmap                 # (경량화 #131) rocksdb → hashmap. 12태그 창 상태라 작음. 체크포인트·HA 복구 지원(공식 문서, 리서치 09)
  checkpoints:
    dir: file:///opt/flink/checkpoints
  savepoints:
    dir: file:///opt/flink/savepoints

# ── Prometheus 노출: 체크포인트 소요·실패, 백프레셔 등 인프라 지표 ──
#    (센서 데이터는 InfluxDB 로. PDF p.7 역할 분리 원칙)
metrics:
  reporter:
    prom:
      factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      port: 9249
  reporters: prom

# ── V2: Flink 재시작 복구(고가용성, Flink 내장 기능 — 설정만, #94) ──
# V1 은 이 기능이 꺼져 있어 JobManager 가 재시작하면 잡 4개가 사라지고 사람이 다시 제출해야 했다(대장 S1, #4·#81).
# ZooKeeper 가 JobManager 의 잡 목록·최신 체크포인트 위치를 보관하고, 재시작한 JobManager 가 그 자리에서 잡을 되살린다.
high-availability:
  type: zookeeper
  # 체크포인트 볼륨(flink 사용자 소유) 안에 둔다 — 별도 명명 볼륨은 root 소유라 JobManager 가 못 쓴다(l4bench flinkha 에서 확인)
  storageDir: file:///opt/flink/checkpoints/ha
  cluster-id: /rot-iiot-v2
  zookeeper:
    quorum: zookeeper:2181
    path:
      root: /flink
