</style></head><body><header><h1>IoT-SCADA · Pilot 프로토타입 아키텍처</h1><p><b>Pilot은 이상 사건을 받아 AI 조사·담당자 승인·설비 조치·결과 확인을 하나로 이어주는 업무 서비스입니다.</b> Agent는 그 안에서 근거를 조사하고 대응안을 만드는 역할을 합니다.</p><p class="note">교육용 가상 설비에서 승인 후 Modbus 정지와 결과 확인까지 시연했습니다. 현재 AI 분석은 버튼으로 시작하며, 자동 시작 연결과 70명 운영 검증은 남아 있습니다.</p><nav><a href="#p1">아키텍처</a><a href="#p2">결정할 사항</a><button onclick="window.print()">인쇄</button></nav></header><main><section id="p1"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABdIAAAg8CAIAAADeDZHCAAAACXBIWXMAAA7EAAAOxAGVKw4bAAP7k0lEQVR4nOzdh1sVZ97/8d9fsftkn63PZrMbdzcxiembmB7TN6ZHjcZu7F1BEUEsiF0s2AUrdsWGFRv2XkApihUriIiK8PvKbGbHe+bMmVPmCDnv1/W9csVzpp05M3Pm/jBzz/+rBAAAAAAAgAv+36NeAAAAAAAAgF8mYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOAKYhcAAAAAAABXELsAAAAAAAC4gtgFAAAAAADAFcQuAAAAAAAAriB2AQAAAAAAcAWxCwAAAAAAgCuIXQAAAAAAAFxB7AIAAAAAAOCKsItdyu7eKy4toyiKoiiKoiiKoigqBCXN8EedBDxKxC4URVEURVEURVEURblVxC7hhdiFoiiKoiiKoiiKokJWxC7hhdiFoiiKoii
